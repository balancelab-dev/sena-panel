<style>
/* ============ Sena Panel — pastel tasarım sistemi ============ */
:root{
  color-scheme: light;
  /* zemin & yüzeyler */
  --bg:#f6f1ea;            /* sayfa — sıcak krem */
  --bg-2:#f1eae0;
  --card:#fffdf9;          /* kart yüzeyi */
  --card-2:#fbf7f0;
  --line:#e9e2d6;          /* hairline */
  --line-2:#ddd4c4;
  --field-line:#918a7d;    /* alan sınırı: kart ve sayfa zemininde >=3:1 (WCAG 1.4.11) */
  /* mürekkep */
  --ink:#2e2a26;
  --ink-2:#5f594f;
  --muted:#6f675b;         /* kart/zeminde >=4.5:1 (Gökhan onayı 10-13; eski #948c80 ~3:1) */
  /* marka — adaçayı */
  --brand:#557d63;
  --brand-2:#436a51;
  --brand-soft:#e7efe4;
  --brand-soft-2:#d5e3d2;
  /* pastel çipler */
  --p-sage:#e7efe4;  --p-sage-ink:#3d6248;
  --p-blush:#f9e8ea; --p-blush-ink:#96455c;
  --p-sky:#e4edf7;   --p-sky-ink:#33608f;
  --p-sand:#f6ecda;  --p-sand-ink:#8a6420;
  --p-lav:#ece8f7;   --p-lav-ink:#5b4f96;
  /* grafik serileri (doğrulanmış) */
  --s1:#4a7fc1; --s2:#d96b3f; --s3:#2aa27a; --s4:#7b6bc9; --s5:#d1608f;
  /* sıralı rampa (mavi) */
  --seq1:#dceafb; --seq2:#b7d3f6; --seq3:#86b6ef; --seq4:#5598e7; --seq5:#3987e5; --seq6:#256abf; --seq7:#1c5cab;
  /* durum */
  --good:#2e7d4f; --good-soft:#e2efe4;
  --warn:#a06e10; --warn-soft:#f8ecd2;
  --serious:#b4552e; --serious-soft:#f9e5da;
  --crit:#b13a3a; --crit-soft:#f8e0e0;
  /* çip metni: soft zeminde >=4.5:1 (çipte --good/--warn/--serious yerine; çizgi/nokta renkleri aynı kalır) */
  --good-ink:#2a7449; --warn-ink:#8a5d0a; --serious-ink:#a24b27;
  /* gölge & yuvarlaklık */
  --r:16px; --r-s:10px;
  --shadow:0 1px 2px rgba(60,50,35,.05),0 6px 22px -8px rgba(60,50,35,.12);
  --shadow-lg:0 8px 40px -6px rgba(50,40,25,.25);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,a,summary,label,select,.row.click,.cal-cell,.appt,.week-col .evt,[role=button]{touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-weight:650;letter-spacing:-.01em}
::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ============ yerleşim ============ */
#app{display:none;min-height:100dvh}
#app.ready{display:flex}
.sidebar{width:228px;flex:0 0 228px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:20px 14px}
.main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1240px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#a8c3ab,#7fa389);
  color:#fffdf9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
.brand b{font-size:16.5px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:11.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--ink-2);font-weight:550;font-size:14px;text-align:left;width:100%}
.nav button svg{width:19px;height:19px;flex:0 0 19px}
@media(hover:hover){.nav button:hover{background:var(--card-2)}}
.nav button:active{background:var(--card-2)}
.nav button.on{background:var(--brand-soft);color:var(--brand-2)}
.nav .spacer{flex:1}
.sync-pill{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;
  background:var(--card-2);font-size:12px;color:var(--ink-2);border:1px solid var(--line)}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 8px}
.sync-pill .txt{flex:1;min-width:0;line-height:1.35}
.sync-pill.ok .dot{background:var(--good)}
.sync-pill.err .dot{background:var(--crit)}
.sync-pill.busy .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.userchip{display:flex;align-items:center;gap:9px;padding:10px 12px;margin-top:8px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.userchip .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--ink)}
.userchip small{color:var(--muted);font-size:11px;display:block}
.userchip b{font-size:13px}

/* üst bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px;width:100%}
.topbar .grow{flex:1}

/* mobil */
.tabbar{display:none}
.mobile-top{display:none}
@media(max-width:900px){
  #app{flex-direction:column}
  .hat-satir{flex-wrap:wrap}
  .hat-satir .end{flex:1 0 100%;justify-content:flex-end} /* telefonda düğmeler ismin altına: ad kesilmesin */
  .hat-dugme span{display:none} /* telefonda yalnız zil: «Danışan ekle» alt satıra düşmesin */
  .sidebar{display:none}
  /* alt boşluk FAB'ın üstünü de kapsar: 84 (alt) + 54 (FAB) + 16 (nefes) + güvenli alan */
  .main{padding:14px max(14px,env(safe-area-inset-right)) calc(84px + 54px + 16px + var(--safe-b)) max(14px,env(safe-area-inset-left))}
  .mobile-top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 4px max(16px,env(safe-area-inset-left))}
  .mobile-top .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#a8c3ab,#7fa389);color:#fffdf9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
  .mobile-top b{font-size:15.5px}
  .mobile-top small{display:block;color:var(--muted);font-size:11px}
  .mobile-top .grow{flex:1}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,253,249,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right)) calc(6px + var(--safe-b)) max(4px,env(safe-area-inset-left))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;
    font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--brand-2)}
  .topbar h1{font-size:19px}
}

/* ============ kartlar & bileşenler ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:14.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h3 svg,h2 svg,summary svg{width:17px;height:17px;flex:0 0 17px;color:var(--brand)}
.card h3 .hint{font-weight:450;color:var(--muted);font-size:12px;margin-left:auto}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}.grid.cols-2{grid-template-columns:1fr}}

/* stat kutusu */
.stat{padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--ink-2);font-weight:550}
.stat .val{font-size:24px;font-weight:680;margin-top:3px;letter-spacing:-.02em}
.stat .delta{font-size:11.5px;font-weight:600;margin-top:2px;display:inline-flex;align-items:center;gap:3px}
.stat .delta.iyi{color:var(--good)}.stat .delta.kotu{color:var(--crit)}.stat .delta.flat{color:var(--muted)}
.stat .delta-taban{font-size:11px;color:var(--muted);margin-top:1px}
.stat .spark{margin-top:6px}
@media(max-width:560px){.stat .val{font-size:20px}}

/* butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:12px;
  font-weight:600;font-size:13.5px;background:var(--brand);color:#fffdf9;transition:.15s;border:1px solid transparent}
@media(hover:hover){.btn:hover{background:var(--brand-2)}}
.btn.ghost{background:var(--card);color:var(--ink-2);border-color:var(--line-2)}
@media(hover:hover){.btn.ghost:hover{background:var(--card-2)}}
.btn.soft{background:var(--brand-soft);color:var(--brand-2)}
@media(hover:hover){.btn.soft:hover{background:var(--brand-soft-2)}}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.icon{padding:9px;border-radius:12px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}

/* rozet & çip */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.sage{background:var(--p-sage);color:var(--p-sage-ink)}
.chip.blush{background:var(--p-blush);color:var(--p-blush-ink)}
.chip.sky{background:var(--p-sky);color:var(--p-sky-ink)}
.chip.sand{background:var(--p-sand);color:var(--p-sand-ink)}
.chip.lav{background:var(--p-lav);color:var(--p-lav-ink)}
.chip.gray{background:var(--bg-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.serious{background:var(--serious-soft);color:var(--serious-ink)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}

/* uyarı satırı */
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:13px;font-size:13px}
.alert .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.alert .ico svg{width:16px;height:16px}
.alert b{display:block;font-size:13px}
.alert small{color:var(--ink-2);font-size:12px}
.alert .act{margin-left:auto;align-self:center}
.alert.warn{background:var(--warn-soft)}.alert.warn .ico{background:rgba(160,110,16,.14);color:var(--warn)}
.alert.crit{background:var(--crit-soft)}.alert.crit .ico{background:rgba(177,58,58,.12);color:var(--crit)}
.alert.serious{background:var(--serious-soft)}.alert.serious .ico{background:rgba(180,85,46,.13);color:var(--serious)}
.alert.info{background:var(--p-sky)}.alert.info .ico{background:rgba(51,96,143,.12);color:var(--p-sky-ink)}
.alert.good{background:var(--good-soft)}.alert.good .ico{background:rgba(46,125,79,.12);color:var(--good)}

/* liste satırları */
.row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink);flex:0 0 38px}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .body small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex-shrink:0}
.row .end b{font-size:14px;display:block}
.row .end small{font-size:11.5px;color:var(--muted)}
.row.click{cursor:pointer;border-radius:10px;margin:0 -6px;padding:11px 12px}
@media(hover:hover){.row.click:hover{background:var(--card-2)}}
.row.click:active{background:var(--card-2)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:6px}

/* form */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--field-line);
  border-radius:11px;background:var(--card);font-size:14.5px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.field .help{font-size:11.5px;color:var(--muted);margin-top:4px}
/* «Ücretsiz seans» kutucuğu (randevu formu) — dokunma alanı ≥44px */
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin:-6px 0 8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand);margin:0}
.field input:disabled{opacity:.5}
.frow{display:flex;gap:10px}.frow>.field{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--bg-2);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(46,42,38,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:.18s;pointer-events:none}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:var(--card);width:100%;max-width:470px;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px 20px calc(22px + var(--safe-b));transform:translateY(30px);transition:.2s;box-shadow:var(--shadow-lg)}
.modal-bg.open .modal{transform:none}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:20px;padding-bottom:22px}}
.modal h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center}
.modal h2 .x{margin-left:auto;color:var(--muted);padding:4px}
.modal .actions{display:flex;gap:9px;margin-top:16px}
.modal .actions .btn{flex:1}

/* toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.toast{background:var(--ink);color:#fdfcf9;padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:550;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:tin .25s}
.toast.err{background:#8f3232}
.toast.ok{background:var(--brand-2)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ============ takvim ============ */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-size:16.5px;min-width:150px;text-transform:capitalize}
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-month .dow{text-align:center;font-size:11px;font-weight:650;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
@media(hover:hover){.cal-cell:hover{border-color:var(--line-2);background:var(--card-2)}}
.cal-cell:active{background:var(--card-2)}
.cal-cell.dim{background:transparent;border:1px dashed var(--line-2)} /* komşu ay: okunur ama bu aydan ayrışır (masa 10-14) */
.cal-cell.dim .d{color:var(--muted)}
.cal-cell.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.cal-cell .d{font-size:12px;font-weight:650;color:var(--ink-2)}
.cal-cell .evt{font-size:11px;font-weight:600;padding:1.5px 5px;border-radius:5px;margin-top:2.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell .more{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
@media(max-width:900px){.cal-cell{min-height:56px;padding:3px 4px}.cal-cell .evt{display:none}
  .cal-cell .pips{display:flex;gap:2.5px;flex-wrap:wrap;margin-top:3px}
  .cal-cell .pip{width:6px;height:6px;border-radius:50%}}
.pips{display:flex;gap:2.5px;flex-wrap:wrap;margin-top:3px}
.pip{width:6px;height:6px;border-radius:50%}
@media(min-width:901px){.cal-cell .pips{display:none}}
.day-list .hourblock{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.day-list .hr{width:46px;flex:0 0 46px;text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding-top:8px}
.appt{flex:1;border-radius:12px;padding:9px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;border-left:4px solid transparent}
.appt b{font-size:13.5px}
.appt small{display:block;color:var(--ink-2);font-size:11.5px}
.appt .st{margin-left:auto;flex-shrink:0}
.appt.planlandi{background:var(--p-sky);border-color:var(--s1)}
.appt.geldi{background:var(--good-soft);border-color:var(--good)}
.appt.gelmedi{background:var(--serious-soft);border-color:var(--serious)}
.appt.iptal{background:var(--bg-2);border-color:var(--muted);opacity:.75}
.appt.iptal b{text-decoration:line-through}
.appt.revize{background:var(--p-lav);border-color:var(--s4);opacity:.85}

/* hafta görünümü */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;min-height:120px}
.week-col.today{border-color:var(--brand)}
.week-col .wd{font-size:11px;font-weight:700;color:var(--ink-2);text-align:center;margin-bottom:5px}
.week-col .wd small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.week-col .evt{font-size:11px;font-weight:600;border-radius:7px;padding:3px 6px;margin-bottom:3px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.week-grid{display:none}}

/* ============ grafikler ============ */
.viz{position:relative}
.viz svg{display:block;width:100%;height:auto}
.viz .axis{font-size:11px;fill:var(--muted)}
.viz .grid-l{stroke:var(--line);stroke-width:1}
.viz .base-l{stroke:var(--line-2);stroke-width:1}
.viz .dlabel{font-size:11px;font-weight:650;fill:var(--ink-2)}
.viz-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fdfcf9;border-radius:10px;
  padding:8px 11px;font-size:12px;z-index:30;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;min-width:110px}
.viz-tip .t{font-size:10.5px;color:#c9c4bb;font-weight:600;margin-bottom:3px}
.viz-tip .r{display:flex;align-items:center;gap:7px;margin-top:2px}
.viz-tip .k{width:12px;height:3px;border-radius:2px;flex:0 0 12px}
.viz-tip .v{font-weight:700;margin-left:auto;padding-left:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:550}
.legend i{width:11px;height:11px;border-radius:3.5px}
.legend i.line{height:3px;border-radius:2px;width:14px}
.tbl-toggle{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:auto}
.viz-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.viz-table th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line)}
.viz-table td{padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.viz-table td.num{text-align:right}
.heat-cell{cursor:default}

/* rapor tablosu */
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:650;padding:7px 8px;border-bottom:1px solid var(--line-2);text-transform:uppercase;letter-spacing:.03em}
table.data td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.data td.num,table.data th.num{text-align:right}
table.data tr:last-child td{border-bottom:none}

/* ============ giriş ekranı ============ */
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#f2ede4,#e9efe6 55%,#f4e9e6);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate-card{background:rgba(255,253,249,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);
  border-radius:26px;box-shadow:var(--shadow-lg);padding:34px 30px;width:100%;max-width:400px}
.gate-card .logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#a8c3ab,#7fa389);
  color:#fffdf9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:27px;margin:0 auto 14px}
.gate-card h1{text-align:center;font-size:21px}
.gate-card .sub{text-align:center;color:var(--ink-2);font-size:13px;margin:5px 0 20px}
.who{display:flex;gap:10px;margin-bottom:16px}
.who button{flex:1;padding:14px 8px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--card);
  display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:650;font-size:14px;color:var(--ink-2)}
.who button .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:16px}
.who button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}
.gate-err{background:var(--crit-soft);color:var(--crit);border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:600;margin-bottom:12px;display:none}
.gate-note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
/* D3a — kilit kartı: uzun içerik (klavye açık / kısa ekran) yukarıdan kesilmez, kartın içi kayar; yeni modlar */
#gate{align-items:flex-start}
.gate-card{margin:auto}
.gate-alan-err{color:var(--crit);font-size:12.5px;font-weight:600;margin-top:5px;line-height:1.4}
.field input[aria-invalid=true]{border-color:var(--crit)}
.gate-kod{letter-spacing:.06em;text-transform:uppercase}
.gate-kod::placeholder{letter-spacing:.02em;text-transform:none}
.gate-unuttum{text-align:center;margin-top:6px}
.gate-unuttum .gate-note{margin-top:10px}
.gate-unuttum-btn{min-height:44px}
.gate-kod-kutu{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:6px 0 0;padding:18px 12px;border:1.5px dashed var(--field-line);
  border-radius:16px;background:var(--card);user-select:all;-webkit-user-select:all;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:.08em;color:var(--ink)}
.gate-kod-grup{white-space:nowrap}
.gate-kod-aciklama{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:14px 0}
/* D3b — Ayarlar: cihaz ekleme / kurtarma kodu blokları + davet penceresi (QR ve kod YAN YANA değil, ayrı kanal: kod büyük, altında geçerlilik) */
.ayar-blok{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ayar-blok-baslik{font-size:14px;font-weight:700;margin:0 0 6px}
.ayar-blok-aciklama{color:var(--ink-2);line-height:1.5;margin:0 0 10px}
.ayar-blok-neden{color:var(--muted);line-height:1.5;margin:8px 0 0}
.davet-qr{width:min(100%,260px);margin:0 auto 14px;background:#fff;border-radius:12px;overflow:hidden;line-height:0}
.davet-adimlar{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:14px;line-height:1.5}
.davet-adimlar li{margin-bottom:4px}
.davet-kod-etiket{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;text-align:center}
.davet-kod{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;padding:16px 10px;border:1.5px dashed var(--field-line);border-radius:16px;background:var(--card);
  user-select:all;-webkit-user-select:all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.davet-kod-grup{white-space:nowrap}
.davet-gecerlilik{text-align:center;margin:10px 0 2px;font-weight:650;color:var(--ink)}
.davet-kod-notu{text-align:center;color:var(--muted);line-height:1.5;margin:0 0 14px}

/* yardımcılar */
.mt{margin-top:14px}.mb{margin-bottom:14px}
.muted{color:var(--muted)}.small{font-size:12px}
.flex{display:flex;align-items:center;gap:10px}.grow{flex:1}
.right{text-align:right}
.money{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--crit)}
.hide{display:none!important}
.searchbox{position:relative;flex:1;max-width:320px}
.rozet{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.nav button .rozet{margin-left:auto}
.tabbar button{position:relative}
.tabbar button .rozet{position:absolute;top:1px;left:calc(50% + 6px)}
.ara-dugme{width:100%;justify-content:flex-start;gap:8px;margin:0 0 12px}
.searchbox input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--field-line);border-radius:12px;background:var(--card);font-size:13.5px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + var(--safe-b));z-index:35;width:54px;height:54px;border-radius:18px;
  background:var(--brand);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}
.fab svg{width:24px;height:24px}
@media(max-width:900px){.fab{display:flex}}
details.acc{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:var(--card)}
details.acc summary{padding:12px 15px;font-weight:600;font-size:13.5px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc .inner{padding:2px 15px 14px}
.progress-line{height:6px;border-radius:4px;background:var(--seq1);overflow:hidden}
.progress-line i{display:block;height:100%;border-radius:4px;background:var(--seq5)}

/* muhasebe özeti — yazdırma sayfası */
#printsheet{display:none;position:fixed;inset:0;background:#fff;color:#111;z-index:150;overflow:auto;
  padding:34px clamp(16px,6vw,70px)}
#printsheet.open{display:block}
@media print{
  body>*{display:none!important}
  body #printsheet{display:block!important;position:static;padding:0;overflow:visible}
  .no-print{display:none!important}
}
select:disabled{opacity:.45}

/* ============ dokunma, telefon ve hareket (dört göz K1) ============ */
.tabbar button:active{background:var(--brand-soft)}
.fab:active{transform:scale(.94)}

/* telefon (<=900): formdaki .seg tam genişlik + eşit parça (5'li durum tek satır); satır alt yazısı 2 satıra kadar; alan hizası */
@media(max-width:900px){
  .field .seg{display:flex;width:100%;flex-wrap:nowrap}
  .field .seg button{flex:1 1 0;min-width:0;padding:6px 2px;text-align:center;white-space:nowrap}
  .row .body small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
  .frow{align-items:flex-end}
  .field textarea{min-height:104px}
  /* iOS odakta yakınlaştırıp zıplamasın: alan yazısı >=16px */

}

/* dokunmatik (pointer:coarse): etkin hedef >=44px. Görsel boyut korunur (::after genişletir); .seg ve .x gerçek boyutla büyür. */
@media(pointer:coarse){
  /* taban: tüm düğme, açılır başlık ve alanlar (masa 10-13; K1 ölçümünde kalan 39 hedefin hepsi bunlardı) */
  .btn,summary,select,input,.searchbox input{min-height:44px}
  .seg{gap:6px}
  .seg button{min-height:44px;min-width:44px;padding-left:10px;padding-right:10px}

  .btn.icon::after{content:"";position:absolute;inset:-6px}
  .tbl-toggle::after{content:"";position:absolute;inset:-14px -6px}
  .modal h2 .x{min-width:44px;min-height:44px;margin:-10px -10px -10px auto;display:inline-flex;align-items:center;justify-content:center}
  .userchip a{padding:14px 8px;margin:-14px -8px}
  .modal>button[type=button]{min-height:44px;display:inline-flex;align-items:center}
}

/* hareketi azalt */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* onay penceresi (K2): alttaki pencerenin üstüne ikinci çekmece gibi binmez — telefonda da ortada küçük diyalog */
.modal-bg.onay{align-items:center;padding:16px}
.modal.onay{max-width:340px;border-radius:20px;padding-bottom:22px;transform:translateY(8px) scale(.97)}

/* form içi hata satırı (K3.5): Kaydet'in hemen üstünde; alan işaretli */
.form-hata{margin:0 0 10px;padding:9px 12px;border-radius:var(--r-s);background:var(--crit-soft);color:var(--crit);font-size:13px;font-weight:650}
[aria-invalid=true]{border-color:var(--crit)!important}

/* K3b2: telefon üst bar eşitleme durumu · takvim ay görünümü toplam metni + lejant */
.mobile-top small .err{color:var(--crit);font-weight:650}

@media(max-width:900px){

}
.cal-lejant{margin-top:12px}
/* telefonda form dışı seçici şeritler (süzgeç, sekme) tek satır kalır, sığmazsa yana kayar (masa, K3b2) */
@media(max-width:900px){.seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:0 0 auto;white-space:nowrap}}


/* ============ E4: Para nereye gitti? kartı (Finans > Özet en üstü) ============
   Telefon ASIL görünümdür (≤900): dikey mini akış + açılır «Her 100 ₺» listesi. Masaüstü (≥901): Sankey + koyu «Her 100 ₺» paneli. */
.akis{margin-bottom:14px;padding:20px 22px}
.akis-ust{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.akis-goz{font-size:11px;font-weight:650;letter-spacing:.12em;color:var(--muted)}
.card h3.akis-baslik{display:block;font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 0}
.akis-cumle{margin:14px 0 4px;font-size:15px;line-height:1.5;color:var(--ink-2);max-width:64ch}
.akis .empty{padding:22px 0 6px}
.akis-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 6px}
.akis-kpi-kart{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.akis-kpi-kart.vurgulu{background:var(--ink);border-color:var(--ink);color:#fdfcf9}
.akis-kpi-et{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.akis-kpi-de{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.akis-kpi-ek{font-size:12px;color:var(--muted);margin-top:2px}
.akis-kpi-kart.vurgulu .akis-kpi-et,.akis-kpi-kart.vurgulu .akis-kpi-ek{color:#d9d3c8}
.akis-govde{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px}
.akis-sankey,.akis-mini{min-width:0}
/* SVG yazıları (diyagramlar) */
.akis-et{font-size:11px;font-weight:650;letter-spacing:.08em;fill:var(--muted)}
.akis-tu{font-size:15px;font-weight:750;fill:var(--ink)}
.akis-tu.orta{font-size:17px}
.akis-tu.buyuk{font-size:24px}
.akis-tu.kalan{font-size:26px;fill:var(--brand-2)}
.akis-mini .akis-tu.kalan{font-size:20px}
.akis-yz{font-size:11px;font-weight:650;fill:var(--muted)}
.akis-sankey text{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.akis-sankey .baglanti{transition:fill-opacity .12s}
@media(hover:hover){.akis-sankey .baglanti:hover{fill-opacity:.6}}
/* «Her 100 ₺» */
.akis-yuz{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px 6px}
.akis-yuz-et{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.akis-yuz-donem,.akis-yuz-100{display:none}
.akis-grup{border-top:1px solid var(--line)}
.akis-yuz-et+.akis-grup{margin-top:6px}
.akis-satir{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:8px;width:100%;min-height:56px;padding:10px 0;text-align:left;color:inherit;font:inherit}
.akis-sa-ad{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650}
.akis-sa-ad::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--grup);flex:0 0 10px}
.akis-grup.not .akis-sa-ad::before{background:transparent;border:1.5px dashed var(--muted)}
.akis-ok{margin-left:4px;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.6}
.akis-grup.acik .akis-ok{transform:translateY(2px) rotate(-135deg)}
.akis-sa-oran{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.akis-sa-oran b{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
.akis-sa-oran small{font-size:12px;color:var(--muted)}
.akis-cubuk{grid-column:1/-1;height:6px;border-radius:4px;background:var(--bg-2);overflow:hidden}
.akis-cubuk i{display:block;height:100%;border-radius:4px;background:var(--grup)}
.akis-kats{list-style:none;padding:0 0 8px 18px}
.akis-kat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px dashed var(--line)}
.akis-kat-de b{font-size:14px;font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.akis-kat-de small{font-size:12px;color:var(--muted)}
@media(min-width:901px){
  .akis-tel{display:none}
  .akis-yuz{background:var(--ink);border-color:var(--ink);color:#fdfcf9;border-radius:18px;padding:20px 20px 10px}
  .akis-yuz-et,.akis-yuz small{color:#d9d3c8}
  .akis-yuz-donem{display:block;font-size:17px;font-weight:700;margin-top:6px}
  .akis-yuz-100{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px;color:#f1e6d4}
  .akis-grup{border-top-color:rgba(255,255,255,.14)}
  .akis-cubuk{background:rgba(255,255,255,.16)}
  .akis-kat{border-top-color:rgba(255,255,255,.12)}
  .akis-grup:not(.acik) .akis-kat:nth-child(n+4){display:none}
}
@media(min-width:1280px){.akis-govde{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.akis-diyagram{align-self:center}}
/* iPad dik (700–900 px, Gökhan 10-22): büyük Para Haritası + KPI şeridi görünür, dikey mini akış gizlenir; telefonda mini akış */
@media(max-width:699px){.akis-masa{display:none}.akis-kpi{display:none}}
@media(min-width:700px) and (max-width:900px){.akis-tel{display:none}}
@media(max-width:900px){
  .akis{padding:16px 14px}
  .card h3.akis-baslik{font-size:22px}

  .akis-grup:not(.acik) .akis-kats{display:none}
}

      while (true) {
        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

/* DOM kurucu: h('div.card',{onclick:..},child...) */
function h(tag,attrs,...kids){
  const parts=tag.split('.');const el=document.createElement(parts[0]||'div');
  if(parts.length>1)el.className=parts.slice(1).join(' ');
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(k==='class')el.className=(el.className?el.className+' ':'')+v;
    else if(k==='style')el.style.cssText=v;
    else if(k==='html')el.innerHTML=v; // yalnızca sabit ikon/markup için
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='dataset')Object.assign(el.dataset,v);
    else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v);
  }
  const add=k=>{if(k==null||k===false)return;
    if(Array.isArray(k))k.forEach(add);
    else if(k instanceof Node)el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)))};
  kids.forEach(add);
  return el;
}

/* ==== crypto.js ==== */
/* Şifreleme — AES-256-GCM, PBKDF2(SHA-256, 310k) */
const Crypt={
  enc:new TextEncoder(),dec:new TextDecoder(),
  b64(buf){let s='';const b=new Uint8Array(buf);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)},
  unb64(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b},
  async key(pass,salt){
    const base=await crypto.subtle.importKey('raw',this.enc.encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,
      {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async encrypt(obj,pass){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const k=await this.key(pass,salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,this.enc.encode(JSON.stringify(obj)));
    return JSON.stringify({v:1,app:'sena-panel',salt:this.b64(salt),iv:this.b64(iv),ct:this.b64(ct)});
  },
  async decrypt(envStr,pass){
    const env=JSON.parse(envStr);
    const k=await this.key(pass,this.unb64(env.salt));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(env.iv)},k,this.unb64(env.ct));
    return JSON.parse(this.dec.decode(pt));
  }
};

/* ==== kasa.js ==== */
/* Kasa — ayrı parolalar + Sena'ya özel bölme (zarf v2). SAF model katmanı: DOM/UI/localStorage'a dokunmaz.
   Zarf v2: {v:2, app, anahtarlar:{ortak:{<ad>:sarma}, ozel:{<ad>:sarma}}, ortak:{iv,ct}, ozel?:{iv,ct}}
   sarma = {salt,iv,ct,t}: AES-GCM(PBKDF2-SHA256-310k(sır,salt), K_ham). K_ortak/K_ozel: 32 bayt rastgele ham anahtar.
   Şema + akış: src/model/KASA.md */
const Kasa={
  APP:'sena-panel',
  KURTARMA:'kurtarma',                       // anahtarlar içindeki kurtarma kodu girişinin adı
  ALFABE:'0123456789ABCDEFGHJKMNPQRSTVWXYZ', // Crockford base32 (I L O U yok)

  /* ---- anahtar ---- */
  anahtarUret(){return crypto.getRandomValues(new Uint8Array(32))},

  async _aes(ham,kullanim){return crypto.subtle.importKey('raw',ham,'AES-GCM',false,kullanim)},

  /* ham anahtarı sırla (parola / kod) sar → {salt,iv,ct,t}; t = son değişim zamanı (anahtarBirlestir için) */
  async sar(ham,sir,t){
    if(!sir)throw new Error('Sır boş olamaz');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const k=await Crypt.key(sir,salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,ham);
    return {salt:Crypt.b64(salt),iv:Crypt.b64(iv),ct:Crypt.b64(ct),t:t||new Date().toISOString()};
  },

  /* sarmayı aç → ham anahtar (Uint8Array). Yanlış sır → anlaşılır Error. */
  async ac(sarma,sir){
    if(!sarma||!sarma.salt||!sarma.iv||!sarma.ct)throw new Error('Anahtar sarması eksik');
    try{
      const k=await Crypt.key(String(sir==null?'':sir),Crypt.unb64(sarma.salt));
      return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:Crypt.unb64(sarma.iv)},k,Crypt.unb64(sarma.ct)));
    }catch(e){throw new Error('Parola ya da kod uyuşmuyor')}
  },

  /* nesne ⇄ {iv,ct} (ham anahtarla AES-GCM; her çağrıda yeni iv) */
  async _sifrele(ham,obj){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await this._aes(ham,['encrypt']),Crypt.enc.encode(JSON.stringify(obj)));
    return {iv:Crypt.b64(iv),ct:Crypt.b64(ct)};
  },
  async _coz(ham,b){
    try{
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:Crypt.unb64(b.iv)},await this._aes(ham,['decrypt']),Crypt.unb64(b.ct));
      return JSON.parse(Crypt.dec.decode(pt));
    }catch(e){throw new Error('Bölme çözülemedi (anahtar uyuşmuyor ya da veri bozuk)')}
  },

  /* ---- kodlar (Crockford base32; her karakter rastgele baytın alt 5 biti → 256/32 tam bölünür, yanlılık yok) ---- */
  _kod(n,grup){
    const b=crypto.getRandomValues(new Uint8Array(n));
    let s='';for(let i=0;i<n;i++)s+=this.ALFABE[b[i]&31];
    return s.match(new RegExp('.{1,'+grup+'}','g')).join('-');
  },
  kurtarmaKoduUret(){return this._kod(24,4)},  // «ABCD-EFGH-…» 6×4, 120 bit
  davetKoduUret(){return this._kod(10,5)},     // «ABCDE-FGHIJ» 2×5, 50 bit

  /* okuma hatalarını tolere eden kanonik biçim (ayraçsız, büyük harf); base32 dışı → null */
  kodNormalize(s){
    if(s==null)return null;
    const t=String(s).replace(/[\s\-‐-―]/g,'');
    if(!t||!/^[0-9A-Za-zıİ]+$/.test(t))return null;
    const u=t.replace(/[ıİ]/g,'1').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1');
    return /^[0-9A-HJKMNP-TV-Z]+$/.test(u)?u:null;
  },

  /* ---- bölme ---- */
  _kopya(x){return x==null?x:JSON.parse(JSON.stringify(x))},
  _kisisel(r){return !!r&&r.type==='kisisel'},

  /* data → {ortak, ozel}. ozel = {transactions, recurring (yalnız type 'kisisel'), personalCategories?, ozelAyarGuncel?}.
     Danışan notları dahil geri kalan her şey ortak. Girdi değişmez (kopya). */
  bol(data){
    const ortak=this._kopya(data);
    const ozel={
      transactions:(ortak.transactions||[]).filter(r=>this._kisisel(r)),
      recurring:(ortak.recurring||[]).filter(r=>this._kisisel(r))
    };
    if(ortak.transactions)ortak.transactions=ortak.transactions.filter(r=>!this._kisisel(r));
    if(ortak.recurring)ortak.recurring=ortak.recurring.filter(r=>!this._kisisel(r));
    if(ortak.settings&&'personalCategories' in ortak.settings){
      ozel.personalCategories=ortak.settings.personalCategories;
      delete ortak.settings.personalCategories;
    }
    if('ozelAyarGuncel' in ortak){ozel.ozelAyarGuncel=ortak.ozelAyarGuncel;delete ortak.ozelAyarGuncel}
    return {ortak,ozel};
  },

  /* bol'un tersi. ozel null → ortak aynen (kopya). Koleksiyon SIRASI korunmaz (ozel kayıtlar sona eklenir; Store.merge de sırayı korumaz). */
  birlestir(ortak,ozel){
    const d=this._kopya(ortak);
    if(!ozel)return d;
    const o=this._kopya(ozel);
    d.transactions=(d.transactions||[]).concat(o.transactions||[]);
    d.recurring=(d.recurring||[]).concat(o.recurring||[]);
    if('personalCategories' in o){d.settings=d.settings||{};d.settings.personalCategories=o.personalCategories}
    if('ozelAyarGuncel' in o)d.ozelAyarGuncel=o.ozelAyarGuncel;
    return d;
  },

  /* ---- zarf v2 ---- */
  _oku(zarfMetni){
    let z;try{z=JSON.parse(zarfMetni)}catch(e){throw new Error('Zarf okunamadı')}
    if(!z||z.v!==2||!z.anahtarlar||!z.ortak)throw new Error('Zarf sürümü 2 değil');
    return z;
  },

  surum(zarfMetni){
    try{const z=JSON.parse(zarfMetni);return z&&(z.v===1||z.v===2)?z.v:null}catch(e){return null}
  },

  /* uzak zarfın ozel bölmesi (açmadan) — Ketty'nin geçiş zarfı; yoksa null */
  zarfOzel(zarfMetni){
    try{const z=JSON.parse(zarfMetni);return z&&z.v===2&&z.ozel?z.ozel:null}catch(e){return null}
  },

  /* Ketty gönderirken yazılacak ozel: uzakta ozel varsa O (Ketty ozel'i hiç değiştirmez, silemez), yoksa elindeki geçiş */
  ozelSec(yerelGecis,uzakOzel){return uzakOzel||yerelGecis||null},

  /* ortak bölmeye gidecek veride kişisel hareket/düzenli ya da kişisel kategori varsa Error (önce bol() çağrılmalı) */
  _ortakTemizMi(ortakVeri){
    const v=ortakVeri||{};
    const kirli=(v.transactions||[]).some(r=>this._kisisel(r))||(v.recurring||[]).some(r=>this._kisisel(r))
      ||(!!v.settings&&'personalCategories' in v.settings)||'ozelAyarGuncel' in v;
    if(kirli)throw new Error('Kişisel kayıt ortak bölmeye yazılamaz — önce Kasa.bol() ile ayırın');
  },

  /* Sena: ozelVeri + K_ozel → ozel yeniden şifrelenir. Ketty: ozelVeri null, ozelGecis aynen yazılır. İkisi de yok → ozel alanı yok. */
  async paketle({ortakVeri,ozelVeri=null,anahtarlar,K_ortak,K_ozel=null,ozelGecis=null}){
    if(!K_ortak)throw new Error('Ortak anahtar yok');
    if(!anahtarlar||!anahtarlar.ortak)throw new Error('Anahtarlar eksik');
    if(ozelVeri!=null&&!K_ozel)throw new Error('Özel veri var ama özel anahtar yok');
    this._ortakTemizMi(ortakVeri); /* sızıntı bekçisi: tam veri yanlışlıkla «ortak» diye verilirse Ketty'nin açtığı bölmeye kişisel kayıt yazılmasın (masa 10-14) */
    const z={v:2,app:this.APP,anahtarlar,ortak:await this._sifrele(K_ortak,ortakVeri)};
    if(ozelVeri!=null)z.ozel=await this._sifrele(K_ozel,ozelVeri);
    else if(ozelGecis)z.ozel={iv:ozelGecis.iv,ct:ozelGecis.ct};
    return JSON.stringify(z);
  },

  /* ortak/ozel bölmeleri verilen ham anahtarlarla çöz (coz + kurtarmaIleCoz ortak gövdesi) */
  async _bolmeleriCoz(z,K_ortak,K_ozel){
    const ortakVeri=await this._coz(K_ortak,z.ortak);
    const ozelVeri=K_ozel&&z.ozel?await this._coz(K_ozel,z.ozel):null;
    return {surum:2,ortakVeri,ozelVeri,anahtarlar:z.anahtarlar,K_ortak,K_ozel:K_ozel||null,ozelGecis:z.ozel||null};
  },

  /* bölmeleri ELDEKİ ham anahtarlarla aç (parola sarması gerekmez). Kendi sarması uzakta henüz eskiyken (parola değişti / kurtarma / davet
     gönderilmeden araya başka cihazın kaydı girdi) çekmenin kilitlenmemesi için — yeni yetki vermez: anahtar zaten bellekte. */
  async anahtarlaAc(zarfMetni,K_ortak,K_ozel){
    if(!K_ortak)throw new Error('Ortak anahtar yok');
    return this._bolmeleriCoz(this._oku(zarfMetni),K_ortak,K_ozel||null);
  },

  /* yalnız ORTAK bölmeyi K_ortak ile aç (davet kabulü: Ketty'nin henüz sarması yok; ozel'e hiç dokunulmaz).
     → coz ile aynı biçim; K_ozel null, ozelVeri null, ozelGecis = zarftaki ozel */
  async ortakAc(zarfMetni,K_ortak){
    if(!K_ortak)throw new Error('Ortak anahtar yok');
    return this._bolmeleriCoz(this._oku(zarfMetni),K_ortak,null);
  },

  /* kullanıcının kendi parolasıyla aç. Ketty: ozel sarması yok → K_ozel null, ozelVeri null, ozelGecis = zarftaki ozel. */
  async coz(zarfMetni,{kullanici,parola}){
    const z=this._oku(zarfMetni);
    const s=(z.anahtarlar.ortak||{})[kullanici];
    if(!s)throw new Error('Bu kullanıcı için anahtar yok — davet gerekli');
    const K_ortak=await this.ac(s,parola);
    const so=(z.anahtarlar.ozel||{})[kullanici];
    const K_ozel=so?await this.ac(so,parola):null;
    return this._bolmeleriCoz(z,K_ortak,K_ozel);
  },

  async kurtarmaIleCoz(zarfMetni,kod){
    const z=this._oku(zarfMetni);
    const n=this.kodNormalize(kod);
    if(!n||n.length!==24)throw new Error('Kurtarma kodu geçersiz');
    const so=(z.anahtarlar.ortak||{})[this.KURTARMA],sz=(z.anahtarlar.ozel||{})[this.KURTARMA];
    if(!so||!sz)throw new Error('Bu dosyada kurtarma anahtarı yok');
    let K_ortak,K_ozel;
    try{K_ortak=await this.ac(so,n);K_ozel=await this.ac(sz,n)}
    catch(e){throw new Error('Kurtarma kodu uyuşmuyor')}
    return this._bolmeleriCoz(z,K_ortak,K_ozel);
  },

  /* ilk kurulum: K_ortak + K_ozel + kurtarma kodu üret, Sena'nın (kullanici) ve kurtarma kodunun sarmalarını kur */
  async yeniKasa(parola,kullanici='Sena'){
    if(!parola)throw new Error('Parola boş olamaz');
    const K_ortak=this.anahtarUret(),K_ozel=this.anahtarUret();
    const kurtarmaKodu=this.kurtarmaKoduUret(),n=this.kodNormalize(kurtarmaKodu);
    const anahtarlar={
      ortak:{[kullanici]:await this.sar(K_ortak,parola),[this.KURTARMA]:await this.sar(K_ortak,n)},
      ozel:{[kullanici]:await this.sar(K_ozel,parola),[this.KURTARMA]:await this.sar(K_ozel,n)}
    };
    return {K_ortak,K_ozel,kurtarmaKodu,anahtarlar};
  },

  /* v1 zarfı (Crypt.encrypt) → v2. Eski parola Sena'nın sarması olur. Yanlış parola → Error. */
  async v1Donustur(v1Metni,parola){
    if(this.surum(v1Metni)!==1)throw new Error('Zarf sürümü 1 değil');
    let veri;
    try{veri=await Crypt.decrypt(v1Metni,parola)}catch(e){throw new Error('Parola ya da kod uyuşmuyor')}
    const {K_ortak,K_ozel,kurtarmaKodu,anahtarlar}=await this.yeniKasa(parola);
    const {ortak,ozel}=this.bol(veri);
    const zarf=await this.paketle({ortakVeri:ortak,ozelVeri:ozel,anahtarlar,K_ortak,K_ozel});
    return {veri,kurtarmaKodu,zarf,anahtarlar,K_ortak,K_ozel};
  },

  /* bölme × giriş başına t büyük olan kazanır (eşitlikte uzak); yalnız bir tarafta olan giriş korunur */
  anahtarBirlestir(yerel,uzak){
    const out={};
    for(const b of new Set([...Object.keys(yerel||{}),...Object.keys(uzak||{})])){
      const y=(yerel||{})[b]||{},u=(uzak||{})[b]||{};
      out[b]={};
      for(const ad of new Set([...Object.keys(y),...Object.keys(u)])){
        if(!y[ad])out[b][ad]=u[ad];
        else if(!u[ad])out[b][ad]=y[ad];
        else out[b][ad]=String(y[ad].t||'')>String(u[ad].t||'')?y[ad]:u[ad];
      }
    }
    return out;
  },

  /* ---- davet (QR yükü; davet koduyla şifreli) ---- */
  async davetPaketle({cfg,kullanici,K_ortak=null,son},davetKodu){
    const n=this.kodNormalize(davetKodu);
    if(!n)throw new Error('Davet kodu geçersiz');
    if(!cfg||!kullanici||!son)throw new Error('Davet eksik');
    return Crypt.encrypt({cfg,kullanici,K_ortak:K_ortak?Crypt.b64(K_ortak):null,son},n);
  },

  /* simdi: Date | ms | ISO. Süresi geçmiş → Error; yanlış kod → Error. */
  async davetCoz(metin,davetKodu,simdi){
    const n=this.kodNormalize(davetKodu);
    if(!n)throw new Error('Davet kodu uyuşmuyor');
    let y;
    try{y=await Crypt.decrypt(metin,n)}catch(e){throw new Error('Davet kodu uyuşmuyor')}
    if(!y||!y.cfg||!y.kullanici||!y.son)throw new Error('Davet eksik ya da bozuk');
    const an=new Date(simdi==null?Date.now():simdi).getTime();
    if(!(an<=new Date(y.son).getTime()))throw new Error('Davetin süresi dolmuş — Sena\'dan yenisini isteyin');
    return {cfg:y.cfg,kullanici:y.kullanici,K_ortak:y.K_ortak?Crypt.unb64(y.K_ortak):null,son:y.son};
  }
};

}

const Store={
  data:null, user:localStorage.getItem(LS.user)||'', pass:null, dirty:localStorage.getItem(LS.dirty)==='1', rev:0, // rev: her düzenlemede artar (push sırasında gelen düzenlemeyi ayırt eder)
  listeners:[],
  onChange(fn){this.listeners.push(fn)},
  emit(){this.listeners.forEach(f=>f())},

  /* koleksiyon yardımcıları */
  col(name){return (this.data[name]||[]).filter(r=>!r.deleted)},
  find(name,id){return (this.data[name]||[]).find(r=>r.id===id)},
  add(name,rec){rec.id=rec.id||uid();rec.createdAt=nowIso();rec.updatedAt=nowIso();
    rec.enteredBy=rec.enteredBy||this.user;rec.updatedBy=this.user;
    if(!this.data[name])this.data[name]=[];
    this.data[name].push(rec);this.touch();return rec},
  update(name,id,patch){const r=this.find(name,id);if(!r)return;
    Object.assign(r,patch,{updatedAt:nowIso(),updatedBy:this.user});this.touch();return r},
  remove(name,id){const r=this.find(name,id);if(!r)return;
    r.deleted=true;r.updatedAt=nowIso();r.updatedBy=this.user;this.touch()},

  touchSettings(){this.data.settingsUpdatedAt=nowIso();this.touch()}, // ayar değişikliği: kendi damgası (birleştirmede ayrı seçilir)
  /* toplu(fn): fn içindeki add/update/remove'ların touch'ı ertelenir; sonda TEK touch (emit/saveLocal/schedule bir kez).
     fn hata atsa da sonda touch yapılır (yazılan kısım kaybolmasın) ve hata yeniden atılır. İç içe çağrıda yalnız en dıştaki touch eder. */
  _topluDerin:0, _topluBekleyen:false,
  toplu(fn){
    this._topluDerin++;
    try{return fn()}
    finally{
      this._topluDerin--;
      if(this._topluDerin===0&&this._topluBekleyen){this._topluBekleyen=false;this.touch()}
    }
  },
  touch(){if(this._topluDerin>0){this._topluBekleyen=true;return}
    this.data.updatedAt=nowIso();this.rev++;this.dirty=true;try{localStorage.setItem(LS.dirty,'1')}catch(e){}this.saveLocal();this.emit();Sync.schedule()},

  async saveLocal(){
    if(!this.data||!this.pass||!this.kasa)return;
    try{const env=await this.zarfla();localStorage.setItem(LS.cache,env)}
    catch(e){console.error('yerel kayıt',e)}
  },

  /* ---- KASA (D2a): bellekteki kasa durumu + tek paketleme/açma yolu. Şema: src/model/KASA.md ----
     kasa = {anahtarlar, K_ortak, K_ozel|null, ozelGecis|null} — cihazda KALICI tutulmaz (yalnız v2 zarfı LS.cache'te durur).
     Sena'da K_ozel dolu (Store.data = ortak+ozel birleşik); Ketty'de K_ozel null, ozelGecis = zarftaki ozel (açamaz, aynen geri yazar). */
  kasa:null, bekleyenKurtarmaKodu:null, // bekleyenKurtarmaKodu: tek sefer gösterilecek kurtarma kodu (D3 gösterir ve siler)
  SAHIP:'Sena',ASISTAN:'Ketty',
  KASA_YOK_MESAJI:"Bu kullanıcı için anahtar yok — Sena'dan davet isteyin",
  KETTY_V1_MESAJI:"Önce Sena'nın cihazında paneli güncelleyin",
  KETTY_KURULUM_MESAJI:"İlk kurulumu yalnız Sena açabilir — Sena'dan davet isteyin",
  PAROLA_HATASI:'Parola ya da kod uyuşmuyor', // Kasa.ac / v1Donustur'un parola uyuşmazlığı hata metni

  /* şu anki Store.data → zarf metni. Her zaman Kasa.bol: ortak bölmeye kişisel kayıt giremez (Kasa.paketle de ayrıca denetler).
     Sena: ozel bölme K_ozel ile yeniden şifrelenir. Ketty: ozelVeri YOK (kişisel kaydı olsa bile gönderilmez); uzak ozel ozelGecis ile aynen korunur. */
  async zarfla(){
    const k=this.kasa;
    if(!k)throw new Error('Kasa açık değil');
    const {ortak,ozel}=Kasa.bol(this.data);
    const sena=!!k.K_ozel;
    return Kasa.paketle({ortakVeri:ortak,ozelVeri:sena?ozel:null,anahtarlar:k.anahtarlar,K_ortak:k.K_ortak,K_ozel:k.K_ozel,ozelGecis:sena?null:k.ozelGecis});
  },

  /* Kasa.coz çıktısı → cihaz verisi: Sena = ortak+ozel birleşik (ozel dosyada yoksa kişisel kategoriler varsayılan), Ketty = yalnız ortak */
  _tamVeri(c){
    if(!c.K_ozel)return c.ortakVeri;
    const d=Kasa.birlestir(c.ortakVeri,c.ozelVeri);
    if(!d.settings)d.settings={};
    if(!d.settings.personalCategories)d.settings.personalCategories=blankData().settings.personalCategories;
    return d;
  },

  /* zarf metni + kullanıcı + parola → {surum, veri, kasa, kurtarmaKodu}. Hata: Error (parola · anahtar yok · Ketty v1 · bozuk zarf).
     v1: Sena → Kasa.v1Donustur (yeni kasa + kurtarma kodu), Ketty → «Önce Sena'nın cihazında paneli güncelleyin». */
  async zarfAc(metin,user,pass){
    const s=Kasa.surum(metin);
    if(s===1){
      if(user!==this.SAHIP)throw new Error(this.KETTY_V1_MESAJI);
      const r=await Kasa.v1Donustur(metin,pass);
      return {surum:1,veri:r.veri,kurtarmaKodu:r.kurtarmaKodu,
        kasa:{anahtarlar:r.anahtarlar,K_ortak:r.K_ortak,K_ozel:r.K_ozel,ozelGecis:null}};
    }
    if(s!==2)throw new Error('Zarf okunamadı');
    let c;
    try{c=await Kasa.coz(metin,{kullanici:user,parola:pass})}
    catch(e){
      if(/anahtar yok/.test(String(e&&e.message)))throw new Error(this.KASA_YOK_MESAJI);
      throw e;
    }
    return {surum:2,veri:this._tamVeri(c),kurtarmaKodu:null,
      kasa:{anahtarlar:c.anahtarlar,K_ortak:c.K_ortak,K_ozel:c.K_ozel,ozelGecis:c.K_ozel?null:c.ozelGecis}};
  },

  /* Sync._pull için: uzak zarf. Bu cihazın kasası ZATEN varken uzak v1 görülürse (eski cihaz yazmış) yeni kasa KURULMAZ —
     yalnız veri eski parolayla okunur (kasa:null). Aksi halde zarfAc. */
  async uzakAc(metin){
    if(Kasa.surum(metin)===1&&this.kasa){
      if(this.user!==this.SAHIP)throw new Error(this.KETTY_V1_MESAJI);
      let veri;
      try{veri=await Crypt.decrypt(metin,this.pass)}catch(e){throw new Error(this.PAROLA_HATASI)}
      return {surum:1,veri,kurtarmaKodu:null,kasa:null};
    }
    try{return await this.zarfAc(metin,this.user,this.pass)}
    catch(e){
      /* masa 10-14 — kilitlenme önlemi: bu cihazın kendi sarması yeni (parola değişti / kurtarma / davet kabulü) ama uzakta henüz ESKİ
         (araya başka cihazın gönderimi girdi) → parola açmaz. Bellekteki anahtar uzaktaki kasayı açıyorsa aynı kasadır: aç, kasaUzlastir
         yeni sarmayı (t büyük) korur, gönderim sürer. Farklı kasa ise ilk hata aynen yükselir. */
      const k=this.kasa;
      if(!k||Kasa.surum(metin)!==2)throw e;
      let c;
      try{c=await Kasa.anahtarlaAc(metin,k.K_ortak,k.K_ozel)}catch(e2){throw e}
      return {surum:2,veri:this._tamVeri(c),kurtarmaKodu:null,
        kasa:{anahtarlar:c.anahtarlar,K_ortak:k.K_ortak,K_ozel:k.K_ozel,ozelGecis:k.K_ozel?null:c.ozelGecis}};
    }
  },

  _ayniBayt(a,b){
    if(!a||!b||a.length!==b.length)return false;
    for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;
    return true;
  },

  /* uzaktan açılan kasayı yereldekiyle uzlaştır (veri birleştirmesinden SONRA, aynı pull içinde). metin: uzak zarf (ozel'i açmadan almak için).
     · yerel kasa yok → uzak kasa benimsenir (ilk açılış).
     · AYNI K_ortak → anahtarlar giriş başına birleşir (anahtarBirlestir); Ketty'de ozelGecis = en son uzak ozel.
     · FARKLI K_ortak (iki cihaz ayrı «ilk kurulum» yapmış) → uzak kasa esas alınır, yerel anahtarlar ATILIR (birleştirilmez);
       bu cihazın kurulumda ürettiği ve henüz gösterilmemiş kurtarma kodu da geçersizdir → silinir. */
  kasaUzlastir(uz,metin){
    const uk=uz.kasa;
    if(!uk)return; // uzak v1: yerel kasa aynen
    if(!this.kasa){
      this.kasa=uk;
      if(uz.kurtarmaKodu)this.bekleyenKurtarmaKodu=uz.kurtarmaKodu;
      return;
    }
    const y=this.kasa;
    if(!this._ayniBayt(y.K_ortak,uk.K_ortak)){
      this.kasa=uk;this.bekleyenKurtarmaKodu=null;
      return;
    }
    y.anahtarlar=Kasa.anahtarBirlestir(y.anahtarlar,uk.anahtarlar);
    if(!y.K_ozel)y.ozelGecis=Kasa.ozelSec(y.ozelGecis,Kasa.zarfOzel(metin));
  },

  /* Açılış kapısı (App.unlock yalnız bunu çağırır): Store.user/pass set edilir; hata → pass null'a döner.
     → {ok:true, kurtarmaKodu?}  |  {ok:false, hata}
     · önbellek (v2; v1 ise Sena'da dönüştürülür) · önbellek yok + GitHub: çek (zarf v2 → kullanıcının sarmasıyla; sarma yoksa «davet isteyin»)
     · önbellek yok + GitHub yok (yerel mod) ya da uzakta henüz dosya yok: YALNIZ Sena yeni kasa kurar (kurtarma kodu → bekleyenKurtarmaKodu). */
  async kilitAc(user,pass){
    this.user=user;this.pass=pass;
    const cik=hata=>{this.pass=null;return {ok:false,hata}};
    try{
      const cache=localStorage.getItem(LS.cache);
      if(cache){
        const r=await this.zarfAc(cache,user,pass);
        this.data=r.veri;this.kasa=r.kasa;
        if(r.kurtarmaKodu)this.bekleyenKurtarmaKodu=r.kurtarmaKodu;
      }else if(Sync.cfg){
        await Sync.pull();
        if(!this.data){
          if(Sync.state!=='ok')return cik(Sync.lastMsg==='parola uyuşmuyor'?'Parola, repodaki veriyle uyuşmuyor':(Sync.lastMsg||"GitHub'a ulaşılamadı — ilk açılış için bağlantı gerekli"));
          if(user!==this.SAHIP)return cik(this.KETTY_KURULUM_MESAJI); // uzakta dosya yok (404)
          await this._yeniKasaKur(user,pass);
        }
      }else{
        if(user!==this.SAHIP)return cik(this.KETTY_KURULUM_MESAJI);
        await this._yeniKasaKur(user,pass);
      }
    }catch(e){
      const m=String(e&&e.message||e);
      return cik(m===this.PAROLA_HATASI?'Parola hatalı':m);
    }
    return {ok:true,kurtarmaKodu:this.bekleyenKurtarmaKodu};
  },
  async _yeniKasaKur(user,pass){
    const k=await Kasa.yeniKasa(pass,user);
    this.data=blankData();
    this.kasa={anahtarlar:k.anahtarlar,K_ortak:k.K_ortak,K_ozel:k.K_ozel,ozelGecis:null};
    this.bekleyenKurtarmaKodu=k.kurtarmaKodu;
  },

  /* uzak v1'in v2'ye yükseltilmesi gibi «gönderilmesi gereken ama kullanıcı düzenlemesi olmayan» durumlarda: dirty işaretle (Store.touch'sız: rev/updatedAt değişmez) */
  kirliIsaretle(){this.dirty=true;try{localStorage.setItem(LS.dirty,'1')}catch(e){}},

  /* iki veri setini kayıt bazında birleştir: updatedAt yenisi kazanır */
  merge(remote){
    const local=this.data;
    if(!remote)return local;
    if(!local)return remote;
    const out=blankData();
    out.updatedAt=(remote.updatedAt>local.updatedAt?remote:local).updatedAt;
    // ayarlar: yalnız yerel damga KESİN yeniyse yerel; eşitlikte uzak (paylaşılan doğru)
    const yerelAyar=String(local.settingsUpdatedAt||'')>String(remote.settingsUpdatedAt||'');
    out.settings=yerelAyar?local.settings:remote.settings;
    out.settingsUpdatedAt=(yerelAyar?local.settingsUpdatedAt:remote.settingsUpdatedAt)||'';
    for(const name of COLS){
      const map=new Map();
      for(const r of (remote[name]||[]))map.set(r.id,r);
      for(const r of (local[name]||[])){
        const ex=map.get(r.id);
        if(!ex||String(r.updatedAt||'')>String(ex.updatedAt||''))map.set(r.id,r);
      }
      out[name]=Array.from(map.values());
    }
    return out;
  },

  /* ---- türetilmiş hesaplar ---- */
  clientName(id){const c=this.find('clients',id);return c?c.name:'(silinmiş danışan)'},

  /* danışan bakiyesi: geldi seans ücretleri + manuel borçlar − ödemeler */
  balance(clientId){
    let borc=0,oden=0;
    for(const a of this.col('appointments'))if(a.clientId===clientId&&a.status==='geldi')borc+=Number(a.fee)||0;
    for(const j of this.col('adjustments'))if(j.clientId===clientId)borc+=Number(j.amount)||0;
    for(const p of this.col('payments'))if(p.clientId===clientId)oden+=Number(p.amount)||0;
    return {borc,oden,kalan:borc-oden};
  },

  clientStats(clientId){
    const apps=this.col('appointments').filter(a=>a.clientId===clientId);
    const done=apps.filter(a=>a.status==='geldi');
    const noshow=apps.filter(a=>a.status==='gelmedi');
    const revize=apps.filter(a=>a.status==='revize');
    const t=todayStr();
    const past=apps.filter(a=>a.date<=t&&a.status==='geldi').sort((a,b)=>a.date<b.date?1:-1);
    const future=apps.filter(a=>a.date>=t&&a.status==='planlandi').sort((a,b)=>a.date>b.date?1:-1);
    return {toplam:done.length,noshow:noshow.length,revize:revize.length,son:past[0]||null,sonraki:future[0]||null,ilk:done.length?done[done.length-1]:null};
  },

  /* ay bazlı finans özeti  { gelir, gider, kisisel, seans }
     K3a/Q7: isteğe bağlı sonGun (1..31) → yalnız ayın 1..sonGun günleri sayılır ("aynı gün" kıyası);
     verilmezse (ya da geçersizse) tüm ay — diğer çağıranlar etkilenmez. */
  monthFin(mk,sonGun){
    let gelir=0,gider=0,kisisel=0,seansTutar=0,seansSayi=0;
    const lim=Number(sonGun)>0?Number(sonGun):0;
    const icinde=d=>monthKey(d)===mk&&(!lim||Number(String(d).slice(8,10))<=lim);
    for(const p of this.col('payments'))if(icinde(p.date)){gelir+=Number(p.amount)||0;seansTutar+=Number(p.amount)||0}
    for(const tr of this.col('transactions'))if(icinde(tr.date)){
      const a=Number(tr.amount)||0;
      if(tr.type==='gelir')gelir+=a;else if(tr.type==='gider')gider+=a;else if(tr.type==='kisisel')kisisel+=a;
    }
    for(const a of this.col('appointments'))if(icinde(a.date)&&a.status==='geldi')seansSayi++;
    return {gelir,gider,kisisel,net:gelir-gider,seansSayi,seansTutar};
  },

  /* ---- seans paketleri ---- */
  saleUsage(s){
    const used=this.col('appointments').filter(a=>a.packageSaleId===s.id&&a.status==='geldi').length;
    return {used,remaining:Math.max(0,(Number(s.sessions)||0)-used)};
  },
  activeSale(clientId){
    const sales=this.col('packageSales').filter(s=>s.clientId===clientId).sort((a,b)=>a.date<b.date?-1:1);
    for(const s of sales)if(this.saleUsage(s).remaining>0)return s;
    return null;
  },
  /* "geldi" işaretlenen seansı varsa aktif paketten düş (ücretsiz seans düşmez — Sena 10-27) */
  applyPackage(a){
    if(!a||a.packageSaleId||a.ucretsiz)return null;
    const sale=this.activeSale(a.clientId);
    if(!sale)return null;
    const u=this.saleUsage(sale).used;
    const per=Math.round(sale.price/sale.sessions);
    const fee=(u>=sale.sessions-1)?(sale.price-per*(sale.sessions-1)):per; // son seans yuvarlama farkını kapatır
    this.update('appointments',a.id,{fee,packageSaleId:sale.id});
    return sale;
  },

  /* D2 — yedek durumu (saf okuma). settings.sonYedekAt: ISO; eşitlenir (kliniğin tek yedeği yeter).
     sonYedekGunu: o anın YEREL günü ('YYYY-MM-DD'); gunOnce: bugüne gün sayısı (yoksa/bozuksa null).
     hatirlat: ≥1 danışan VAR ve (yedek hiç yok ya da ≥30 gün önce). Gün bazında; bugun verilmezse todayStr(). */
  YEDEK_GUN:30,
  yedekDurumu(bugun){
    const t=bugun||todayStr();
    const iso=(this.data.settings||{}).sonYedekAt||null;
    let sonYedekGunu=null,gunOnce=null;
    if(iso){const d=new Date(iso);if(!isNaN(d)){sonYedekGunu=dstr(d);gunOnce=daysBetween(sonYedekGunu,t)}}
    const veriVar=this.col('clients').length>=1;
    return {sonYedekAt:iso,sonYedekGunu,gunOnce,hatirlat:veriVar&&(gunOnce==null||gunOnce>=this.YEDEK_GUN)};
  },

  /* uyarı motoru */
  alerts(){
    const out=[];const t=todayStr();const s=this.data.settings;
    /* 1. borcu eşiği aşanlar */
    for(const c of this.col('clients')){
      const b=this.balance(c.id);
      if(b.kalan>=(s.debtWarn||3000))out.push({type:'borc',sev:'crit',client:c,amount:b.kalan,
        title:c.name+' — birikmiş borç',sub:money(b.kalan)+' ödenmemiş bakiye'});
    }
    /* 2. uzaklaşan danışanlar: aktif + son geldi ≥ inactiveWeeks hafta önce + gelecekte randevusu yok */
    const wk=(s.inactiveWeeks||3)*7;
    for(const c of this.col('clients')){
      if(c.status!=='aktif')continue;
      const st=this.clientStats(c.id);
      if(st.sonraki)continue;
      if(st.son&&daysBetween(st.son.date,t)>=wk)
        out.push({type:'uzak',sev:'warn',client:c,days:daysBetween(st.son.date,t),
          title:c.name+' uzaklaşıyor',sub:daysBetween(st.son.date,t)+' gündür seans yok, ileri randevusu da yok'});
      else if(!st.son&&!st.sonraki&&daysBetween(c.createdAt.slice(0,10),t)>=wk)
        out.push({type:'uzak',sev:'warn',client:c,days:null,title:c.name+' hiç seansa gelmedi',sub:'Kayıtlı ama işaretlenmiş seansı ve ileri randevusu yok'});
    }
    /* 3. tekrarlayan ödemeler: bu ay girilmemiş & günü yaklaşmış/geçmiş */
    const mk=monthKey(t);const dayNow=Number(t.slice(8,10));
    for(const r of this.col('recurring')){
      if(r.active===false)continue;
      const entered=this.col('transactions').some(x=>x.recurringId===r.id&&monthKey(x.date)===mk);
      if(entered)continue;
      const gun=Number(r.dayOfMonth)||1;
      if(dayNow>=gun-3)out.push({type:'odeme',sev:dayNow>gun?'serious':'info',rec:r,
        title:r.name+(dayNow>gun?' gecikti':' yaklaşıyor'),
        sub:'Her ayın '+gun+'. günü · '+money(r.amount)+(dayNow>gun?' — henüz girilmedi':'')});
    }
    /* 4. doğum günleri (7 gün içinde) */
    for(const c of this.col('clients')){
      if(!c.birthDate||c.status==='pasif')continue;
      const[,m,d]=c.birthDate.split('-').map(Number);if(!m||!d)continue;
      const now=new Date();let bd=new Date(now.getFullYear(),m-1,d);
      if(dstr(bd)<t)bd=new Date(now.getFullYear()+1,m-1,d);
      const diff=daysBetween(t,dstr(bd));
      if(diff<=7)out.push({type:'dogum',sev:'good',client:c,
        title:c.name+(diff===0?' — bugün doğum günü! 🎂':' — doğum günü '+(diff===1?'yarın':diff+' gün sonra')),
        sub:'Küçük bir kutlama mesajı bağı güçlendirir'});
    }
    /* 5. paket bitiyor / bitti → yenileme fırsatı */
    for(const c of this.col('clients')){
      if(c.status!=='aktif')continue;
      const sales=this.col('packageSales').filter(x=>x.clientId===c.id).sort((a,b)=>a.date<b.date?1:-1);
      if(!sales.length)continue;
      const last=sales[0];const u=this.saleUsage(last);
      if(u.remaining===0&&daysBetween(last.date,t)<=90)
        out.push({type:'paket',sev:'info',client:c,title:c.name+' — paketi bitti',
          sub:last.name+' tamamlandı ('+last.sessions+'/'+last.sessions+') · yenileme önerebilirsiniz'});
      else if(u.remaining===1)
        out.push({type:'paket',sev:'info',client:c,title:c.name+' — pakette son seans',
          sub:last.name+': '+u.used+'/'+last.sessions+' kullanıldı'});
    }
    /* 6. yarın randevusu olup hatırlatılmamışlar → dashboard ayrı gösteriyor */
    const sevOrder={crit:0,serious:1,warn:2,info:3,good:4};
    return out.sort((a,b)=>sevOrder[a.sev]-sevOrder[b.sev]);
  }
};

/* ==== tema.js ==== */
/* Görünüm (tema) — CİHAZ BAŞINA tercih: localStorage 'sena.tema' (LS.tema); veriye/eşitlemeye GİRMEZ
   (Sena'nın telefonu ile Ketty'nin bilgisayarı farklı görünüm seçebilir).
   Üç görünüm tek index.html'de taşınır: temel CSS her zaman etkin; tema CSS'leri ayrı stil blokları (id="tema-…",
   media="not all"). Tema seçilince ilgili blokların `media`sı 'all' olur (CSS yeniden yazılmaz, yalnız aç/kapa).
   Saf kısım: gecerli · bloklar · renk · secenekler. Cihaz kısmı: oku · yaz. DOM: uygula (belge parametreli; eksik öğe sessiz geçilir). */
const Tema={
  VARSAYILAN:'3b', // Gökhan 10-18: ilk açılışta 3B (kabarık) görünüm; Düz isteyen Ayarlar > Görünüm'den seçer
  /* bloklar: açık olacak stil bloğu kimlikleri (sıra = CSS şelalesi; kimlikler tools/derle.mjs TEMA_STILLERI ile aynı) */
  TANIMLAR:{
    'duz':{ad:'Düz',bloklar:[],renk:'#f6f1ea'},
    '3b':{ad:'3B',bloklar:['tema-3b'],renk:'#efe9dd'},
    '3b-ust-menu':{ad:'3B üst menü',bloklar:['tema-3b','tema-ust-menu'],renk:'#efe9dd'}
  },

  /* herhangi bir değer → geçerli tema adı (bozuk/bilinmeyen/eski değer → VARSAYILAN) */
  gecerli(deger){
    return typeof deger==='string'&&Object.prototype.hasOwnProperty.call(this.TANIMLAR,deger)?deger:this.VARSAYILAN;
  },
  /* tema adı → açık olacak style kimlikleri (kopya döner) */
  bloklar(ad){return this.TANIMLAR[this.gecerli(ad)].bloklar.slice()},
  /* tema adı → <meta name="theme-color"> değeri */
  renk(ad){return this.TANIMLAR[this.gecerli(ad)].renk},
  /* seg için [[değer,etiket],…] */
  secenekler(){return Object.keys(this.TANIMLAR).map(k=>[k,this.TANIMLAR[k].ad])},
  /* herhangi bir temada açılan tüm blok kimlikleri (uygulanırken seçilmeyenler kapatılır) */
  tumBloklar(){
    const s=[];
    Object.keys(this.TANIMLAR).forEach(k=>this.TANIMLAR[k].bloklar.forEach(b=>{if(!s.includes(b))s.push(b)}));
    return s;
  },

  /* bu cihazın kayıtlı tercihi (yoksa/okunamazsa/bozuksa VARSAYILAN) */
  oku(){
    try{return this.gecerli(localStorage.getItem(LS.tema))}catch(e){return this.VARSAYILAN}
  },
  /* tercihi bu cihaza yaz; yazılan GEÇERLİ adı döner (depolama kapalıysa yine döner: görünüm bu oturumda uygulanır) */
  yaz(ad){
    const g=this.gecerli(ad);
    try{localStorage.setItem(LS.tema,g)}catch(e){}
    return g;
  },

  /* temayı sayfaya uygula: tema bloklarını aç, ötekileri kapat; theme-color meta'sını güncelle.
     Eksik öğe (blok ya da meta yok) sessizce atlanır. belge: varsayılan global document. */
  uygula(ad,belge){
    const d=belge||document;
    const g=this.gecerli(ad),acik=this.bloklar(g);
    this.tumBloklar().forEach(id=>{
      const el=d.querySelector('#'+id);
      if(el)el.media=acik.includes(id)?'all':'not all';
    });
    const meta=d.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',this.renk(g));
    return g;
  },
  /* seçim: kaydet + hemen uygula. Dönen: uygulanan tema adı */
  sec(ad,belge){return this.uygula(this.yaz(ad),belge)}
};
/* ==== degisim.js ==== */
/* Menü rozetleri (Gökhan 10-22): ÖBÜR kullanıcının (Sena↔Ketty) bu cihazda o ekran son açıldığından beri eklediği /
   değiştirdiği / sildiği kayıt sayısı. Kendi değişikliğin sayılmaz; ekranı açınca sıfırlanır. «Son bakış» cihaza özeldir
   (localStorage). İlk kez sorulan ekran «şimdi görüldü» sayılır — eski kayıtların hepsi rozet olmasın. */
const Degisim={
  EKRAN:{cal:['appointments'],clients:['clients','adjustments','waitlist'],fin:['payments','transactions','recurring','packages','packageSales']},
  oku(){try{return JSON.parse(localStorage.getItem(LS.gorulen)||'{}')||{}}catch(e){return {}}},
  yaz(o){try{localStorage.setItem(LS.gorulen,JSON.stringify(o))}catch(e){}},
  gordum(ekran){if(!this.EKRAN[ekran])return;const o=this.oku();o[ekran]=nowIso();this.yaz(o)},
  sayi(ekran){
    const kol=this.EKRAN[ekran];if(!kol||!Store.data)return 0;
    const g=this.oku()[ekran];if(!g){this.gordum(ekran);return 0}
    let n=0;
    for(const c of kol)for(const r of (Store.data[c]||[]))if(r.updatedBy&&r.updatedBy!==Store.user&&String(r.updatedAt||'')>g)n++;
    return n;
  }
};
/* ==== gizlilik.js ==== */
/* Görünürlük politikası — TEK nokta (KUL2, Gökhan 10-14): Sena'nın kişisel harcamalarını kim görür?
   Veri iki cihazda aynı ve şifreli; bu dosya veriyi silmez/ayırmaz, yalnız görünümün neyi çizeceğine karar verir.
   Ekranlar kullanıcı adını başka yerde karşılaştırmaz: `Gizlilik.kisiselGorur(Store.user)`.
   Danışan notları bu politikanın dışındadır (Ketty'ye görünmeye devam eder). Saf: DOM'a ve Store'a dokunmaz. */
const Gizlilik={
  /* kişisel harcama (hızlı işlem satırı · tür seçici · Finans kartları/satırları · para akışı kartı · CSV) yalnız Sena'ya görünür */
  kisiselGorur(user){return user==='Sena'}
};
/* ==== sync.js ==== */
/* GitHub senkron — Contents API, şifreli tek dosya */
const Sync={
  cfg:null, sha:localStorage.getItem(LS.sha)||null, etag:localStorage.getItem(LS.etag)||null,
  state:'off', // off | ok | busy | err
  timer:null, pollTimer:null, lastMsg:'', q:null, // q: pull/push iş kuyruğu
  POLL_MS:25000, bound:false, pullP:null, // kontrol aralığı · dinleyiciler bağlandı mı · süren pull
  lastSyncAt:0, clockTimer:null, nowBusy:false, // son başarılı eşitleme (ms) · rozet saati · süren now()

  init(){
    try{this.cfg=JSON.parse(localStorage.getItem(LS.cfg)||'null')}catch(e){this.cfg=null}
    if(this.pollTimer){clearInterval(this.pollTimer);this.pollTimer=null}
    if(this.clockTimer){clearInterval(this.clockTimer);this.clockTimer=null}
    if(this.cfg){
      this.clockTimer=setInterval(()=>this.render(),10000); // "12 sn önce" yazısı tazelensin
      this.pollTimer=setInterval(()=>{if(!document.hidden)this.pull()},this.POLL_MS); // gizli sekmede çekme
      if(!this.bound){ // dinleyiciler yalnız bir kez bağlanır (init tekrar çağrılır)
        this.bound=true;
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.pull()});
        window.addEventListener('online',()=>this.push());
      }
    }
    this.render();
  },
  api(path,opt,cfg){ // cfg (isteğe bağlı, D2b): henüz kaydedilmemiş bağlantı bilgisiyle istek (davet kabulü); verilmezse this.cfg
    opt=opt||{};cfg=cfg||this.cfg;
    opt.headers=Object.assign({
      'Authorization':'Bearer '+cfg.token,
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    },opt.headers||{});
    return fetch('https://api.github.com'+path,opt);
  },
  filePath(cfg){cfg=cfg||this.cfg;return '/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+(cfg.path||'data.json.enc')},

  /* ---- erişim anahtarı (token) bitişi — D1 ---- */
  TOKEN_MESAJI:"Erişim anahtarı geçersiz ya da süresi dolmuş — Ayarlar > GitHub'dan yenileyin",
  /* metindeki ilk geçerli 'YYYY-MM-DD'yi döner (GitHub başlığı '2026-11-12 10:30:00 UTC' biçimindedir); yoksa/geçersizse null (saf) */
  tokenBitisAyikla(ham){
    const m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(ham==null?'':ham));
    if(!m)return null;
    const t=m[1]+'-'+m[2]+'-'+m[3];
    return dstr(parseD(t))===t?t:null; // 2026-02-31 gibi var olmayan gün reddedilir
  },
  /* bugünden bitişe kalan gün (gün bazında; geçmişse eksi); tarih yoksa/bozuksa null */
  tokenKalan(bugun){
    const t=this.cfg&&this.tokenBitisAyikla(this.cfg.tokenBitis);
    return t?daysBetween(bugun||todayStr(),t):null;
  },
  /* null (tarih yok ya da 14 günden fazla var) | {kalanGun, tarihMetni, seviye:'bilgi'(≤14)|'kritik'(≤3 ya da geçmiş)} */
  tokenDurumu(bugun){
    const k=this.tokenKalan(bugun);
    if(k==null||k>14)return null;
    return {kalanGun:k,tarihMetni:fmtD(this.cfg.tokenBitis),seviye:k<=3?'kritik':'bilgi'};
  },
  tokenKalanMetni(k){return k<0?'süresi doldu':k===0?'bugün sona eriyor':k===1?'yarın sona eriyor':k+' gün sonra sona eriyor'},
  /* yanıt başlığı okunabiliyorsa (CORS'ta çoğu zaman okunamaz → null) cfg.tokenBitis'i günceller; okunamıyorsa cfg'ye DOKUNMAZ */
  basliktanBitis(res){
    let ham=null;
    try{ham=res&&res.headers?res.headers.get('github-authentication-token-expiration'):null}catch(e){ham=null}
    if(ham==null||!this.cfg)return;
    const t=this.tokenBitisAyikla(ham);
    if(!t||this.cfg.tokenBitis===t)return;
    this.cfg.tokenBitis=t;
    try{localStorage.setItem(LS.cfg,JSON.stringify(this.cfg))}catch(e){}
  },
  /* Ayarlar'dan elle giriş (bağlıyken): geçerli tarih yazılır, boş/geçersiz silinir */
  tokenBitisYaz(tarih){
    if(!this.cfg)return false;
    const t=this.tokenBitisAyikla(tarih);
    if(t)this.cfg.tokenBitis=t;else delete this.cfg.tokenBitis;
    try{localStorage.setItem(LS.cfg,JSON.stringify(this.cfg))}catch(e){}
    return true;
  },
  /* başarısız yanıttan hata: 401 (ve 403 + "Bad credentials") anlaşılır mesaj, diğerleri 'HTTP n' */
  async httpHatasi(res){
    if(res.status===401)return new Error(this.TOKEN_MESAJI);
    if(res.status===403){
      let g='';try{g=await res.clone().text()}catch(e){}
      if(/bad credentials/i.test(g))return new Error(this.TOKEN_MESAJI);
    }
    return new Error('HTTP '+res.status);
  },

  resetRemote(){this.sha=null;this.etag=null;localStorage.removeItem(LS.sha);localStorage.removeItem(LS.etag)}, // uzak izi sıfırla
  saveEtag(e){this.etag=e||null;if(e)localStorage.setItem(LS.etag,e);else localStorage.removeItem(LS.etag)},

  /* K3.4: durum etiketi (saf) — masaüstü rozeti ile telefon üst barı AYNI sözcüğü kullanır.
     cfgVar: GitHub bağlı mı (yoksa yerel mod). Rozet bunun ardına ayrıntı (hata iletisi, "12 sn önce") ekler. */
  durumMetni(state,cfgVar){
    return !cfgVar?'Yerel mod':
      state==='busy'?'Eşitleniyor…':
      state==='err'?'Eşitleme hatası':
      state==='ok'?'Eşitlendi':'Bekliyor';
  },
  hataBildirildi:false, // K3.4: hata toast'ı bir kez; 'ok'a dönünce sıfırlanır
  setState(s,msg){
    this.state=s;this.lastMsg=msg||'';
    if(s==='err'){
      if(!this.hataBildirildi){this.hataBildirildi=true;UI.toast('Eşitleme hatası'+(this.lastMsg?': '+this.lastMsg:''),'err')}
    }else if(s==='ok')this.hataBildirildi=false;
    this.render();
  },
  render(){
    const d=this.durumMetni(this.state,!!this.cfg);
    const ms=$('#mobildurum'); // telefon üst barı (UI.shell kurar)
    if(ms){ms.textContent=d;ms.className=this.cfg&&this.state==='err'?'err':''}
    const el=$('#syncpill');if(!el)return;
    el.className='sync-pill '+(this.state==='ok'?'ok':this.state==='busy'?'busy':this.state==='err'?'err':'');
    const txt=el.querySelector('.txt');
    if(txt)txt.textContent=!this.cfg?d:
      this.state==='err'?(d+(this.lastMsg?': '+this.lastMsg:'')):
      this.state==='ok'?(d+(this.lastSyncAt?' · '+this.agoText(this.lastSyncAt,Date.now()):'')):d;
  },
  /* ms zamanının "az önce / N sn önce / N dk önce / N sa önce / dün / N gün önce" metni (saf) */
  agoText(ms,now){
    const s=Math.floor((now-ms)/1000);
    if(s<10)return 'az önce';
    if(s<60)return s+' sn önce';
    if(s<3600)return Math.floor(s/60)+' dk önce';
    if(s<86400)return Math.floor(s/3600)+' sa önce';
    const g=Math.floor(s/86400);
    return g<2?'dün':g+' gün önce';
  },

  /* base64 (satır sonlu olabilir) → UTF-8 metin (saf); Contents ve blob yolları ortak kullanır */
  b64Metin(b64){
    const bin=atob(String(b64||'').replace(/\s/g,''));
    const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  },

  /* iki veri seti arasında kayıt bazında değişiklik özeti (saf) */
  changeSummary(before,after){
    const out={added:0,updated:0,deleted:0,by:[]};
    if(!before||!after)return out;
    const who=r=>{const n=r.updatedBy||r.enteredBy;if(n&&!out.by.includes(n))out.by.push(n)};
    for(const name of COLS){
      const old=new Map((before[name]||[]).map(r=>[r.id,r]));
      for(const r of (after[name]||[])){
        const o=old.get(r.id);
        if(!o){if(!r.deleted){out.added++;who(r)}}
        else if(!o.deleted&&r.deleted){out.deleted++;who(r)}
        else if(!r.deleted&&String(r.updatedAt||'')>String(o.updatedAt||'')){out.updated++;who(r)}
      }
    }
    return out;
  },
  /* özetten toast metni (saf); değişiklik yoksa null */
  changeText(sum,me){
    const {added:a,updated:u,deleted:d}=sum;
    if(!(a+u+d))return null;
    const names=sum.by.filter(Boolean);
    const diger=!names.length||(names.length===1&&names[0]===me); // kişi bilinmiyor ya da aynı kişinin diğer cihazı
    const parts=[];
    if(a)parts.push(a+(diger?' yeni kayıt geldi':' yeni kayıt girdi'));
    if(u)parts.push(diger?u+' kayıt güncellendi':u+' kaydı güncelledi');
    if(d)parts.push(diger?d+' kayıt silindi':d+' kaydı sildi');
    if(diger)return 'Diğer cihazdan '+parts.join(', ');
    const kim=names.length>1?names.slice(0,-1).join(', ')+' ve '+names[names.length-1]:names[0];
    return kim+' '+parts.join(', ');
  },

  schedule(){ // düzenlemeden 1.5 sn sonra gönder
    if(!this.cfg)return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.push(),1500);
  },

  /* tek iş kuyruğu: pull ve push SIRAYLA çalışır (şifrelemesi süren push'u biten bir pull geçersiz kılıp kaydı düşürmesin) */
  run(fn){
    const p=(this.q||Promise.resolve()).then(fn);
    this.q=p.catch(()=>{}); // bir işin hatası kuyruğu tıkamasın
    return p;
  },
  pull(){ // kuyrukta bekleyen/süren pull varsa ikinci pull beklemeden false döner
    if(this.pullP)return Promise.resolve(false);
    const p=this.run(()=>this._pull()).then(r=>{if(this.state==='ok'&&Store.dirty)this.schedule();return r}) // başarılı çekmeden sonra gönderilmemiş değişiklik varsa yeniden gönder
      .finally(()=>{this.pullP=null});
    return this.pullP=p;
  },
  async _pull(){
