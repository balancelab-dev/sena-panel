  esikSec(v){HatirlatmaVM.esik=Number(v)||30},
  /* «Dikkat gerekenler» de aynı metni kullanır */
  waMetni(c){return 'Merhaba '+c.name.split(' ')[0]+', nasılsınız? Bir süredir görüşemedik, dilerseniz yeni bir seans planlayabiliriz. 🌿 '+Store.data.settings.clinicName},
  liste(ctx){
    const t=(ctx&&ctx.bugun)||todayStr();const esik=HatirlatmaVM.esik;
    const satirlar=[],ulasilanlar=[];
    for(const c of Store.col('clients')){
      if(c.status!=='aktif'&&c.status!=='pasif')continue;
      const st=Store.clientStats(c.id);
      if(st.sonraki)continue;
      const baz=st.son?st.son.date:String(c.createdAt||'').slice(0,10);
      if(!baz)continue;
      const gun=daysBetween(baz,t);
      if(gun<esik)continue;
      const u=c.ulasildi&&c.ulasildi.tarih&&daysBetween(c.ulasildi.tarih,t)<HatirlatmaVM.ULASILDI_GUN?c.ulasildi:null;
      (u?ulasilanlar:satirlar).push({id:c.id,ad:c.name,bas:initials(c.name),renk:avColor(c.name),gun,
        aciklama:st.son?'Son seans '+fmtD(st.son.date)+' · '+gun+' gün önce':'Hiç seansa gelmedi · '+gun+' gündür kayıtlı',
        araVerdi:c.status==='pasif',telefon:c.phone||null,
        waHref:c.phone?waLink(c.phone,HatirlatmaVM.waMetni(c)):null,
        ulasildi:u?fmtD(u.tarih)+(u.kim?' · '+u.kim+' ulaştı':' ulaşıldı'):null,uTarih:u?u.tarih:''});
    }
    satirlar.sort((a,b)=>a.gun-b.gun||a.ad.localeCompare(b.ad,'tr'));
    ulasilanlar.sort((a,b)=>a.uTarih<b.uTarih?1:a.uTarih>b.uTarih?-1:a.ad.localeCompare(b.ad,'tr'));
    return {esik:String(esik),esikSecenekleri:HatirlatmaVM.esikSecenekleri,satirlar,ulasilanlar,bos:!satirlar.length&&!ulasilanlar.length,
      sayac:satirlar.length?satirlar.length+' danışan':''};
  }
};
/* ==== vm_finans.js ==== */
/* Finans (özet, hareketler, paketler, tekrarlayanlar, muhasebe özeti) ViewModel'i — ekranın gösterdiği her şeyi DOM'suz hesaplar.
   Gezinti durumu (ay, sekme) burada durur; view yalnız durum() çıktısını çizer. Store'u okur, YAZMAZ.
   Grafik/SVG çizimi view'da kalır; burası seriyi verir. */
const FinansVM={
  ay:monthKey(todayStr()),
  sekme:'ozet',
  sekmeler:[['ozet','Özet'],['hareket','Hareketler'],['tekrar','Tekrarlayanlar'],['paket','Paketler']],
  /* E4: «Para nereye gitti?» kartının dönemi (Bu ay = aşağıdaki ay seçicinin ayı) */
  AKIS_DONEMLERI:[['ay','Bu ay'],['son3','Son 3 ay'],['son6','Son 6 ay'],['yil','Bu yıl']],
  akisDonem:'ay',
  akisDonemSec(d){if(FinansVM.AKIS_DONEMLERI.some(x=>x[0]===d))FinansVM.akisDonem=d},

  ayKaydir(yon){FinansVM.ay=addMonths(FinansVM.ay,yon)},
  sekmeSec(t){FinansVM.sekme=t},

  /* ctx.bugun: 'YYYY-MM-DD' (verilmezse todayStr()). Çıktı: seçili sekmenin verisi (ozet|hareket|paket|tekrar), diğerleri null. */
  durum(ctx){
    const bugun=(ctx&&ctx.bugun)||todayStr();
    const mk=FinansVM.ay;
    const s=FinansVM.sekme;
    const cikti={
      bugun,ay:mk,ayEtiket:monthLabel(mk),sekme:s,sekmeler:FinansVM.sekmeler,
      ozet:null,hareket:null,paket:null,tekrar:null
    };
    const user=(ctx&&ctx.user)||Store.user; /* KUL2: kimin gözüyle? Gizlilik politikası VM'de uygulanır, view yalnız döneni çizer */
    if(s==='ozet')cikti.ozet=FinansVM._ozet(mk,bugun,user);
    else if(s==='hareket')cikti.hareket=FinansVM._hareket(mk,user);
    else if(s==='paket')cikti.paket=FinansVM._paket();
    else cikti.tekrar=FinansVM._tekrar(mk,user);
    return cikti;
  },

  /* H-N7: seçili aydaki işlemleri kategoriye göre topla, değere göre azalan */
  _katToplam(type,mk){
    const map={};
    for(const tr of Store.col('transactions'))if(tr.type===type&&monthKey(tr.date)===mk)
      map[tr.category||'Diğer']=(map[tr.category||'Diğer']||0)+Number(tr.amount||0);
    return Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  },

  /* H-N4/N5/N6/N8 */
  _ozet(mk,bugun,user){
    const fin=Store.monthFin(mk);
    const kisiselVar=Gizlilik.kisiselGorur(user); /* KUL2: Ketty kişisel harcamayı görmez (Gizlilik tek politika noktası) */
    const kartlar=[
      {etiket:'İş geliri',deger:money(fin.gelir,true),ek:fin.seansSayi+' seans işlendi',sinif:''},
      {etiket:'Ofis gideri',deger:money(fin.gider,true),ek:null,sinif:''},
      {etiket:'Net (iş)',deger:money(fin.net,true),ek:null,sinif:fin.net>=0?'pos':'neg'}
    ];
    if(kisiselVar)kartlar.push({etiket:'Kişisel harcama',deger:money(fin.kisisel,true),ek:null,sinif:''});

    /* son 6 ay: bugünün ayında biter (seçili ayda değil) */
    const aylar=[];{let m=monthKey(bugun);for(let i=0;i<6;i++){aylar.unshift(m);m=addMonths(m,-1)}}
    const fins=aylar.map(m=>Store.monthFin(m));
    const etiketler=aylar.map(monthLabelShort);
    const ipucu=aylar.map(monthLabel);
    const gelirGider={
      baslik:'Gelir ve gider — son 6 ay',etiketler,ipucu,
      seriler:[
        {ad:'Gelir',renk:'var(--s3)',degerler:fins.map(f=>f.gelir)},
        {ad:'Gider',renk:'var(--s2)',degerler:fins.map(f=>f.gider)}
      ]
    };
    const eksi=aylar.map((m,i)=>({m,net:fins[i].net})).filter(x=>x.net<0);
    const net={
      baslik:'Net kâr — son 6 ay',etiketler,ipucu,
      seriler:[{ad:'Net',renk:'var(--s1)',degerler:fins.map(f=>Math.max(0,f.net))}],
      eksiAyMetni:eksi.length?'Eksi veren aylar: '+eksi.map(x=>monthLabelShort(x.m)+' ('+money(x.net)+(x.m===monthKey(bugun)?', ay sürüyor':'')+')').join(', '):null
    };

    const kirilim=(baslik,type,renk,bosMetin)=>{
      const ogeler=FinansVM._katToplam(type,mk);
      return {baslik,renk,ogeler,bos:!ogeler.length,bosMetin};
    };
    const gelirOgeler=[{label:'Seans tahsilatları',value:fin.seansTutar}].concat(FinansVM._katToplam('gelir',mk)).filter(x=>x.value>0);

    return {
      akis:kisiselVar?FinansVM.akis({donem:FinansVM.akisDonem,bugun}):null, /* «Para nereye gitti?» Sena'nın kişisel para yönetimi kartı */
      kartlar,gelirGider,net,
      giderKirilim:kirilim('Ofis giderleri — kırılım','gider','var(--s2)','Bu ay gider girilmemiş'),
      kisiselKirilim:kisiselVar?kirilim('Kişisel harcamalar — kırılım','kisisel','var(--s4)','Bu ay kişisel harcama girilmemiş'):null,
      gelirKaynaklari:{baslik:'Gelir kaynakları',renk:'var(--s3)',ogeler:gelirOgeler,bos:!gelirOgeler.length,bosMetin:'Bu ay gelir yok'}
    };
  },

  /* ---------- E4: «Para nereye gitti?» ---------- */
  /* dönem → {bas,son,etiket}; tarihler 'YYYY-MM-DD' (dizgi kıyası). ay = FinansVM.ay (tam ay); son3/son6 = bugünün ayı dahil N tam ay;
     yil = 1 Ocak'tan bugüne (bugün DAHİL, sonrası hariç). */
  _akisAralik(donem,bugun){
    if(donem==='son3'||donem==='son6'){
      const n=donem==='son3'?3:6,sonAy=monthKey(bugun),ilk=addMonths(sonAy,-(n-1));
      const a=monthLabel(ilk),b=monthLabel(sonAy);
      return {bas:ilk+'-01',son:sonAy+'-31',etiket:(ilk.slice(0,4)===sonAy.slice(0,4)?a.split(' ')[0]:a)+' – '+b};
    }
    if(donem==='yil'){
      const y=bugun.slice(0,4),g=parseD(bugun);
      return {bas:y+'-01-01',son:bugun,etiket:'1 Ocak – '+g.getDate()+' '+AYLAR[g.getMonth()]+' '+y};
    }
    const mk=FinansVM.ay;
    return {bas:mk+'-01',son:mk+'-31',etiket:monthLabel(mk)};
  },

  /* {ad:tutar} → azalan liste; 5'ten fazlaysa ilk 5 + «Diğer» (zaten «Diğer» adlı kalem varsa onunla birleşir) */
  _akisGrupla(harita){
    const liste=Object.entries(harita).map(([ad,tutar])=>({ad,tutar})).filter(x=>x.tutar>0)
      .sort((a,b)=>b.tutar-a.tutar||a.ad.localeCompare(b.ad,'tr'));
    if(liste.length<=5)return liste;
    const ilk=liste.slice(0,5),artan=liste.slice(5).reduce((t,x)=>t+x.tutar,0);
    const dg=ilk.find(x=>x.ad==='Diğer');
    if(dg)dg.tutar+=artan;else ilk.push({ad:'Diğer',tutar:artan});
    return ilk;
  },

  /* en büyük kalan yöntemi: değerler tabana oranlanır; değerler toplamı = taban ise tam sayı yüzdelerin toplamı TAM `toplam` (varsayılan 100) */
  _yuzler(degerler,taban,toplam=100){
    if(!(taban>0))return degerler.map(()=>0);
    const ham=degerler.map(v=>v/taban*toplam),alt=ham.map(Math.floor);
    let eksik=toplam-alt.reduce((a,b)=>a+b,0);
    const sira=ham.map((x,i)=>[x-alt[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
    for(let k=0;eksik>0&&sira.length;k++,eksik--)alt[sira[k%sira.length][1]]++;
    return alt;
  },

  /* ctx: {donem:'ay'|'son3'|'son6'|'yil', bugun:'YYYY-MM-DD'}. Saf hesap: Store'u yalnız okur. */
  akis(ctx){
    const bugun=(ctx&&ctx.bugun)||todayStr();
    const donem=FinansVM.AKIS_DONEMLERI.some(x=>x[0]===(ctx&&ctx.donem))?ctx.donem:'ay';
    const ar=FinansVM._akisAralik(donem,bugun);
    const icinde=d=>!!d&&d>=ar.bas&&d<=ar.son;
    const gelirH={},giderH={},kisiselH={};
    let seans=0;
    for(const p of Store.col('payments'))if(icinde(p.date))seans+=Number(p.amount)||0;
    if(seans>0)gelirH['Seans tahsilatları']=seans;
    for(const tr of Store.col('transactions')){
      if(!icinde(tr.date))continue;
      const hedef=tr.type==='gelir'?gelirH:tr.type==='gider'?giderH:tr.type==='kisisel'?kisiselH:null;
      if(hedef)hedef[tr.category||'Diğer']=(hedef[tr.category||'Diğer']||0)+(Number(tr.amount)||0);
    }
    const kaynakL=FinansVM._akisGrupla(gelirH),ofisL=FinansVM._akisGrupla(giderH),kisiselL=FinansVM._akisGrupla(kisiselH);
    const topla=l=>l.reduce((t,x)=>t+x.tutar,0);
    const gelir=topla(kaynakL),ofis=topla(ofisL),kisisel=topla(kisiselL);
    const harcama=ofis+kisisel;
    const birikimden=Math.max(0,harcama-gelir),kalan=Math.max(0,gelir-harcama);
    const taban=gelir+birikimden; /* = ofis+kisisel+kalan her durumda */
    const bos=taban===0;
    const para=n=>money(n);
    const yuz100=n=>taban>0?Math.round(n/taban*100):0;

    const [yOfis,yKisisel,yKalan]=FinansVM._yuzler([ofis,kisisel,kalan],taban);
    const kaynakY=FinansVM._yuzler(kaynakL.map(x=>x.tutar).concat(birikimden>0?[birikimden]:[]),taban);
    const kaynaklar=kaynakL.map((x,i)=>({ad:x.ad,tutar:x.tutar,tutarMetni:para(x.tutar),yuz:kaynakY[i]}));
    /* kategori payları grubun payını paylaşır (en büyük kalan): satırdaki kategori yüzdeleri grup yüzdesine TAM toplanır */
    const grup=(toplam,yuz,l)=>{
      const ky=FinansVM._yuzler(l.map(x=>x.tutar),toplam,yuz);
      return {toplam,toplamMetni:para(toplam),yuz,kategoriler:l.map((x,i)=>({ad:x.ad,tutar:x.tutar,tutarMetni:para(x.tutar),yuz:ky[i],yuzMetni:ky[i]===0&&x.tutar>0?'<1':String(ky[i])}))};
    };
    const ofisG=grup(ofis,yOfis,ofisL),kisiselG=grup(kisisel,yKisisel,kisiselL);

    /* en büyük tek kalem (ofis + kişisel kategorileri; «Diğer» toplamı kalem sayılmaz) */
    const adaylar=Object.entries(giderH).map(([ad,t])=>({ad,tutar:t,grup:'ofis'}))
      .concat(Object.entries(kisiselH).map(([ad,t])=>({ad,tutar:t,grup:'kisisel'}))).filter(x=>x.tutar>0)
      .sort((a,b)=>b.tutar-a.tutar||a.ad.localeCompare(b.ad,'tr'));
    const enBuyuk=adaylar.length?{...adaylar[0],tutarMetni:para(adaylar[0].tutar)}:null;

    /* başlık cümlesi */
    let cumle;
    if(bos)cumle='Bu dönemde hareket yok';
    else if(birikimden>0)cumle='Harcamalar geliri '+para(birikimden)+' aştı — fark birikimden karşılanmış görünüyor.';
    else{
      const pay=(y)=>y>0?y+" ₺'si":"1 ₺'den azı";
      const gitti=[];
      if(ofis>0)gitti.push(pay(yOfis)+' ofise');
      if(kisisel>0)gitti.push(pay(yKisisel)+' kişisel harcamaya');
      if(!gitti.length)cumle="Gelen her 100 ₺'nin tamamı kaldı; bu dönemde harcama girilmemiş.";
      else cumle="Gelen her 100 ₺'nin "+gitti.join(', ')+' gitti; '+
        (yKalan>0?yKalan+' ₺ kaldı':kalan>0?'çok az kaldı':'hiçbir şey kalmadı')+'.';
    }
    if(!bos&&enBuyuk)cumle+=' En büyük kalem: '+enBuyuk.ad+' ('+enBuyuk.tutarMetni+').';

    /* Sankey düğümleri (sütun 0 kaynaklar · 1 gelir · 2 ofis/kişisel/kalan · 3 kategoriler) ve bağlar */
    const dugumler=[],baglar=[];
    const dn=(id,ad,sutun,tutar,yuz,renk,kol,kisa)=>dugumler.push({id,ad,kisa:kisa||ad,sutun,tutar,tutarMetni:para(tutar),yuz,renk,kol});
    const bg=(kaynak,hedef,tutar,renk)=>{if(tutar>0)baglar.push({kaynak,hedef,tutar,renk})};
    if(!bos){
      const R={gelir:'var(--brand)',ofis:'var(--s2)',kisisel:'var(--s4)',kalan:'var(--brand-2)',birikim:'var(--muted)'};
      kaynakL.forEach((x,i)=>{dn('k'+i,x.ad,0,x.tutar,kaynakY[i],R.gelir,'gelir');bg('k'+i,'gelir',x.tutar,R.gelir)});
      if(birikimden>0){dn('birikim','Birikimden',0,birikimden,kaynakY[kaynakL.length],R.birikim,'birikim','Birikim');bg('birikim','gelir',birikimden,R.birikim)}
      dn('gelir',birikimden>0?'Gelir + birikim':'Gelir',1,taban,100,R.gelir,'gelir','Gelir');
      if(ofis>0){dn('ofis','Ofis giderleri',2,ofis,yOfis,R.ofis,'ofis','Ofis');bg('gelir','ofis',ofis,R.ofis)}
      if(kisisel>0){dn('kisisel','Kişisel harcamalar',2,kisisel,yKisisel,R.kisisel,'kisisel','Kişisel');bg('gelir','kisisel',kisisel,R.kisisel)}
      if(kalan>0){dn('kalan','Kalan',2,kalan,yKalan,R.kalan,'kalan');bg('gelir','kalan',kalan,R.kalan)}
      ofisL.forEach((x,i)=>{dn('o'+i,x.ad,3,x.tutar,ofisG.kategoriler[i].yuz,R.ofis,'ofis');bg('ofis','o'+i,x.tutar,R.ofis)});
      kisiselL.forEach((x,i)=>{dn('p'+i,x.ad,3,x.tutar,kisiselG.kategoriler[i].yuz,R.kisisel,'kisisel');bg('kisisel','p'+i,x.tutar,R.kisisel)});
    }

    /* «Her 100 ₺» paneli: Ofis · Kişisel · Kalan (aşımda Kalan yerine Birikimden karşılanan) */
    const satir=(kod,ad,renk,toplam,yuz,kategoriler)=>({kod,ad,renk,tutar:toplam,tutarMetni:para(toplam),yuz,kategoriler});
    const satirlar=[
      satir('ofis','Ofis','var(--s2)',ofis,yOfis,ofisG.kategoriler),
      satir('kisisel','Kişisel','var(--s4)',kisisel,yKisisel,kisiselG.kategoriler)
    ];
    if(birikimden>0){const b=satir('birikim','Birikimden karşılanan','var(--muted)',birikimden,yuz100(birikimden),[]);b.not=true;satirlar.push(b)}
    else satirlar.push(satir('kalan','Kalan','var(--brand)',kalan,yKalan,[]));
    const kartlar=bos?[]:[
      {kod:'gelir',etiket:'Toplam gelir',deger:para(gelir),ek:kaynakL.length+' kaynak',vurgu:false},
      {kod:'ofis',etiket:'Ofis giderleri',deger:para(ofis),ek:'%'+yOfis+' payı',vurgu:false},
      {kod:'kisisel',etiket:'Kişisel harcamalar',deger:para(kisisel),ek:'%'+yKisisel+' payı',vurgu:false},
      birikimden>0?{kod:'birikim',etiket:'Birikimden',deger:para(birikimden),ek:'harcama geliri aştı',vurgu:true}
        :{kod:'kalan',etiket:'Kalan',deger:para(kalan),ek:'%'+yKalan+' payı',vurgu:true}
    ];

    return {

      enBuyukKalem:enBuyuk,dugumler,baglar,kartlar,
      panel:{baslik:birikimden>0?"Harcanan her 100 ₺":"Gelen her 100 ₺",ust:ar.etiket,satirlar}
    };
  },

  /* H-N9 */
  _hareket(mk,user){
    const list=[];
    Store.col('payments').filter(p=>monthKey(p.date)===mk).forEach(p=>list.push({
      date:p.date,type:'gelir',cat:p.amount<0?'Para iadesi':'Seans tahsilatı',label:Store.clientName(p.clientId)+' ('+(p.method||'')+')',amt:p.amount,by:p.enteredBy,pay:p}));
    const kisiselVar=Gizlilik.kisiselGorur(user);
    Store.col('transactions').filter(x=>monthKey(x.date)===mk&&(kisiselVar||x.type!=='kisisel')).forEach(x=>list.push({
      date:x.date,type:x.type,cat:x.category,label:x.note||x.category,amt:x.amount,by:x.enteredBy,tr:x}));
    list.sort((a,b)=>a.date<b.date?1:-1);
    return {
      baslik:list.length+' hareket',bos:!list.length,bosMetin:'Bu ay hareket yok',
      satirlar:list.map(en=>({
        islem:en.tr||null, /* yalnız transaction satırları tıklanabilir (Forms.transaction(null,islem)) */
        cipMetin:en.type==='gelir'?'Gelir':en.type==='kisisel'?'Kişisel':'Gider',
        cipSinif:en.type==='gelir'?'sage':en.type==='kisisel'?'lav':'blush',
        etiket:en.label,
        alt:fmtD(en.date)+' · '+en.cat+(en.by?' · '+en.by:''),
        tutar:(en.type==='gelir'&&en.amt>=0?'+':'−')+money(Math.abs(en.amt)), /* para iadesi: eksi tahsilat → «−» */
        tutarSinif:en.type==='gelir'&&en.amt>=0?'pos':'neg'
      }))
    };
  },

  /* H-N10 + H-N11 */
  _paket(){
    const tpls=Store.col('packages');
    const tanimlar=tpls.map(p=>{
      const normal=(Store.data.settings.defaultFee||0)*p.sessions;
      return {
        kayit:p,id:p.id,ad:p.name,
        alt:p.sessions+' seans · seans başı '+money(Math.round(p.price/p.sessions))+(normal>p.price?' · '+money(normal-p.price)+' avantaj':''),
        tutar:money(p.price)
      };
    });
    const sales=Store.col('packageSales').sort((a,b)=>a.date<b.date?1:-1);
    const satislar=sales.map(s=>{
      const u=Store.saleUsage(s);const ad=Store.clientName(s.clientId);
      return {
        danisan:ad,bas:initials(ad),renk:avColor(ad),
        alt:s.name+' · '+fmtD(s.date)+' · '+money(s.price),

        cipSinif:u.remaining===0?'gray':u.remaining===1?'sand':'sage',
        cipMetin:u.remaining===0?'Tamamlandı':u.used+'/'+s.sessions+' · '+u.remaining+' kaldı'
      };

    return {
      tanimlar,tanimBos:!tpls.length,
      tanimBosMetin:'Henüz paket yok. Örn: "5 Seanslık Paket" tasarlayın, danışanlara indirimli önerin — peşin gelir sağlar, danışanı da düzenli gelmeye teşvik eder.',
      satislar,satisBos:!sales.length,satisBosMetin:'Henüz satış yok'
    };
  },

  /* H-N12: `entered` SEÇİLİ ay için */
  _tekrar(mk,user){
    const kisiselVar=Gizlilik.kisiselGorur(user);
    const recs=Store.col('recurring').filter(r=>kisiselVar||r.type!=='kisisel');
    return {
      bos:!recs.length,
      bosMetin:'Kira, fatura gibi her ay tekrar eden ödemeleri buraya ekleyin; panel zamanı gelince hatırlatır',
      satirlar:recs.map(r=>{
        const odendi=Store.col('transactions').some(x=>x.recurringId===r.id&&monthKey(x.date)===mk);
        return {
          kayit:r,id:r.id,ad:r.name,
          alt:'Her ayın '+r.dayOfMonth+'. günü · '+r.category+' · '+(r.type==='kisisel'?'kişisel':'ofis'),
          tutar:money(r.amount),odendi,
          durumMetin:odendi?'bu ay ödendi ✓':'bu ay bekliyor'
        };
      })
    };
  },

  /* H-N1…N3: yazdırılabilir muhasebe özeti verisi (yazdırma DOM'u view'da).
     opts.bugunMetni: 'GG.AA.YYYY' (verilmezse bugünün tr-TR tarihi). */
  muhasebe(mk,opts){
    const bugunMetni=(opts&&opts.bugunMetni)||new Date().toLocaleDateString('tr-TR');
    const s=Store.data.settings;
    const pays=Store.col('payments').filter(p=>monthKey(p.date)===mk);
    const trs=Store.col('transactions').filter(x=>monthKey(x.date)===mk);
    const byMethod={nakit:0,havale:0,kart:0};
    pays.forEach(p=>{byMethod[p.method||'nakit']=(byMethod[p.method||'nakit']||0)+Number(p.amount||0)});
    const otherInc={};trs.filter(x=>x.type==='gelir').forEach(x=>otherInc[x.category||'Diğer']=(otherInc[x.category||'Diğer']||0)+Number(x.amount||0));
    const exp={};trs.filter(x=>x.type==='gider').forEach(x=>exp[x.category||'Diğer']=(exp[x.category||'Diğer']||0)+Number(x.amount||0));
    const fin=Store.monthFin(mk);
    const giderToplam=Object.values(exp).reduce((a,b)=>a+b,0);
    return {
      klinik:s.clinicName||'Sena Psikoloji',
      baslik:'Aylık Gelir–Gider Özeti · '+monthLabel(mk),
      gelirler:{
        baslik:'GELİRLER',
        satirlar:[['Seans / danışan tahsilatları — Nakit',money(byMethod.nakit||0)],
          ['Seans / danışan tahsilatları — Havale/EFT',money(byMethod.havale||0)],
          ['Seans / danışan tahsilatları — Kart',money(byMethod.kart||0)]]
          .concat(Object.entries(otherInc).map(([k,v])=>[k,money(v)])),
        toplam:money(fin.gelir)
      },
      giderler:{
        baslik:'GİDERLER',
        satirlar:Object.entries(exp).map(([k,v])=>[k,money(v)]),
        toplam:money(giderToplam)
      },
      net:money(fin.net),
      not:'Yapılan seans: '+fin.seansSayi+' · Tahsilat kalemi: '+pays.length+' adet · Gider kalemi: '+trs.filter(x=>x.type==='gider').length+' adet. '+
        'Kişisel harcamalar bu özete dahil değildir. Hazırlayan: '+Store.user+' · '+bugunMetni+' · '+(s.clinicName||'')+' paneli.'
    };
  }
};
/* ==== vm_raporlar.js ==== */
/* Raporlar ViewModel'i — Raporlar ekranının gösterdiği her şeyi DOM'suz hesaplar (H-R1…H-R8).
   durum({bugun}) düz veri döner; SVG/ızgara çizimi view'dadır. Store'u okur, yazmaz.
   Not: uzak sayısı Store.alerts()'ten gelir (o da todayStr() kullanır) — bugun verilse bile alerts gerçek saatle çalışır. */
const RaporVM={
  AY_SAYISI:6,
  ISI_SAATLERI:[8,21],      /* 8..21 (14 sütun) */
  ISI_GUN_ARALIGI:56,       /* son 56 gün */
  ONERI_GUNLERI:5,          /* Pzt–Cum */
  EN_SIK_SAYI:7,

  durum(ctx){
    const t=(ctx&&ctx.bugun)||todayStr();
    const mk=monthKey(t);
    const appts=Store.col('appointments');
    const clients=Store.col('clients');

    /* H-R1 — son 6 ay (eskiden yeniye) */
    const aylar=[];{let k=mk;for(let i=0;i<this.AY_SAYISI;i++){aylar.unshift(k);k=addMonths(k,-1)}}
    const ayApp=m=>appts.filter(a=>monthKey(a.date)===m);
    const seans=aylar.map(m=>ayApp(m).filter(a=>a.status==='geldi').length);
    const tekil=aylar.map(m=>new Set(ayApp(m).filter(a=>a.status==='geldi').map(a=>a.clientId)).size);
    const gelmedi=aylar.map(m=>ayApp(m).filter(a=>a.status==='gelmedi').length);
    const revize=aylar.map(m=>ayApp(m).filter(a=>a.status==='revize').length);
    const etiketler=aylar.map(monthLabelShort);
    const baslikler=aylar.map(monthLabel);

    /* H-R2 — no-show oranı ve metni */
    const topSeans=seans.reduce((a,b)=>a+b,0);
    const topGelmedi=gelmedi.reduce((a,b)=>a+b,0);
    const topApp=topSeans+topGelmedi;
    const oran=topApp?Math.round(topGelmedi/topApp*100):0;
    const oranMetni='6 aylık gelmeme oranı: %'+oran+(oran>15?' — yüksek; hatırlatma mesajları düzenli gönderilmeli':oran>0?' — makul seviyede':'');

    /* H-R3 — ısı haritası (son 56 gün, 8–21 saat) */
    const from=addDays(t,-this.ISI_GUN_ARALIGI);
    const saatler=[];for(let s=this.ISI_SAATLERI[0];s<=this.ISI_SAATLERI[1];s++)saatler.push(String(s));
    const matris=GUNLER_K.map(()=>saatler.map(()=>0));
    let maxCell=0;
    appts.filter(a=>a.date>=from&&a.date<=t&&(a.status==='geldi'||a.status==='planlandi')).forEach(a=>{
      const di=(parseD(a.date).getDay()+6)%7;
      const hi=saatler.indexOf(String(Number((a.time||'').slice(0,2))));
      if(hi>=0){matris[di][hi]++;maxCell=Math.max(maxCell,matris[di][hi])}
    });
    let oneri=null;
    if(maxCell>0){
      let best=null;
      for(let i=0;i<this.ONERI_GUNLERI;i++)for(let j=2;j<saatler.length-2;j++)
        if(matris[i][j]===0&&(!best))best=GUNLER[i]+' '+saatler[j]+':00';
      if(best)oneri='İpucu: '+best+' civarı genelde boş — yeni danışanları bu saatlere yönlendirebilirsiniz.';
    }
    const isi={gunler:GUNLER_K.slice(),saatler,matris,maxCell,bos:maxCell===0,
      bosMetni:'Henüz yeterli randevu verisi yok',oneri};

    /* H-R4/H-R5 — danışan akışı */
    const yeni=aylar.map(m=>clients.filter(c=>monthKey((c.createdAt||'').slice(0,10))===m).length);
    const aktif=clients.filter(c=>c.status==='aktif').length;
    const uzak=Store.alerts().filter(a=>a.type==='uzak').length;

    /* H-R6 — son 3 ay en sık gelenler (ilk 7) */
    const from3=addMonths(mk,-2)+'-01';
    const cnt={};
    appts.filter(a=>a.status==='geldi'&&a.date>=from3).forEach(a=>cnt[a.clientId]=(cnt[a.clientId]||0)+1);
    const enSik=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,this.EN_SIK_SAYI)
      .map(([cid,n])=>({label:Store.clientName(cid),value:n}));

    /* H-R7 — kaynak kırılımı (pasif/tamamlandı dahil) */
    const smap={};
    clients.forEach(c=>{const k=c.source||'Belirtilmemiş';smap[k]=(smap[k]||0)+1});
    const kaynak=Object.entries(smap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);

    /* H-R8 — aylık özet tablosu (yeniden eskiye) */
    const satirlar=aylar.slice().reverse().map(m=>{
      const f=Store.monthFin(m);
      return {ay:m,hucreler:[monthLabel(m),num(f.seansSayi),num(tekil[aylar.indexOf(m)]),money(f.gelir),money(f.gider),money(f.net)],
        netSinif:f.net>=0?'pos':'neg'};
    });

    return {
      bugun:t,
      aylar:{anahtarlar:aylar,etiketler,baslikler},
      seansDanisan:{seans,tekil},
      gelmeyen:{gelmedi,revize,oran,oranMetni},
      isi,
      akis:{yeni,aktif,uzak,ozet:'Şu an '+aktif+' aktif danışan · '+uzak+' danışan uzaklaşma listesinde'},
      enSik:{liste:enSik,birim:' seans',bosMetni:'Henüz veri yok'},
      kaynak:{liste:kaynak,birim:' kişi',bosMetni:'Danışan kartlarına "nereden geldi" bilgisi girerseniz burada görünür'},
      tablo:{basliklar:['Ay','Seans','Danışan','Gelir','Gider','Net'],satirlar}
    };
  }
};

/* Ayarlar ViewModel'i — form başlangıç değerleri ve dışa aktarım içerikleri (H-S1…H-S3), DOM'suz.
   Store/Sync'i okur, YAZMAZ (yazma Islem/Sync'in işi). Ekranın gezinti durumu (açık bölümler) burada durur. */
const AyarVM={
  /* <details> açık/kapalı: yalnız kullanıcının AÇIKÇA değiştirdiği bölümler (id → bool); yoksa varsayılan */

    if(id==='github')return !Sync.cfg;
    return false;

  bolumAcik(id){

  bolumDegisti(id,acik){

  bolumSifirla(id){delete this.acikBolumler[id]},
  bolumleriSifirla(){this.acikBolumler={}},
  /* uyarıdan gelince (UI.go('set','yedek')) ilgili bölüm açık başlar; bilinmeyen/boş ad yok sayılır */
  bolumAc(id){if(id&&typeof id==='string')this.acikBolumler[id]=true},

  /* Görünüm bölümü (E3): seg seçenekleri + bu cihazın seçili teması + alt yazı. Cihaz-yerel; veriye YAZMAZ. */
  gorunumForm(){

      yardim:'Üst menü yalnız geniş ekranda; telefonda alt sekmeler kalır. Seçim yalnız bu cihaza uygulanır.',
      bildirim:'Görünüm değişti'};
  },

  /* Yedekten geri yükle onayı (E3): yedekDogrula özetinden onay metni */
  yedekOnayMetni(ozet){

    return 'Mevcut tüm kayıtlar bu yedekle DEĞİŞTİRİLSİN mi? Yedekte '+ozet.danisan+' danışan, '+ozet.randevu+' randevu var.'+tarih+
      ' Bu işlem diğer cihazlara da yansır.';

  /* Genel bölümü alanlarının başlangıç değerleri (ham: defaultFee vb. yoksa undefined kalır) */
  genelForm(){

    return {clinicName:s.clinicName||'',assistantName:s.assistantName||'',defaultFee:s.defaultFee,
      inactiveWeeks:s.inactiveWeeks,debtWarn:s.debtWarn,waTemplate:s.waTemplate||''};
  },

  /* ================= Cihaz ekleme · yeni kurtarma kodu · parola · kategori kutuları (D3b) =================
     Hangi düğmenin KİME görüneceği ve TÜM metinler burada; ekran (ekran_settings.js) yalnız çizer ve Islem komutunu çağırır.

     Ekranda iç terim geçmez (zarf · sarma · anahtar…): kullanıcılar teknik değil. */
  M:{
    githubBilgi:"Veriler şifrelenmiş olarak özel (private) bir GitHub reposundaki tek dosyada saklanır. Yeni cihazlar Sena'nın davetiyle eklenir.",
    cihaz:{baslik:'Cihaz ekle',
      aciklama:"Yeni bir telefon ya da bilgisayarı eklemek için davet hazırlayın. Davet 24 saat geçerlidir.",
      ketty:"Ketty'nin cihazını ekle",kendi:'Kendi başka cihazımı ekle',
      githubYok:'Cihaz eklemek için önce yukarıdaki GitHub eşitlemesini bağlayın.',hazirlaniyor:'Hazırlanıyor…'},
    davet:{
      baslikKetty:"Ketty'nin cihazını ekle",baslikKendi:'Başka cihazınızı ekle',
      adimlarKetty:["Ketty telefonunun kamerasıyla QR'ı okutsun.","Ekrandaki kodu ona söyleyin.","Ketty kendi parolasını belirlesin — siz bilmeyeceksiniz."],
      adimlarKendi:["Diğer cihazınızın kamerasıyla QR'ı okutun.","Açılan sayfada ekrandaki kodu yazın.","Kendi parolanızı girin."],
      kodEtiket:'Davet kodu',
      kodNotu:"Bu kod QR'ın içinde değildir; QR'ı gönderdiğiniz yoldan ayrı bir yolla (yüz yüze ya da telefonla) iletin.",
      kopyala:'Bağlantıyı kopyala',kopyalandi:'Bağlantı kopyalandı',kopyalanamadi:'Kopyalanamadı — bağlantıyı metin kutusundan seçip kopyalayın',
      qrYok:'QR çizilemedi — bağlantıyı kopyalayıp telefona gönderin.',
      yerel:"Bu adres yalnız bu bilgisayarda çalışır; QR'ı panel yayınlandıktan sonra (GitHub Pages adresinden) üretin.",
      kapat:'Kapat'},
    kurtarma:{etiket:'Yeni kurtarma kodu üret',
      aciklama:'Kurtarma kodu, parolanızı unutursanız verilerinize ulaşmanızı sağlar. Yeni kod üretmek eskisini geçersiz kılar.',
      onayBaslik:'Yeni kurtarma kodu',onayMesaj:'Eski kurtarma kodunuz artık çalışmaz. Devam edilsin mi?',onayEvet:'Evet, yeni kod üret',
      bekleme:'Hazırlanıyor…'},
    parola:{baslik:'Parolanız',
      aciklamaSena:"Bu yalnız sizin parolanız; Ketty'nin parolasını değiştirmez. Diğer cihazlarınız eşitlendikten sonra yeni parolayı ister.",
      aciklamaKetty:"Bu yalnız sizin parolanız; Sena'nınkini değiştirmez.",
      alan:'Yeni parola',yer:'yeni parola',dugme:'Değiştir'},
    kategori:{gelir:'Gelir kategorileri',gider:'Ofis gider kategorileri',kisisel:'Kişisel harcama kategorileri',yardim:'virgülle ayırın'}
  },
  _kullanici(ctx){return (ctx&&ctx.user)||Store.user},
  /* cihaz ekleme / yeni kurtarma kodu yalnız Sena'nın (sahibin) işi */
  sahipMi(ctx){return this._kullanici(ctx)===Store.SAHIP},

  /* Eşitleme bölümünün açıklaması */
  githubBilgi(){return this.M.githubBilgi},

  /* Cihaz ekleme bloğu: Ketty'de null (görünmez). GitHub bağlı değilse düğmeler pasif + kısa neden.
     → {baslik, aciklama, dugmeler:[{kim:Store.ASISTAN|Store.SAHIP, etiket, bekleme, aktif}], neden:''|metin} | null */
  cihazEkle(ctx){
    if(!this.sahipMi(ctx))return null;
    const bagli=ctx&&ctx.bagli!==undefined?!!ctx.bagli:!!Sync.cfg,M=this.M.cihaz;
    return {baslik:M.baslik,aciklama:M.aciklama,neden:bagli?'':M.githubYok,
      dugmeler:[{kim:Store.ASISTAN,etiket:M.ketty,bekleme:M.hazirlaniyor,aktif:bagli},
        {kim:Store.SAHIP,etiket:M.kendi,bekleme:M.hazirlaniyor,aktif:bagli}]};
  },

  /* «Yarın 14:30'a kadar geçerli» — yerel saat dilimi, gün dönümü takvim gününe göre (bugün · yarın · '15 Ekim').
     Türkçe ek (a/e/ya/ye) son okunan sayıya göre: dakika 00 ise saat, değilse dakika. */
  _ekAE(n){
    const son={1:'e',2:'ye',3:'e',4:'e',5:'e',6:'ya',7:'ye',8:'e',9:'a'},onlar={0:'a',1:'a',2:'ye',3:'a',4:'a',5:'ye'};
    return n%10!==0?son[n%10]:onlar[n/10];
  },
  gecerlilikMetni(son,simdi){
    const s=new Date(son),n=new Date(simdi==null?Date.now():simdi);
    if(isNaN(s.getTime()))return '';
    const gun=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const fark=Math.round((gun(s)-gun(n))/86400000);
    const iki=x=>(x<10?'0':'')+x;
    const sa=iki(s.getHours())+':'+iki(s.getMinutes());
    const ne=fark<=0?'Bugün':fark===1?'Yarın':s.getDate()+' '+AYLAR[s.getMonth()];
    const ek=this._ekAE(s.getMinutes()===0?s.getHours():s.getMinutes());
    return ne+' '+sa+"'"+ek+' kadar geçerli';
  },

  /* Davet penceresi: Islem.davetUret sonucu {kod,url,son} + kimin için → düz veri. Kod 5'li iki grup; QR'a yalnız url girer (kod DEĞİL). */
  davetPenceresi(kim,sonuc,ctx){
    const D=this.M.davet,ketty=kim!==Store.SAHIP;
    const ham=Kasa.kodNormalize(sonuc.kod)||String(sonuc.kod||'').replace(/[\s-]+/g,'');
    const gruplar=ham.match(/.{1,5}/g)||[];
    return {baslik:ketty?D.baslikKetty:D.baslikKendi,
      adimlar:(ketty?D.adimlarKetty:D.adimlarKendi).slice(),
      kodEtiket:D.kodEtiket,gruplar,kod:gruplar.join('-'),kodNotu:D.kodNotu,
      gecerlilik:this.gecerlilikMetni(sonuc.son,ctx&&ctx.simdi),
      url:sonuc.url,
      yerelUyari:ctx&&ctx.yerel?D.yerel:null,
      kopyala:D.kopyala,kopyalandi:D.kopyalandi,kopyalanamadi:D.kopyalanamadi,qrYok:D.qrYok,kapat:D.kapat};
  },

  /* «Yeni kurtarma kodu üret» (yalnız Sena) + onay metinleri → {etiket, aciklama, bekleme, onay:{baslik,mesaj,evet}} | null */
  yeniKurtarma(ctx){
    if(!this.sahipMi(ctx))return null;
    const K=this.M.kurtarma;
    return {etiket:K.etiket,aciklama:K.aciklama,bekleme:K.bekleme,onay:{baslik:K.onayBaslik,mesaj:K.onayMesaj,evet:K.onayEvet}};
  },

  /* Parola bölümü metinleri (her kullanıcı yalnız KENDİ parolasını değiştirir) */
  parolaBolumu(ctx){
    const P=this.M.parola;
    return {baslik:P.baslik,aciklama:this.sahipMi(ctx)?P.aciklamaSena:P.aciklamaKetty,alan:P.alan,yer:P.yer,dugme:P.dugme};
  },

  /* Kategori kutuları: hangi kutu kime görünür + başlangıç değeri. Kişisel kutu yalnız Gizlilik.kisiselGorur(user) olana
     (Ketty'de veri zaten yok; kutuyu boş gösterip Kaydet'te [] yazmak yanlış olurdu). Ekran Kaydet'te YALNIZ bu listedeki anahtarları gönderir.
     → [{key, etiket, yardim, deger}] */
  kategoriAlanlari(ctx){
    const K=this.M.kategori,m=this.kategoriMetinleri(),kisisel=Gizlilik.kisiselGorur(this._kullanici(ctx));
    const l=[{key:'incomeCategories',etiket:K.gelir},{key:'expenseCategories',etiket:K.gider}];
    if(kisisel)l.push({key:'personalCategories',etiket:K.kisisel});
    return l.map(a=>({key:a.key,etiket:a.etiket,yardim:K.yardim,deger:m[a.key]}));
  },

  /* Kategori kutuları: 'a, b' biçiminde */
  kategoriMetinleri(){
    const s=Store.data.settings;
    const m=key=>(s[key]||[]).join(', ');
    return {incomeCategories:m('incomeCategories'),expenseCategories:m('expenseCategories'),personalCategories:m('personalCategories')};
  },

  /* GitHub bölümü: Sync.cfg'den */
  githubForm(ctx){
    const cfg=Sync.cfg||{};
    const k=Sync.tokenKalan((ctx&&ctx.bugun)||todayStr());
    /* erişim anahtarı bitişi: tarih alanı değeri + (varsa) kalan süre metni; ≤3 gün ya da geçmişse 'neg' */
    return {bagli:!!Sync.cfg,owner:cfg.owner||'',repo:cfg.repo||'',token:cfg.token||'',
      tokenBitis:Sync.tokenBitisAyikla(cfg.tokenBitis)||'',
      tokenMetni:k==null?'':'Bitiş: '+fmtD(cfg.tokenBitis)+' — '+Sync.tokenKalanMetni(k),
      tokenSinif:k==null?'':k<=3?'neg':'',
      durumMetni:Sync.cfg?'bağlı':'yerel mod',durumSinif:Sync.cfg?'good':'sand'};
  },

  /* Yedekleme bölümü metni: "Son yedek: 12 Eylül (31 gün önce)" | "Henüz yedek alınmadı"; hatirlat → view uyarı renginde gösterir */
  yedekDurumu(ctx){
    const y=Store.yedekDurumu(ctx&&ctx.bugun);
    const g=y.gunOnce;
    return {hatirlat:y.hatirlat,
      metin:y.sonYedekGunu==null?'Henüz yedek alınmadı'
        :'Son yedek: '+fmtD(y.sonYedekGunu)+' ('+(g<=0?'bugün':g===1?'dün':g+' gün önce')+')'};
  },

  /* ---- dışa aktarım içerikleri: {dosyaAdi, icerik, mime} ---- */
  csvMetni(rows){
    return '\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  },

  /* H-S1 — başlık satırı da sıralamaya girer (aynen korunur) */
  finansCsv(ctx){
    const t=(ctx&&ctx.bugun)||todayStr();
    const rows=[['Tarih','Tür','Kategori','Açıklama','Tutar','Giren']];
    Store.col('payments').forEach(p=>rows.push([p.date,'Gelir',p.amount<0?'Para iadesi':'Seans tahsilatı',Store.clientName(p.clientId),p.amount,p.enteredBy||'']));
    const kisiselVar=Gizlilik.kisiselGorur((ctx&&ctx.user)||Store.user); /* KUL2: Ketty'nin dışa aktardığı dosyada kişisel satır yok */
    Store.col('transactions').filter(x=>kisiselVar||x.type!=='kisisel').forEach(x=>rows.push([x.date,x.type==='gelir'?'Gelir':x.type==='kisisel'?'Kişisel':'Gider',x.category,x.note||'',x.amount,x.enteredBy||'']));
    rows.sort((a,b)=>a[0]<b[0]?1:-1);
    return {dosyaAdi:'sena-finans-'+t+'.csv',icerik:this.csvMetni(rows),mime:'text/csv;charset=utf-8'};
  },

  /* H-S2 */
  danisanCsv(ctx){
    const t=(ctx&&ctx.bugun)||todayStr();
    const rows=[['Danışan','Telefon','Telefon 2','Durum','Toplam seans','Gelmedi','Son seans','Açık bakiye']];
    Store.col('clients').forEach(c=>{const st2=Store.clientStats(c.id);const b=Store.balance(c.id);
      rows.push([c.name,c.phone||'',c.phone2||'',c.status,st2.toplam,st2.noshow,st2.son?st2.son.date:'',b.kalan])});
    return {dosyaAdi:'sena-danisanlar-'+t+'.csv',icerik:this.csvMetni(rows),mime:'text/csv;charset=utf-8'};
  },

  /* H-S3 */
  jsonYedek(ctx){
    const t=(ctx&&ctx.bugun)||todayStr();
    return {dosyaAdi:'sena-yedek-'+t+'.json',icerik:JSON.stringify(Store.data,null,1),mime:'application/json'};
  }
};
/* ==== vm_kilit.js ==== */
/* Kilit ekranı ViewModel'i (D3a) — kilit kartının MODU, hangi alanların görüneceği ve TÜM görünen metinler; DOM'suz, saf.
   Karar kullanıcıya göre BURADA verilir (Sena / Ketty); app.js yalnız bu düz veriyi çizer, olayı Islem'e iletir,
   dönen {ok,hata,alan}'ı hata() ile yerine koyar. Store/LS/Sync'e YAZMAZ.
   Ekranda iç terim geçmez (zarf · sarma · anahtar…): kullanıcılar teknik değil.
   Kapsam: yeni modlar (unuttum · davet-kod · davet-parola) + kurtarma kodu kartı + normal kartın EK parçası
   (Parolamı unuttum bağlantısı / Ketty notu). D3b: normal kartın parola alanı metinleri + elle bağlantı bölümü (yalnız Sena) de burada; app.js yalnız çizer. */
const KilitVM={
  MODLAR:['normal','unuttum','davet-kod','davet-parola'],

  /* ---- ekran metinleri (tek yer) ---- */
  M:{
    unuttumBaglanti:'Parolamı unuttum',
    kettyNotu:"Parolanızı unuttuysanız Sena'dan yeni davet isteyin.",
    geri:'Geri',vazgec:'Vazgeç',
    normal:{parolaEtiket:'Parolanız',yeniParolaYer:'Yeni parola belirleyin',
      parolaAcIpucu:'Bu cihazdaki verileri açar',
      parolaYeniIpucu:'Kayıtlarınız bu parolayla korunur; parolayı yalnız siz bilirsiniz.',
      yeniVeriNotu:'Sonraki adımda bir kurtarma kodu gösterilecek; parolanızı unutursanız yalnız o kodla girebilirsiniz.',
      elleEtiket:'Davet yerine elle mi bağlanacaksınız?',
      elleNot:"Yeni cihazlar normalde Ayarlar'daki davetle eklenir. Elle bağlanacaksanız GitHub bilgilerini girin; sonra kendi parolanızı yazın."},
    yenile:{baslik:'Parolanızı yenileyin',alt:'Kurtarma kodunuzla yeni bir parola belirleyin.',dugme:'Parolayı yenile',bekleme:'Yenileniyor…'},
    kod:{etiket:'Kurtarma kodu',ipucu:'Kurulumda size gösterilen 24 karakterlik kod',yer:'XXXX-XXXX-XXXX-XXXX-XXXX-XXXX'},
    yeniParola:{etiket:'Yeni parola',ipucu:'En az 8 karakter'},
    tekrar:{etiket:'Yeni parola (tekrar)'},
    davetKod:{baslik:'Cihaz ekle',alt:'Size iletilen davet kodunu yazın.',etiket:'Davet kodu',ipucu:'10 karakter; büyük ya da küçük harf fark etmez',yer:'XXXXX-XXXXX',dugme:'Devam',bekleme:'Kontrol ediliyor…'},
    davetKetty:{alt:'Kendi parolanızı belirleyin.',not:"Bu parolayı yalnız siz bilirsiniz; Sena'nın parolasından ayrıdır.",dugme:'Cihazı ekle',bekleme:'Ekleniyor…'},
    davetSena:{alt:'Bu cihazı eklemek için parolanızı yazın.',etiket:'Parolanız',ipucu:'Diğer cihazınızda kullandığınız parola',dugme:'Cihazı ekle',bekleme:'Ekleniyor…'},
    kartBaslik:'Kurtarma kodunuz',
    kartAciklama:'Parolanızı unutursanız verilerinize yalnız bu kodla ulaşabilirsiniz. Kâğıda yazıp güvenli bir yerde saklayın.',
    kartDugme:'Yazdım, devam',kopyala:'Kodu kopyala',kopyalandi:'Kopyalandı',
    bilinmeyenHata:'Bir sorun oluştu — tekrar deneyin'
  },

  sahipMi(kullanici){return kullanici===Store.SAHIP},

  /* alan tanımı: ad (Islem'e giden anahtar) · etiket · ipucu · tur · autocomplete · sinif (CSS) · yer (placeholder) */
  _alan(ad,etiket,ipucu,tur,ac,ek){
    return Object.assign({ad,etiket,ipucu:ipucu||'',tur,autocomplete:ac,yer:''},ek||{});
  },
  _kodAlani(etiket,ipucu,yer){
    return KilitVM._alan('kod',etiket,ipucu,'text','off',{sinif:'gate-kod',yer,autocapitalize:'characters',spellcheck:'false'});
  },

  /* ctx: {mod, kullanici, veriVar, onbellek}  (kullanici: seçili kullanıcı · davetin sahibi; veriVar: bu cihazda önbellek ya da GitHub bağlantısı var; onbellek: bu cihazda kayıtlı veri var)
     → {mod, baslik, alt, alanlar:[…], goster:bool (parola göster/gizle düğmesi), not, birincil:{etiket,bekleme}|null,
        ikincil:{etiket}|null, baglanti:{etiket,hedef}|null, izinli:bool, odak:ilk alan adı|null, kullaniciSecici:bool} */
  durum(ctx){
    const c=ctx||{},mod=KilitVM.MODLAR.includes(c.mod)?c.mod:'normal',sena=KilitVM.sahipMi(c.kullanici),M=KilitVM.M;
    const bos={mod,baslik:'',alt:'',alanlar:[],goster:false,not:null,parola:null,elleBaglanti:null,birincil:null,ikincil:null,baglanti:null,izinli:true,odak:null,kullaniciSecici:false};
    if(mod==='normal'){
      /* normal kartın EK parçası: Sena → küçük bağlantı (yalnız kurtarılacak veri varken) · Ketty → bağlantı yerine kısa not */
      /* D3b: parola alanının metinleri (onbellek: bu cihazda kayıtlı veri var → açma; yoksa yeni parola) ve elle bağlantı bölümü
         (davet yerine; yalnız Sena — Ketty elle bağlansa da anahtarı olmadığından açamaz, yeni cihazı Sena davetle ekler) */
      const onb=c.onbellek===true;
      return Object.assign(bos,{kullaniciSecici:true,
        parola:{etiket:M.normal.parolaEtiket,yer:onb?M.normal.parolaEtiket:M.normal.yeniParolaYer,ipucu:onb?M.normal.parolaAcIpucu:M.normal.parolaYeniIpucu},
        elleBaglanti:sena?{etiket:M.normal.elleEtiket,not:M.normal.elleNot}:null,
        baglanti:sena&&c.veriVar!==false?{etiket:M.unuttumBaglanti,hedef:'unuttum'}:null,
        not:sena?null:M.kettyNotu});
    }
    if(mod==='unuttum'){
      if(!sena)return Object.assign(bos,{baslik:M.yenile.baslik,izinli:false,not:M.kettyNotu,ikincil:{etiket:M.geri}});
      return Object.assign(bos,{baslik:M.yenile.baslik,alt:M.yenile.alt,goster:true,odak:'kod',
        alanlar:[KilitVM._kodAlani(M.kod.etiket,M.kod.ipucu,M.kod.yer),
          KilitVM._alan('parola',M.yeniParola.etiket,M.yeniParola.ipucu,'password','new-password'),
          KilitVM._alan('tekrar',M.tekrar.etiket,'','password','new-password')],
        birincil:{etiket:M.yenile.dugme,bekleme:M.yenile.bekleme},ikincil:{etiket:M.geri}});
    }
    if(mod==='davet-kod'){
      return Object.assign(bos,{baslik:M.davetKod.baslik,alt:M.davetKod.alt,odak:'kod',
        alanlar:[KilitVM._kodAlani(M.davetKod.etiket,M.davetKod.ipucu,M.davetKod.yer)],
        birincil:{etiket:M.davetKod.dugme,bekleme:M.davetKod.bekleme},ikincil:{etiket:M.vazgec}});
    }
    /* davet-parola: davetin sahibine göre */
    const selam='Merhaba '+DashVM._hitap(c.kullanici);
    if(sena){
      return Object.assign(bos,{baslik:selam,alt:M.davetSena.alt,goster:true,odak:'parola',
        alanlar:[KilitVM._alan('parola',M.davetSena.etiket,M.davetSena.ipucu,'password','current-password')],
        birincil:{etiket:M.davetSena.dugme,bekleme:M.davetSena.bekleme},ikincil:{etiket:M.vazgec}});
    }
    return Object.assign(bos,{baslik:selam,alt:M.davetKetty.alt,goster:true,odak:'parola',not:M.davetKetty.not,
      alanlar:[KilitVM._alan('parola',M.yeniParola.etiket,M.yeniParola.ipucu,'password','new-password'),
        KilitVM._alan('tekrar',M.tekrar.etiket,'','password','new-password')],
      birincil:{etiket:M.davetKetty.dugme,bekleme:M.davetKetty.bekleme},ikincil:{etiket:M.vazgec}});
  },

  /* Islem'den dönen {ok:false,hata,alan?} nereye yazılsın? alan bu kartta VARSA o alanın altına, yoksa kart hata satırına.
     Metni UYDURMAZ: modelin hata metni aynen (boşsa genel cümle). → {alan:ad|null, metin} */
  hata(durum,r){
    const metin=(r&&r.hata)?String(r.hata):KilitVM.M.bilinmeyenHata;
    const alan=r&&r.alan&&durum&&durum.alanlar.some(a=>a.ad===r.alan)?r.alan:null;
    return {alan,metin};
  },

  /* Kurtarma kodu kartı: kod ('ABCD-EFGH-…' ya da ham) → 4'lü gruplar. Kod yoksa null (kart açılmaz). */
  kurtarmaKarti(kod){
    if(!kod)return null;
    const n=Kasa.kodNormalize(kod),ham=n||String(kod).replace(/[\s-]+/g,'');
    const gruplar=ham.match(/.{1,4}/g)||[];
    const M=KilitVM.M;
    return {baslik:M.kartBaslik,gruplar,kod:gruplar.join('-'),aciklama:M.kartAciklama,dugme:M.kartDugme,kopyala:M.kopyala,kopyalandi:M.kopyalandi};
  }
};
/* ==== vm_formlar.js ==== */
/* Form pencerelerinin (forms.js) ve danışan seçicinin (UI.clientSelect) hesapları — DOM'suz, durum tutmaz.
   View yalnız bu fonksiyonların verdiğini DOM'a döker. Store'u okur, YAZMAZ (yazmak Islem'in işi).
   Ayarlar (kategoriler, varsayılan ücret) çağrı ANINDA Store.data.settings'ten okunur. */
const FormVM={

  /* Q12: eylem adları TEK sözlük — aynı iş her yerde (düğme, pencere başlığı, hızlı işlem menüsü) aynı adla anılır.
     View'lar adı BURADAN okur; yeni bir ad gerekirse buraya eklenir, view'a gömülmez. */
  ADLAR:{
    tahsilat:'Tahsilat al',
    duzeltme:'Düzeltme (borç / indirim)',
    paketSat:'Paket sat',
    paketTasarla:'Paket tasarla',
    hizliIslem:'Hızlı işlem',
    randevuEkle:'Randevu ekle',
    danisanEkle:'Danışan ekle',
    giderEkle:'Gider ekle',
    kayitEkle:'Gelir / gider ekle',
    gelirEkle:'Gelir ekle',
    gelirAlt:'danışan dışı gelir',
    kisiselHarcama:'Kişisel harcama',
    giderAlt:'ofis / iş gideri',
    kisiselAlt:'market, giyim… iş dışı',
    randevuErtele:'Randevuyu ertele — yeni tarih'
  },

  /* KUL: yeni danışan kaydedilince sorulan «şimdi randevu verilsin mi?» penceresinin metni (düzenlemede sorulmaz — karar view'da) */
  randevuTeklifi(ad){return {baslik:'Danışan eklendi',mesaj:ad+' için şimdi randevu verilsin mi?',dugme:'Randevu ver'}},

  /* KUL2: dolu saate randevu verilirken sorulan onay metni. c = Islem.cakismalar(...) sonucu {toplam,liste:[{tarih,kayit}]}; liste boşsa null.
     Tek randevu: «10:00 saatinde Ayşe Yılmaz zaten var» · tekrarlı: «8 randevudan 2'si dolu saate denk geliyor (…tarihler…)». */
  cakismaOnayi(c){
    if(!c||!c.liste.length)return null;
    const dugme='Yine de kaydet',baslik='Bu saatte randevu var',son=' Yine de kaydedilsin mi?';
    if(c.toplam<=1){
      const k=c.liste[0].kayit;
      return {baslik,mesaj:k.time+' saatinde '+Store.clientName(k.clientId)+' zaten var.'+son,dugme};
    }
    const n=c.liste.length;
    const EKLER={1:'i',2:'si',3:'ü',4:'ü',5:'i',6:'sı',7:'si',8:'i',9:'u'},ONLAR={10:'u',20:'si',30:'u',40:'ı',50:'si'};
    const ik=n%10?EKLER[n%10]:ONLAR[n]; /* ≤52: «1'i · 2'si · 3'ü · 6'sı · 10'u · 20'si» */
    const goster=c.liste.slice(0,5).map(x=>fmtD(x.tarih)).join(', ')+(n>5?' ve '+(n-5)+' tarih daha':'');
    return {baslik,mesaj:c.toplam+" randevudan "+n+"'"+ik+' dolu saate denk geliyor ('+goster+').'+son,dugme};
  },

  /* KUL2: randevu durum seçicisinin seçenekleri. «Revize» elle seçilmez (Ertele akışı yazar); yalnız kayıt ZATEN revize ise
     o kayıtta görünür kalır (eski kayıt bozulmasın). mevcutDurum: kaydın şimdiki durumu (yeni kayıtta undefined). */
  durumSecenekleri(mevcutDurum,kisa){
    const l=[['planlandi','Planlandı'],['geldi',kisa?'Geldi':'Geldi ✓'],['gelmedi','Gelmedi'],['iptal','İptal']];
    if(mevcutDurum==='revize')l.push(['revize','Revize']);
    return l;
  },

  /* KUL2: gelir/gider formunun Tür seçenekleri · tekrarlayan ödeme formunun Tür seçenekleri — «Kişisel» yalnız Gizlilik izin verirse (kullanıcı adı burada karşılaştırılmaz) */
  islemTurleri(user){
    const l=[['gider','Ofis gideri'],['gelir','Gelir']];
    if(Gizlilik.kisiselGorur(user||Store.user))l.push(['kisisel','Kişisel']);
    return l;
  },
  tekrarTurleri(user){
    const l=[['gider','Ofis gideri']];
    if(Gizlilik.kisiselGorur(user||Store.user))l.push(['kisisel','Kişisel']);
    return l;
  },

  /* KUL2: Hızlı işlem menüsünün satırları — SIRALI ADLAR anahtarları (hangi satır var + sıra VM'de; view yalnız anahtar → ikon/ton/eylem/alt yazı bağlar).
     «Kişisel harcama» yalnız Gizlilik izin verirse. user verilmezse Store.user. */
  hizliIslemler(user){
    const l=['randevuEkle','tahsilat','giderEkle'];
    if(Gizlilik.kisiselGorur(user||Store.user))l.push('kisiselHarcama');
    l.push('gelirEkle','paketSat','danisanEkle');
    return l;
  },

  /* gelir/gider formu başlığı türe göre */
  islemBasligi(tur){return tur==='gelir'?FormVM.ADLAR.gelirEkle:tur==='kisisel'?FormVM.ADLAR.kisiselHarcama:FormVM.ADLAR.giderEkle},

  /* H-F1: tüm danışan açılır listeleri — ad'a göre Türkçe sıralı, ilk seçenek boş "seçin" */
  danisanSecenekleri(){
    const liste=Store.col('clients').slice().sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    return [{deger:'',metin:'— Danışan seçin —'},...liste.map(c=>({deger:c.id,metin:c.name}))];
  },

  /* H-F2: randevu formunda ücret alanının yer tutucusu. Danışan bulunamazsa null (yer tutucuya dokunulmaz).
     Danışanın ücreti yoksa (0/boş) varsayılan seans ücreti. */
  ucretYerTutucu(clientId){
    const c=Store.find('clients',clientId);
    if(!c)return null;
    return String(c.fee||Store.data.settings.defaultFee);
  },

  /* H-F5: randevu işlem penceresindeki bakiye kutusu. Danışan yoksa null (kutu çizilmez).
     sinif: 'warn' (kalan>0) | 'good' (kapalı ya da avans) */
  bakiyeOzeti(clientId){
    const c=Store.find('clients',clientId);
    if(!c)return null;
    const b=Store.balance(c.id);
    return {
      sinif:b.kalan>0?'warn':'good',
      baslik:b.kalan>0?'Açık bakiye: '+money(b.kalan):'Hesap kapalı ✓',
      alt:'Toplam '+money(b.borc)+' işlendi · '+money(b.oden)+' ödendi'
    };
  },

  /* H-F7: tahsilat formundaki bakiye satırı. Danışan seçili değilse metin boş.
     tutar: yalnız kalan>0 iken view'ın tutar alanına GERÇEK DEĞER olarak yazacağı sayı (string); yoksa null. */
  tahsilatBakiyesi(clientId){
    if(!clientId)return {metin:'',tutar:null};
    const b=Store.balance(clientId);
    if(b.kalan>0)return {metin:'Açık bakiye: '+money(b.kalan),tutar:String(b.kalan)};
    return {metin:'Bakiye kapalı — bu giriş avans olur',tutar:null};
  },

  /* para iadesi (Sena 10-27): tahsilat formunda «Para iadesi» seçiliyken bakiye satırı + önerilen tutar.
     Avans (kalan<0) varsa tutar = avans; yoksa tutar null ve uyarı (iade bakiyeyi borca çevirir). */
  iadeBakiyesi(clientId){
    if(!clientId)return {metin:'',tutar:null};
    const b=Store.balance(clientId);
    if(b.kalan<0)return {metin:'Danışanın avansı: '+money(-b.kalan)+' — iade edilecek tutar',tutar:String(-b.kalan)};
    return {metin:'Bu danışanın avansı yok — iade bakiyeyi borca çevirir',tutar:null};
  },

  /* K3.2: danışan seçilince/değişince tahsilat tutar alanının alacağı değer.
     elleGirildi (kullanıcı tutarı kendi yazdı) → mevcut değer AYNEN korunur; değilse danışanın kalan bakiyesi
     (kapalı/avans/seçili değil → boş). tur 'iade' → önerilen tutar danışanın avansı (iadeBakiyesi). */
  tahsilatTutari(clientId,elleGirildi,mevcut,tur){
    if(elleGirildi)return mevcut;
    const t=(tur==='iade'?FormVM.iadeBakiyesi(clientId):FormVM.tahsilatBakiyesi(clientId)).tutar;
    return t===null?'':t;
  },

  /* K3.3: düzeltme formu — seçici ('borc' | 'indirim') + POZİTİF tutar → Islem.duzeltmeKaydet'e gidecek işaretli sayı.
     borç ekle = +tutar · indirim (borç düş) = −tutar. Tutar ≤0, boş ya da sayı değilse null (Islem bunu hata sayar). */
  duzeltmeTutari(tur,tutar){
    const n=Number(tutar);
    if(tutar===''||tutar==null||!Number.isFinite(n)||n<=0)return null;
    return tur==='indirim'?-n:n;
  },

  /* H-F8: gelir/gider formunun kategori listesi — tür: 'gelir' → gelir, 'kisisel' → kişisel, diğer her şey → ofis gideri */
  kategoriSecenekleri(tur){
    const s=Store.data.settings;
    return tur==='gelir'?s.incomeCategories:tur==='kisisel'?(s.personalCategories||[]):s.expenseCategories; /* D2b: Ketty'de personalCategories hiç yok */
  },

  /* H-F9: tekrarlayan ödeme formunun kategori listesi = ofis giderleri + kişisel */
  tekrarlayanKategorileri(){
    const s=Store.data.settings;
    return s.expenseCategories.concat(s.personalCategories||[]); /* D2b: concat(undefined) listeye «undefined» eklerdi */
  },

  /* H-F10: paket tasarlama canlı önizlemesi. seans/fiyat input'un HAM değerleri (string olabilir). */
  paketOnizleme(seans,fiyat){
    const s=Number(seans)||0,f=Number(fiyat)||0;
    const normal=(Store.data.settings.defaultFee||0)*s;
    if(s>0&&f>0)return {
      baslik:'Seans başına '+money(Math.round(f/s)),
      alt:normal>f?('Normal fiyata göre '+money(normal-f)+' avantaj (%'+Math.round((1-f/normal)*100)+') — danışana böyle önerin'):'Varsayılan ücretle kıyas: '+money(normal)
    };
    return {baslik:'Seans sayısı ve fiyat girin',alt:'seans başı fiyat ve avantaj burada hesaplanır'};
  },

  /* H-F11: paket satışında hazır paket seçilince alanlara kopyalanacak değerler; paket yoksa null */
  paketSablonu(packageId){
    const t=Store.find('packages',packageId);
    return t?{sessions:t.sessions,price:t.price}:null;
  }
};

/* SVG grafikler — ince işaretler, hairline ızgara, hover katmanı, tablo eşi */
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,...kids){const el=document.createElementNS(SVGNS,tag);
  if(attrs)for(const k in attrs)el.setAttribute(k,attrs[k]);
  kids.forEach(k=>{if(k!=null)el.appendChild(k)});return el}
function svText(tag,attrs,text){const el=sv(tag,attrs);el.textContent=text;return el}

function niceTicks(max){
  if(max<=0)return[0,1];
  if(max<=4){const o=[];for(let v=0;v<=Math.ceil(max);v++)o.push(v);return o}
  const raw=max/3;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||mag*10;
  const out=[];for(let v=0;v<=max*1.001+step*0.999;v+=step){out.push(v);if(v>=max)break}
  return out;
}
function shortNum(n){
  if(Math.abs(n)>=1e6)return (n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' M';
  if(Math.abs(n)>=1e3)return (n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:0})+' bin'; /* K3a: «100 B» belirsizdi */
  return String(Math.round(n));
}

/* K3a/K3.10: SVG yazısı küçülmesin. viewBox'ı sabit 640 birim tutup %100 genişliğe sığdırmak 375 px telefonda 11 px yazıyı ~5 px'e
   indiriyordu. Çözüm: viewBox genişliği = gerçek görüntü genişliği (1 birim = 1 px → yazı 11 px kalır); genişlik değişince yeniden çizilir.
   ciz(W) kendi svg'sini holder'a koyar. ResizeObserver yoksa (eski tarayıcı/test) varsayılan genişlikte kalır. */
const GRAFIK_MIN_W=260,GRAFIK_MAX_W=800;
function genislikIzle(wrap,ciz,varsayilan){
  let w=0;
  const kur=g=>{g=Math.max(GRAFIK_MIN_W,Math.min(GRAFIK_MAX_W,Math.round(g)));if(g===w)return;w=g;ciz(g)};
  kur(varsayilan);
  if(typeof ResizeObserver==='function'){
    const ro=new ResizeObserver(es=>{
      if(!wrap.isConnected){ro.disconnect();return}
      const g=es[es.length-1].contentRect.width;if(g>0)kur(g);
    });
    ro.observe(wrap);
  }
}

/* ortak ipucu (tooltip) */
function makeTip(container){
  const tip=h('div.viz-tip');container.appendChild(tip);
  return{
    show(x,y,title,rows){
      tip.innerHTML='';
      const t=h('div.t');t.textContent=title;tip.appendChild(t);
      for(const r of rows){
        const row=h('div.r');
        const k=h('i.k');k.style.background=r.color;row.appendChild(k);
        const lab=h('span');lab.textContent=r.label;lab.style.color='#c9c4bb';lab.style.fontSize='11.5px';row.appendChild(lab);
        const v=h('span.v');v.textContent=r.value;row.appendChild(v);
        tip.appendChild(row);
      }
      tip.style.opacity=1;
      const cw=container.clientWidth,tw=tip.offsetWidth;
      let lx=x+14;if(lx+tw>cw-4)lx=x-tw-14;if(lx<4)lx=4;
      tip.style.left=lx+'px';tip.style.top=Math.max(2,y-tip.offsetHeight-8)+'px';
    },
    hide(){tip.style.opacity=0}
  };
}

/* mini eğri (stat kutuları) */
function sparkline(values,color,w,h_){
  w=w||110;h_=h_||28;
  const max=Math.max(...values,1),min=Math.min(...values,0);
  const rng=(max-min)||1;
  const pts=values.map((v,i)=>[(i/(values.length-1||1))*(w-6)+3,h_-3-((v-min)/rng)*(h_-6)]);
  const dLine=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dArea=dLine+' L'+pts[pts.length-1][0].toFixed(1)+' '+(h_-1)+' L'+pts[0][0].toFixed(1)+' '+(h_-1)+' Z';
  const svg=sv('svg',{viewBox:'0 0 '+w+' '+h_,width:w,height:h_,'aria-hidden':'true'});
  svg.appendChild(sv('path',{d:dArea,fill:color,opacity:.12}));
  svg.appendChild(sv('path',{d:dLine,fill:'none',stroke:color,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
  const last=pts[pts.length-1];
  svg.appendChild(sv('circle',{cx:last[0],cy:last[1],r:3.2,fill:color,stroke:'var(--card)','stroke-width':2}));
  return svg;
}

/* Sütun grafiği — 1-3 seri, gruplu; hover ipucu + seçici uç etiketi + tablo eşi */
function columnChart(opts){
  const{labels,series,fmt=money,height=230,tableTitle}=opts;
  const wrap=h('div.viz');
  const holder=h('div');wrap.appendChild(holder);
  const tip=makeTip(wrap);
  const Hh=height,padR=8,padT=14,padB=26,ns=series.length;
  const plotH=Hh-padT-padB;
  const maxV=Math.max(1,...series.flatMap(s=>s.values));
  const ticks=niceTicks(maxV);const top=ticks[ticks.length-1];
  const padL=Math.max(34,Math.ceil(Math.max(...ticks.map(tv=>shortNum(tv).length))*6.4)+12); /* eksen yazısı sığsın («100 bin») */
  const ad=series.map(sr=>sr.name).join(', ');
  const ciz=W=>{
  const plotW=W-padL-padR;
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':'Grafik: '+ad+(labels.length?' — '+labels[0]+' ile '+labels[labels.length-1]+' arası (ayrıntı için "tablo görünümü")':'')});
  const y=v=>padT+plotH-(v/top)*plotH;
  for(const tv of ticks){
    svg.appendChild(sv('line',{x1:padL,x2:W-padR,y1:y(tv),y2:y(tv),class:tv===0?'base-l':'grid-l'}));
    svg.appendChild(svText('text',{x:padL-6,y:y(tv)+3.5,'text-anchor':'end',class:'axis'},shortNum(tv)));
  }
  const n=labels.length;
  const band=plotW/n;
  const barW=Math.min(24,Math.max(6,(band*0.62)/ns-2));
  const groupW=barW*ns+2*(ns-1);
  let maxIdx=0,maxVal=-1;
  labels.forEach((lb,i)=>{
    const tot=series.reduce((s,sr)=>s+(sr.values[i]||0),0);
    if(tot>maxVal){maxVal=tot;maxIdx=i}
  });
  labels.forEach((lb,i)=>{
    const gx=padL+band*i+(band-groupW)/2;
    /* görünmez vuruş alanı — işaretten büyük */
    const hit=sv('rect',{x:padL+band*i,y:padT,width:band,height:plotH,fill:'transparent'});
    series.forEach((sr,si)=>{
      const v=sr.values[i]||0;
      const bh=Math.max(v>0?2:0,(v/top)*plotH);
      const bx=gx+si*(barW+2);
      const r=Math.min(4,barW/2);
      const by=padT+plotH-bh;
      if(bh>0){
        const d='M'+bx+' '+(padT+plotH)+' L'+bx+' '+(by+r)+' Q'+bx+' '+by+' '+(bx+r)+' '+by+
          ' L'+(bx+barW-r)+' '+by+' Q'+(bx+barW)+' '+by+' '+(bx+barW)+' '+(by+r)+' L'+(bx+barW)+' '+(padT+plotH)+' Z';
        svg.appendChild(sv('path',{d,fill:sr.color}));
      }
    });
    /* seçici uç etiketi: yalnızca en yüksek ay */
    if(i===maxIdx&&ns===1&&maxVal>0){
      const dl=fmt(series[0].values[i],true),yarim=dl.length*3.4+2; /* uç etiketi kenara taşmasın */
      const dx=Math.min(W-padR-yarim,Math.max(padL+yarim,padL+band*i+band/2));
      svg.appendChild(svText('text',{x:dx,y:y(series[0].values[i])-5,'text-anchor':'middle',class:'dlabel'},dl));
    }
    svg.appendChild(svText('text',{x:padL+band*i+band/2,y:Hh-8,'text-anchor':'middle',class:'axis'},lb));
    const enter=ev=>{
      const rect=wrap.getBoundingClientRect();
      const px=(padL+band*i+band/2)/W*rect.width;
      tip.show(px,padT/Hh*rect.height,opts.tipTitle?opts.tipTitle(i):lb,
        series.map(sr=>({color:sr.color,label:sr.name,value:fmt(sr.values[i]||0)})));
    };
    hit.addEventListener('pointermove',enter);
    hit.addEventListener('pointerleave',()=>tip.hide());
    svg.appendChild(hit);
  });
  holder.innerHTML='';holder.appendChild(svg);
  };
  genislikIzle(wrap,ciz,640);
  /* açıklama (≥2 seri) + tablo eşi */
  const foot=h('div.flex');
  if(ns>=2){
    const lg=h('div.legend');
    series.forEach(sr=>{const s=h('span');const i2=h('i');i2.style.background=sr.color;s.appendChild(i2);s.appendChild(document.createTextNode(sr.name));lg.appendChild(s)});
    foot.appendChild(lg);
  }
  const tbtn=h('button.tbl-toggle',{type:'button','aria-expanded':'false'},'tablo görünümü');
  foot.appendChild(tbtn);
  wrap.appendChild(foot);
  const tbl=h('table.viz-table.hide');
  const thr=h('tr');thr.appendChild(h('th',{},tableTitle||''));
  series.forEach(sr=>{const th=h('th.num');th.textContent=sr.name;th.style.textAlign='right';thr.appendChild(th)});
  tbl.appendChild(thr);
  labels.forEach((lb,i)=>{
    const tr=h('tr');const td=h('td');td.textContent=(opts.tipTitle?opts.tipTitle(i):lb);tr.appendChild(td);
    series.forEach(sr=>{const td2=h('td.num');td2.textContent=fmt(sr.values[i]||0);tr.appendChild(td2)});
    tbl.appendChild(tr);
  });
  wrap.appendChild(tbl);
  tbtn.addEventListener('click',()=>{tbl.classList.toggle('hide');
    const acik=!tbl.classList.contains('hide');
    tbtn.setAttribute('aria-expanded',acik?'true':'false');
    tbtn.textContent=acik?'grafiği göster':'tablo görünümü'});
  return wrap;
}

/* Yatay çubuklar — kategori kırılımı (tek seri: tek renk) */
function hbars(items,color,fmt){
  fmt=fmt||money;
  const wrap=h('div');
  const max=Math.max(1,...items.map(x=>x.value));
  items.forEach(it=>{
    const row=h('div',{style:'margin-bottom:9px'});
    const top=h('div.flex',{style:'font-size:12.5px;margin-bottom:3px'});
    const lab=h('span',{style:'font-weight:600;color:var(--ink-2)'});lab.textContent=it.label;
    const val=h('span.money',{style:'margin-left:auto;font-weight:650'});val.textContent=fmt(it.value);
    top.appendChild(lab);top.appendChild(val);
    const track=h('div',{style:'height:8px;border-radius:5px;background:var(--bg-2);overflow:hidden'});
    const fill=h('i',{style:'display:block;height:100%;border-radius:5px;width:'+((it.value/max)*100).toFixed(1)+'%;background:'+(it.color||color)});
    track.appendChild(fill);
    row.appendChild(top);row.appendChild(track);
    wrap.appendChild(row);
  });
  return wrap;

/* Doluluk ısı haritası — gün × saat, sıralı mavi rampa */
function heatmap(matrix,days,hours,maxCount){
  const wrap=h('div.viz');
  const holder=h('div');wrap.appendChild(holder);
  const tip=makeTip(wrap);
  const ch=26,padL=36,padT=20;
  const Hh=padT+days.length*ch+6;
  const ciz=W=>{
  const cw=(W-padL-6)/hours.length; /* sütun genişliği gerçek genişliğe uyar (yazı 11 px kalır) */
  const svg=sv('svg',{viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':'Isı haritası: gün ve saate göre randevu yoğunluğu'});
  const ramp=['#f3ede2','var(--seq2)','var(--seq3)','var(--seq4)','var(--seq5)','var(--seq6)','var(--seq7)'];
  const colorFor=v=>{if(v<=0)return ramp[0];const t=Math.min(1,v/Math.max(1,maxCount));return ramp[1+Math.min(5,Math.floor(t*5.999))]};
  svg.appendChild(svText('text',{x:padL-6,y:12,'text-anchor':'end',class:'axis'},'Saat')); /* K3a: sütun başlıkları saat — eksen etiketi */
  hours.forEach((hr,j)=>svg.appendChild(svText('text',{x:padL+j*cw+cw/2,y:12,'text-anchor':'middle',class:'axis'},hr)));
  days.forEach((dy,i)=>{
    svg.appendChild(svText('text',{x:padL-6,y:padT+i*ch+ch/2+3.5,'text-anchor':'end',class:'axis'},dy));
    hours.forEach((hr,j)=>{
      const v=matrix[i][j]||0;
      const rect=sv('rect',{x:padL+j*cw+1,y:padT+i*ch+1,width:cw-2,height:ch-2,rx:5,fill:colorFor(v),class:'heat-cell'});
      rect.addEventListener('pointermove',()=>{
        const r=wrap.getBoundingClientRect();
        tip.show((padL+j*cw+cw/2)/W*r.width,(padT+i*ch)/Hh*r.height,dy+' '+hr+':00',
          [{color:'var(--seq5)',label:'seans',value:num(v)}]);
      });
      rect.addEventListener('pointerleave',()=>tip.hide());
      svg.appendChild(rect);
    });
  });
  holder.innerHTML='';holder.appendChild(svg);
  };
  genislikIzle(wrap,ciz,516);
  return wrap;
}


/* ============ E4: «Para nereye gitti?» akış diyagramları ============
   Veri FinansVM.akis(...) çıktısıdır (hesap orada; burada yalnız çizim). İki ayrı çizim, aynı veri:
   · akisSankey — masaüstü (≥901 px): 4 sütunlu sade Sankey (ince koyu düğüm çubukları, soluk akışlar, BÜYÜK HARF etiket + iri tutar)
   · akisMini   — telefon: dikey mini akış (üstte Gelir şeridi → aşağı Ofis · Kişisel · Kalan kolları)
   İkisi de genislikIzle ile gerçek genişliğe çizilir (1 birim = 1 px → yazı boyu küçülmez, K3a). */
const akisBuyuk=s=>String(s).toLocaleUpperCase('tr-TR');
const akisKisalt=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
/* iki dikey kenarı olan eğri şerit: (x1,y1,kalınlık k1) → (x2,y2,k2) */
function akisSerit(x1,y1,k1,x2,y2,k2,xm){
  xm=xm==null?(x1+x2)/2:xm;
  return 'M'+x1+' '+y1+' C'+xm+' '+y1+' '+xm+' '+y2+' '+x2+' '+y2+' L'+x2+' '+(y2+k2)+
    ' C'+xm+' '+(y2+k2)+' '+xm+' '+(y1+k1)+' '+x1+' '+(y1+k1)+' Z';
}
/* dikey akış şeridi: üst kenar (x1,y1,genişlik k1) → alt kenar (x2,y2,genişlik k2); kontrol noktaları dikey */
function akisSeritD(x1,y1,k1,x2,y2,k2){
  const ym=(y1+y2)/2;
  return 'M'+x1+' '+y1+' C'+x1+' '+ym+' '+x2+' '+ym+' '+x2+' '+y2+' L'+(x2+k2)+' '+y2+
    ' C'+(x2+k2)+' '+ym+' '+(x1+k1)+' '+ym+' '+(x1+k1)+' '+y1+' Z';
}
/* iki satırlı etiket: üstte küçük BÜYÜK HARF ad, altında iri tutar (+ küçük yüzde) */
function akisEtiket(svg,x,cy,anchor,ad,tutar,yuz,sinif){
  svg.appendChild(svText('text',{x,y:cy-(sinif?10:4),'text-anchor':anchor,class:'akis-et'},akisBuyuk(ad)));
  const t=svText('text',{x,y:cy+(sinif?16:13),'text-anchor':anchor,class:'akis-tu'+(sinif?' '+sinif:'')},tutar);
  if(yuz!=null)t.appendChild(svText('tspan',{dx:6,class:'akis-yz'},'%'+yuz));
  svg.appendChild(t);
}

function akisSankey(a){
  const wrap=h('div.viz.akis-sankey');
  const holder=h('div');wrap.appendChild(holder);
  const tip=makeTip(wrap);
  const SLOT=34,ARA=6,BAR=10,ASGARI=3,UST=12;
  const slotAlt=n=>n.kol==='kalan'&&n.sutun===2?54:SLOT;      /* KALAN iri yazılır: daha yüksek yuva */
  const sutunlar=[0,1,2,3].map(c=>a.dugumler.filter(n=>n.sutun===c));
  const enCok=Math.max(1,...sutunlar.map(s=>s.length));
  const Hh=Math.max(400,enCok*(SLOT+ARA)+2*UST+24);
  const iyi=Hh-2*UST;
  const yuva=(n,olcek)=>Math.max(Math.max(ASGARI,n.tutar*olcek),slotAlt(n));
  const sutunYuk=(olcek,s)=>s.reduce((t,n)=>t+yuva(n,olcek),0)+Math.max(0,s.length-1)*ARA;
  /* ölçek: bütün sütunların sığdığı en büyük değer (ikili arama) */
  let lo=0,hi=iyi/Math.max(1,a.taban);
  for(let i=0;i<40;i++){const m=(lo+hi)/2;if(sutunlar.every(s=>sutunYuk(m,s)<=iyi))lo=m;else hi=m}
  const olcek=lo;
  const ciz=W=>{
    const dar=W<760;                                          /* dar masaüstünde kısa adlar + dar kenar boşlukları */
    const padL=dar?112:150,padR=dar?128:176;
    const solX=padL,sagX=W-padR-BAR;
    const adim=(sagX-solX)/3;
    const xs=[0,1,2,3].map(c=>Math.round(solX+adim*c));
    const yer={};
    sutunlar.forEach((s,c)=>{
      let y=(Hh-sutunYuk(olcek,s))/2;
      s.forEach(n=>{
        const yk=Math.max(ASGARI,n.tutar*olcek),slot=yuva(n,olcek);
        yer[n.id]={n,x:xs[c],h:yk,y:y+(slot-yk)/2,cy:y+slot/2};
        y+=slot+ARA;
      });
    });
    /* bağlar: her düğümde çıkanlar hedefin, girenler kaynağın yüksekliğine göre dizilir (çizgiler çaprazlaşmasın) */
    const liste=a.baglar.map(b=>({b,s:yer[b.kaynak],t:yer[b.hedef]}));
    const cikan={},giren={};
    liste.forEach(l=>{(cikan[l.b.kaynak]=cikan[l.b.kaynak]||[]).push(l);(giren[l.b.hedef]=giren[l.b.hedef]||[]).push(l)});
    for(const id in cikan){let o=0;cikan[id].sort((p,q)=>p.t.cy-q.t.cy).forEach(l=>{l.k1=l.s.h*l.b.tutar/l.s.n.tutar;l.y1=l.s.y+o;o+=l.k1})}
    for(const id in giren){let o=0;giren[id].sort((p,q)=>p.s.cy-q.s.cy).forEach(l=>{l.k2=l.t.h*l.b.tutar/l.t.n.tutar;l.y2=l.t.y+o;o+=l.k2})}
    const svg=sv('svg',{viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':a.baslikCumlesi});

      const ac=ev=>goster(ev,n.ad,[{color:n.renk,label:'Tutar',value:n.tutarMetni},{color:n.renk,label:'Payı',value:'%'+n.yuz}]);
      cubuk.addEventListener('pointermove',ac);cubuk.addEventListener('pointerdown',ac);
      cubuk.addEventListener('pointerleave',()=>tip.hide());
      svg.appendChild(cubuk);
    });
    a.dugumler.forEach(n=>{
      const p=yer[n.id];
      const ad=dar?n.kisa:n.ad;
      if(n.sutun===0)akisEtiket(svg,p.x-8,p.cy,'end',akisKisalt(ad,dar?12:22),n.tutarMetni,n.yuz);
      else if(n.sutun===1)akisEtiket(svg,p.x+BAR+10,p.cy,'start',ad,n.tutarMetni,null,dar?null:'buyuk');
      else if(n.sutun===2)akisEtiket(svg,p.x+BAR+10,p.cy,'start',n.kisa+' · %'+n.yuz,n.tutarMetni,null,n.kol==='kalan'?'kalan':null); /* orta sütun: kısa ad + yüzde üst satırda (sağdaki sütunun çubuğuna taşmasın); tam ad ipucunda */
      else akisEtiket(svg,p.x+BAR+10,p.cy,'start',akisKisalt(ad,dar?14:22),n.tutarMetni,n.yuz);
    });
    holder.innerHTML='';holder.appendChild(svg);
  };
  genislikIzle(wrap,ciz,820);
  return wrap;
}

function akisMini(a){
  const wrap=h('div.viz.akis-mini');
  const holder=h('div');wrap.appendChild(holder);
  const kollar=[
    {ad:'Ofis',tutar:a.ofis.toplam,yuz:a.yuzdeler.ofis,renk:'var(--s2)'},
    {ad:'Kişisel',tutar:a.kisisel.toplam,yuz:a.yuzdeler.kisisel,renk:'var(--s4)'}
  ];
  if(a.birikimden<=0)kollar.push({ad:'Kalan',tutar:a.kalan,yuz:a.yuzdeler.kalan,renk:'var(--brand)',kalan:true});
  const BH=62,AKIS=62,CUBUK=8,ARA=8;
  const aciklama=a.birikimden>0;
  const ciz=W=>{
    const solUst=aciklama?BH+26:BH;                           /* birikim notu için yer */
    const yb=solUst+AKIS,Hh=yb+CUBUK+70;
    const svg=sv('svg',{viewBox:'0 0 '+W+' '+Hh,role:'img','aria-label':a.baslikCumlesi});
    /* Gelir şeridi (aşımda sağ kısmı birikimden) */
    const gelirW=a.taban>0?W*a.toplamGelir/a.taban:W;
    if(aciklama)svg.appendChild(sv('rect',{x:0,y:0,width:W,height:BH,rx:12,fill:'var(--bg-2)',stroke:'var(--field-line)','stroke-dasharray':'4 3'}));
    svg.appendChild(sv('rect',{x:0,y:0,width:Math.max(24,gelirW),height:BH,rx:12,fill:'var(--brand-soft-2)'}));
    svg.appendChild(svText('text',{x:14,y:22,class:'akis-et'},'GELİR'));
    svg.appendChild(svText('text',{x:14,y:49,class:'akis-tu buyuk'},money(a.toplamGelir,true)));
    if(aciklama){
      svg.appendChild(sv('rect',{x:0,y:BH+10,width:10,height:10,rx:3,fill:'var(--bg-2)',stroke:'var(--field-line)'}));
      svg.appendChild(svText('text',{x:18,y:BH+19,class:'akis-yz'},'Birikimden karşılanan: '+money(a.birikimden,true)));
    }
    /* kollar: üstte tutarla orantılı dilimler, altta eşit yuvalara açılan şeritler */
    const n=kollar.length,yuvaW=(W-ARA*(n-1))/n;
    let ust=0;
    kollar.forEach((k,i)=>{
      const kw=a.taban>0?W*k.tutar/a.taban:0;
      const bw=k.tutar>0?Math.max(6,Math.min(yuvaW,yuvaW*(a.taban>0?k.tutar/a.taban:0))):0;
      const bx=i*(yuvaW+ARA)+(yuvaW-bw)/2;
      if(k.tutar>0){
        svg.appendChild(sv('path',{d:akisSeritD(ust,solUst,kw,bx,yb,bw),fill:k.renk,'fill-opacity':k.kalan?.5:.32}));
        svg.appendChild(sv('rect',{x:bx,y:yb,width:bw,height:CUBUK,rx:3,fill:k.renk}));
      }else svg.appendChild(sv('rect',{x:i*(yuvaW+ARA)+yuvaW/2-3,y:yb,width:6,height:CUBUK,rx:3,fill:'var(--line-2)'}));
      ust+=kw;
      const cx=i*(yuvaW+ARA)+yuvaW/2;
      svg.appendChild(svText('text',{x:cx,y:yb+CUBUK+17,'text-anchor':'middle',class:'akis-et'},akisBuyuk(k.ad)));
      svg.appendChild(svText('text',{x:cx,y:yb+CUBUK+40,'text-anchor':'middle',class:'akis-tu'+(k.kalan?' kalan':' orta')},money(k.tutar,true)));
      svg.appendChild(svText('text',{x:cx,y:yb+CUBUK+58,'text-anchor':'middle',class:'akis-yz'},'%'+k.yuz));
    });
    holder.innerHTML='';holder.appendChild(svg);
  };
  genislikIzle(wrap,ciz,340);
  return wrap;
}

/* UI iskeleti — gezinme, modal, bildirim, hızlı ekleme, ortak formlar */
const UI={
  view:'dash',
  views:{},
  register(id,fn){this.views[id]=fn},
  go(view,param,geriden){
    const ayni=(view===this.view&&param===this.param);
    this.view=view;this.param=param;this.girisNo++;this.taslakDusur();
    if(!geriden&&!ayni)this.ekranKaydi(view,param); /* Q4: yeni ekran = bir geçmiş kaydı; geri tuşundan gelen go() yeniden push ETMEZ */
    this.render();
  },

  /* ---- geri tuşu / geçmiş (Q4) ----
     Her açık pencere ve her yeni ekran bir history kaydı açar; tarayıcı/telefon geri tuşu önce en üstteki pencereyi,
     pencere yoksa önceki ekranı getirir. Pencere X/Esc/Vazgeç ile kapanınca açtığı kayıt history.go(-n) ile geri alınır
     (aynı tur içindeki kapanışlar TEK go'da toplanır) ve bunun doğuracağı popstate YUTULUR (yutulacakGeri). */
  acik:[],                   /* açık pencereler: {bg,m,kirli(),kapat(geriden),kayitli} — son eleman en üstteki */
  yutulacakGeri:0,           /* bizim history.go(-n) çağrımızın henüz gelmemiş popstate sayısı */
  geriBirikim:0,geriZamani:null,
  bekleyenEkran:null,        /* geri alma sürerken yapılan go(): popstate yutulunca push edilir */
  hist:null,                 /* sınama için history yerine konabilir */
  modalNo:0,alanNo:0,kurulu:false,
  gecmis(){return this.hist||(typeof history!=='undefined'?history:null)},
  geriBekliyor(){return this.yutulacakGeri>0||this.geriBirikim>0},
  gecmisPush(durum){
    const g=this.gecmis();if(!g)return false;
    try{g.pushState(durum,'');return true}catch(e){return false}
  },
  ekranKaydi(view,param){
    if(this.geriBekliyor()){this.bekleyenEkran={v:view,p:param};return}
    this.gecmisPush({sena:'ekran',v:view,p:param===undefined?null:param});
  },
  geriIste(){
    this.geriBirikim++;
    if(this.geriZamani)return;
    this.geriZamani=setTimeout(()=>{
      const n=this.geriBirikim;this.geriBirikim=0;this.geriZamani=null;
      const g=this.gecmis();
      if(g&&n>0){this.yutulacakGeri++;g.go(-n)}
    },0);
  },
  ustModal(){
    this.acik=this.acik.filter(k=>k.bg.isConnected!==false); /* #modals dışarıdan boşaltıldıysa ölü kayıtları at */
    return this.acik[this.acik.length-1]||null;
  },
  /* popstate: ne yapıldığını döner (sınama için) */
  geriTusu(durum){
    if(this.yutulacakGeri>0){
      this.yutulacakGeri--;
      if(this.yutulacakGeri===0&&this.bekleyenEkran){const b=this.bekleyenEkran;this.bekleyenEkran=null;this.ekranKaydi(b.v,b.p)}
      return 'yutuldu';
    }
    const ust=this.ustModal();
    if(ust){
      if(ust.kirli()){ /* dolu form: geri tuşu da arka plan dokunuşu gibi korunur — kaydı geri yükle, onay sor */
        this.gecmisPush({sena:'modal'});
        this.cikisSor(ust);
        return 'onay';
      }
      ust.kapat(true);
      return 'pencere-kapandi';
    }
    if(durum&&durum.sena==='modal')return 'yoksayildi'; /* ileri tuşuyla dönülmüş artık pencere kaydı */
    const app=$('#app');if(app&&!app.classList.contains('ready'))return 'kilitli';
    const ek=durum&&durum.sena==='ekran';
    this.go(ek?durum.v:'dash',ek&&durum.p!=null?durum.p:undefined,true);
    return 'ekran';
  },

  /* dolu pencereden çıkış onayı (geri tuşu + Esc ortak yolu) */
  cikisSor(ust){this.onay('Çıkılsın mı?','Kaydedilmemiş değişiklik var — çıkılsın mı?','Evet, çık',()=>ust.kapat(false))},

  /* klavye: Esc en üstteki pencereyi kapatır; Tab/Shift+Tab pencere içinde döner */
  odaklanabilirler(m){
    return Array.from(m.querySelectorAll('a[href],button,input,select,textarea,[tabindex]')).filter(el=>
      !el.disabled&&el.getAttribute('tabindex')!=='-1'&&el.type!=='hidden'&&el.getClientRects().length>0);
  },
  tus(e){
    const ust=this.ustModal();if(!ust)return;
    if(e.key==='Escape'){e.preventDefault();if(ust.kirli())this.cikisSor(ust);else ust.kapat(false);return} /* dolu form: geri tuşu gibi sor */
    if(e.key!=='Tab')return;
    const liste=this.odaklanabilirler(ust.m);
    if(!liste.length){e.preventDefault();ust.m.focus();return}
    const ilk=liste[0],son=liste[liste.length-1],a=document.activeElement,iceride=ust.m.contains(a);
    if(e.shiftKey&&(a===ilk||a===ust.m||!iceride)){e.preventDefault();son.focus()}
    else if(!e.shiftKey&&(a===son||!iceride)){e.preventDefault();ilk.focus()}
  },
  /* açılışta bir kez (App.boot): global dinleyiciler + bildirim bölgesi */
  kur(){
    if(this.kurulu)return;this.kurulu=true;
    const t=$('#toasts');if(t)t.setAttribute('aria-live','polite');
    document.addEventListener('keydown',e=>this.tus(e));
    window.addEventListener('popstate',e=>this.geriTusu(e.state));
  },

  /* tıklanabilir div/satır: klavyeyle de çalışsın (role=button, Tab, Enter/Boşluk) */
  tiklanir(el,fn){
    el.setAttribute('role','button');el.setAttribute('tabindex','0');
    el.addEventListener('click',fn);
    el.addEventListener('keydown',e=>{
      if(e.target!==el)return; /* içteki bağlantı/düğmenin kendi Enter'ı bozulmasın */
      if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}
    });
    return el;
  },

  /* ---- düzenleme koruması ----
     Kullanıcı bir alana yazmaya başladığında alan data-taslak işareti alır (taslakBagla). Veri değiştiğinde
     (Store.touch / eşitleme çekmesi) app.js UI.veriDegisti()'ni çağırır: #main içinde işaretli alan varsa çizim
     ERTELENİR (yazı kaybolmasın), yoksa normal UI.render(). Ertelenen çizim kullanıcı kaydedince (taslakDusur +
     Islem'in kendi emit'i) ya da başka ekrana geçince (go) yapılır. */
  girisNo:0,                 /* UI.go sayacı: ekran "yeni girildi mi" ayrımı için */
  bekleyenCizim:false,       /* taslak yüzünden ertelenmiş bir çizim var */
  taslakBildirildi:false,    /* bu erteleme döneminde toast bir kez gösterildi */

  ayarDamgasi:undefined,     /* yan menünün en son hangi Store.data.settingsUpdatedAt ile kurulduğu */

  taslakVar(){return !!$('#main [data-taslak]')},
  taslakBagla(el){
    el.addEventListener('input',()=>el.setAttribute('data-taslak','1'));
    return el;
  },
  /* tüm taslak işaretlerini ve ertelenmiş çizimi düşür; ertelenmiş çizim vardı mı döner (çizmez) */
  taslakDusur(){
    $$('#main [data-taslak]').forEach(e=>e.removeAttribute('data-taslak'));
    const b=this.bekleyenCizim;this.bekleyenCizim=false;this.taslakBildirildi=false;
    return b;
  },
  /* tek bir alanın taslağı bitti (ör. parola kutusu temizlendi): başka taslak kalmadıysa ertelenen çizim yapılır */
  taslakBitti(el){
    if(el)el.removeAttribute('data-taslak');
    if(!this.taslakVar()){const b=this.bekleyenCizim;this.taslakDusur();if(b)this.render()}
  },
  veriDegisti(){
    /* ayar eşitlemeyle değiştiyse (klinik/asistan adı…) yan menü/üst bar de tazelensin; shell #main dışındadır,
       taslağı etkilemez — çizim ertelense bile yapılır */
    const damga=Store.data&&Store.data.settingsUpdatedAt;
    if(damga!==this.ayarDamgasi){this.ayarDamgasi=damga;this.shell()}
    if(this.taslakVar()){
      this.bekleyenCizim=true;this.navIsaretle(); /* çizim ertelense de menü rozetleri tazelensin */
      if(!this.taslakBildirildi){this.taslakBildirildi=true;this.toast('Yeni veri geldi — kaydedince ekran yenilenecek')}
      return;
    }
    this.render();
  },

  render(){
    this.bekleyenCizim=false;this.taslakBildirildi=false;
    const main=$('#main');main.innerHTML='';
    (this.views[this.view]||this.views.dash)(main,this.param);
    Degisim.gordum(this.view);
    this.navIsaretle();
    /* K3.11: YALNIZ ekran (view/param) değişince başa kaydır; kayıt/eşitleme sonrası aynı ekranın yeniden çizimi yerinde bırakır */
    const yeni=!this.sonEkran||this.sonEkran.view!==this.view||this.sonEkran.param!==this.param;
    this.sonEkran={view:this.view,param:this.param};

  /* yan menü / tabbar'da aktif ekranın düğmesini işaretle (render ve shell kullanır) */
  navIsaretle(){
    const isle=b=>{const on=b.dataset.v===this.view;b.classList.toggle('on',on);
