          const av=h('div.av');av.style.background=s.renk;av.textContent=s.bas;row.appendChild(av);
          const tx=h('div');const b=h('b');b.textContent=s.ad;tx.appendChild(b);
          if(s.alt){const sm=h('small.muted',{style:'display:block'});sm.textContent=s.alt;tx.appendChild(sm)}
          row.appendChild(tx);liste.appendChild(row);
        });
      };
      /* arama yazmak «değişiklik» sayılmasın: dışarı dokununca pencere kapanabilsin */
      inp.addEventListener('input',e=>{e.stopPropagation();ciz()});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&sonuc.length){e.preventDefault();ac(sonuc[0].id)}});
      setTimeout(()=>inp.focus(),50);
    });
  },
  modal(title,build,opts){
    const sinif=(opts&&opts.sinif)?'.'+opts.sinif:'';
    const onceki=document.activeElement;
    const tid='mdl-baslik-'+(++this.modalNo);
    const bg=h('div.modal-bg'+sinif);
    const m=h('div.modal'+sinif,{role:'dialog','aria-modal':'true','aria-labelledby':tid,tabindex:'-1'});
    const head=h('h2');head.appendChild(h('span',{id:tid},title));
    const x=h('button.x',{onclick:()=>close(),'aria-label':'Kapat'});x.appendChild(icon('x'));
    head.appendChild(x);m.appendChild(head);
    bg.appendChild(m);
    let kirli=false,kapandi=false;
    m.addEventListener('input',()=>{kirli=true});
    m.addEventListener('change',()=>{kirli=true});
    const kayit={bg,m,kirli:()=>kirli,kayitli:false,kapat:null};
    /* geriden=true: tarayıcı geri tuşu zaten history kaydını geri aldı — tekrar geri ALMA */
    const kapat=geriden=>{
      if(kapandi)return;kapandi=true;
      const i=this.acik.indexOf(kayit);if(i>=0)this.acik.splice(i,1);
      bg.classList.remove('open');setTimeout(()=>bg.remove(),200);
      if(kayit.kayitli&&!geriden)this.geriIste();
      if(!this.ustModal()&&onceki&&onceki!==document.body&&onceki.isConnected&&onceki.focus)onceki.focus({preventScroll:true});
    };
    kayit.kapat=kapat;
    const close=()=>kapat(false); /* build'e verilen close, olay nesnesiyle de çağrılabilir (onclick:close) — argüman okunmaz */
    bg.addEventListener('click',e=>{
      if(e.target!==bg)return;
      if(kirli)this.toast('Değişiklikler kaybolmasın diye pencere açık kaldı — kapatmak için ✕ ya da Vazgeç');
      else close();
    });
    $('#modals').appendChild(bg);
    this.acik.push(kayit);
    kayit.kayitli=this.gecmisPush({sena:'modal'});
    build(m,close);
    requestAnimationFrame(()=>bg.classList.add('open'));
    m.focus({preventScroll:true}); /* telefonda klavye açılmasın diye alana değil pencereye */
    const inp=m.querySelector('input,select');if(inp&&window.innerWidth>900)setTimeout(()=>inp.focus(),150);
    return close;
  },
  confirm(msg,onYes){
    this.modal('Emin misiniz?',(m,close)=>{
      m.appendChild(h('p',{style:'color:var(--ink-2);font-size:14px'},msg));
      const acts=h('div.actions');
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn.danger',{onclick:()=>{close();onYes()}},'Evet, sil'));
      m.appendChild(acts);
    },{sinif:'onay'});
  },

  /* silme dışı onay (D3): başlık, ileti ve onay düğmesi metni verilir; Vazgeç hiçbir şey yapmaz */
  onay(baslik,msg,evetMetni,onYes){
    this.modal(baslik,(m,close)=>{
      m.appendChild(h('p',{style:'color:var(--ink-2);font-size:14px'},msg));
      const acts=h('div.actions');
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{close();onYes()}},evetMetni));
      m.appendChild(acts);
    },{sinif:'onay'});
  },

  toast(msg,type){
    const t=h('div.toast'+(type?'.'+type:''));t.textContent=msg;
    if(type==='err')t.setAttribute('role','alert'); /* hata anında okunur; süre de uzun */
    const kap=$('#toasts');
    if(!kap.getAttribute('aria-live'))kap.setAttribute('aria-live','polite');
    kap.appendChild(t);
    setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),350)},type==='err'?5000:3500);
  },

  /* ---- form yardımcıları ---- */
  field(label,inputEl,help){
    const f=h('div.field');const l=h('label');l.textContent=label;f.appendChild(l);f.appendChild(inputEl);
    const tag=String(inputEl.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea'){ /* etiket ↔ kontrol bağı */
      if(!inputEl.id)inputEl.id='alan-'+(++this.alanNo);
      l.setAttribute('for',inputEl.id);
    }else{ /* seg gibi kontrol-olmayan: grup + etiketle adlandır */
      l.id='alan-e'+(++this.alanNo);
      inputEl.setAttribute('role','group');inputEl.setAttribute('aria-labelledby',l.id);
    }
    if(help){const p=h('div.help');p.textContent=help;f.appendChild(p)}
    return f;
  },
  input(attrs){return h('input',attrs)},
  select(options,value,attrs){
    const s=h('select',attrs||{});
    options.forEach(o=>{
      const[v,lbl]=Array.isArray(o)?o:[o,o];
      const op=h('option',{value:v});op.textContent=lbl;if(String(v)===String(value))op.selected=true;
      s.appendChild(op);
    });
    return s;
  },
  seg(options,value,onSel){
    const wrap=h('div.seg');
    options.forEach(o=>{
      const[v,lbl]=Array.isArray(o)?o:[o,o];
      const on=String(v)===String(value);
      const b=h('button',{type:'button',class:on?'on':'','aria-pressed':on?'true':'false'});b.textContent=lbl;
      b.addEventListener('click',()=>{
        $$('button',wrap).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});
        b.classList.add('on');b.setAttribute('aria-pressed','true');wrap.dataset.value=v;
        wrap.dispatchEvent(new Event('change',{bubbles:true})); /* pencere "değişti" sayılsın (Q6) */
        onSel&&onSel(v)});
      wrap.appendChild(b);
    });
    wrap.dataset.value=value;
    return wrap;
  },

  /* K3.5: Islem.*Kaydet {ok:false,hata,alan?} dönünce TÜM formlarda aynı yol. Hata, pencerenin İÇİNDE Kaydet
     düğmelerinin üstündeki satırda (role=alert) gösterilir + toast kalır; alan biliniyorsa (alanlar[r.alan]) o alana
     aria-invalid + odak. alanlar: {islemAlanAdı: inputEl}. Satır pencerede tek tanedir (tekrarlı hatada yeniden kullanılır). */
  formHatasi(m,r,alanlar){
    let satir=m.querySelector('.form-hata');
    if(!satir){
      satir=h('div.form-hata',{role:'alert',id:'form-hata-'+(++this.alanNo)});
      const acts=m.querySelector('.actions');
      if(acts)m.insertBefore(satir,acts);else m.appendChild(satir);
    }
    satir.textContent=r.hata;
    Array.from(m.querySelectorAll('[aria-invalid]')).forEach(e=>{e.removeAttribute('aria-invalid');e.removeAttribute('aria-describedby')});
    const el=r.alan&&alanlar?alanlar[r.alan]:null;
    if(el){
      el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',satir.id);
      el.addEventListener('input',()=>el.removeAttribute('aria-invalid'),{once:true});
      if(el.focus)el.focus();
    }
    this.toast(r.hata,'err');
    return r;
  },

  clientSelect(value){
    return this.select(FormVM.danisanSecenekleri().map(o=>[o.deger,o.metin]),value);
  },

  /* ---- hızlı ekleme ---- */
  quickAdd(){
    this.modal(FormVM.ADLAR.hizliIslem,(m,close)=>{
      /* hangi satırların var olduğu ve sırası FormVM.hizliIslemler()'den; burada yalnız ADLAR anahtarı → [ikon, ton, eylem, alt yazı] bağlanır */
      const A=FormVM.ADLAR;
      const BAG={
        randevuEkle:['cal','sky',()=>Forms.appointment()],
        tahsilat:['money','sage',()=>Forms.payment()],
        giderEkle:['wallet','blush',()=>Forms.transaction('gider'),A.giderAlt],
        kisiselHarcama:['heart','blush',()=>Forms.transaction('kisisel'),A.kisiselAlt],
        gelirEkle:['chart','sand',()=>Forms.transaction('gelir'),A.gelirAlt],
        paketSat:['gift','sand',()=>Forms.sellPackage()],
        danisanEkle:['users','lav',()=>Forms.client()]
      };
      const opts=FormVM.hizliIslemler().map(k=>[A[k],BAG[k][0],BAG[k][1],BAG[k][2],BAG[k][3]]);
      opts.forEach(([lbl,ic,tone,fn,alt])=>{
        const b=h('button.row.click',{style:'width:100%;text-align:left',onclick:()=>{close();fn()}});
        const badge=h('div.av');badge.style.background='var(--p-'+(tone==='sage'?'sage':tone)+')';
        badge.style.color='var(--p-'+(tone==='sage'?'sage':tone)+'-ink)';badge.style.borderRadius='12px';
        badge.appendChild(icon(ic));
        const bd=h('div.body');const bb=h('b');bb.textContent=lbl;bd.appendChild(bb);
        if(alt){const ss=h('small');ss.textContent=alt;bd.appendChild(ss)}
        b.appendChild(badge);b.appendChild(bd);
        m.appendChild(b);
      });
    });
  }
};

      }},'Kaydet'));
      m.appendChild(acts);
    });

  /* ---------- gelir / gider / kişisel ---------- */
  transaction(type,existing,onDone){
    const t=Object.assign({},existing||{type:type||'gider'}); // yerel TASLAK: Tür seçimi canlı kayda yazılmaz, yalnız Kaydet'te Islem.islemKaydet yazar
    UI.modal(existing?'Kaydı düzenle':FormVM.islemBasligi(t.type),(m,close)=>{
      const typeSeg=UI.seg(FormVM.islemTurleri(),t.type,v=>{t.type=v;refreshCats();
        if(!existing){const bs=m.querySelector('h2 span');if(bs)bs.textContent=FormVM.islemBasligi(v)}}); /* yeni kayıtta başlık seçilen türü izler */
      const cat=UI.select([],t.category);
      const refreshCats=()=>{
        const list=FormVM.kategoriSecenekleri(t.type);
        cat.innerHTML='';list.forEach(x=>{const o=h('option',{value:x});o.textContent=x;if(x===t.category)o.selected=true;cat.appendChild(o)});
      };
      refreshCats();
      const amount=UI.input({value:t.amount||'',type:'number',inputmode:'numeric',placeholder:'0'});
      const date=UI.input({value:t.date||todayStr(),type:'date'});
      const note=UI.input({value:t.note||'',placeholder:'isteğe bağlı'});
      m.appendChild(UI.field('Tür',typeSeg));
      const fr=h('div.frow');fr.appendChild(UI.field('Kategori',cat));fr.appendChild(UI.field('Tutar (₺)',amount));
      m.appendChild(fr);
      m.appendChild(UI.field('Tarih',date));
      m.appendChild(UI.field('Not',note));
      const acts=h('div.actions');
      if(existing){
        const del=h('button.btn.danger.icon',{'aria-label':'Sil',onclick:()=>UI.confirm('Bu kayıt silinsin mi?',()=>{const r=Islem.islemSil(existing.id);close();UI.render();UI.toast(r.mesaj,'ok')})});
        del.appendChild(icon('trash'));acts.appendChild(del);
      }
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{
        const r=Islem.islemKaydet({type:t.type,category:cat.value,amount:amount.value,date:date.value,note:note.value},existing&&existing.id);
        if(!r.ok)return UI.formHatasi(m,r,{amount});
        close();UI.toast(r.mesaj,'ok');UI.render();onDone&&onDone();
      }},'Kaydet'));
      m.appendChild(acts);
    });
  },

  /* ---------- tekrarlayan gider ---------- */
  recurring(existing){
    const r=existing||{};
    UI.modal(existing?'Tekrarlayanı düzenle':'Tekrarlayan ödeme',(m,close)=>{
      const name=UI.input({value:r.name||'',placeholder:'örn. Ofis kirası'});
      const typeSeg=UI.seg(FormVM.tekrarTurleri(),r.type||'gider');
      const cat=UI.select(FormVM.tekrarlayanKategorileri().map(x=>[x,x]),r.category||'Kira');
      const amount=UI.input({value:r.amount||'',type:'number',inputmode:'numeric'});
      const day=UI.input({value:r.dayOfMonth||1,type:'number',min:1,max:28});
      m.appendChild(UI.field('Ad',name));
      m.appendChild(UI.field('Tür',typeSeg));
      const fr=h('div.frow');fr.appendChild(UI.field('Kategori',cat));fr.appendChild(UI.field('Tutar (₺)',amount));
      m.appendChild(fr);
      m.appendChild(UI.field('Her ayın hangi günü?',day,'1–28 arası; panel o gün yaklaşınca hatırlatır'));
      const acts=h('div.actions');
      if(existing){
        const del=h('button.btn.danger.icon',{'aria-label':'Sil',onclick:()=>UI.confirm('Silinsin mi?',()=>{const r=Islem.tekrarlayanSil(existing.id);close();UI.render();UI.toast(r.mesaj,'ok')})});
        del.appendChild(icon('trash'));acts.appendChild(del);
      }
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{
        const r=Islem.tekrarlayanKaydet({name:name.value,type:typeSeg.dataset.value,category:cat.value,amount:amount.value,dayOfMonth:day.value},existing&&existing.id);
        if(!r.ok)return UI.formHatasi(m,r,{name,amount});
        close();UI.toast(r.mesaj,'ok');UI.render();
      }},'Kaydet'));
      m.appendChild(acts);
    });
  },

  /* ---------- paket tanımı ---------- */
  packageTemplate(existing){
    const p=existing||{};
    UI.modal(existing?'Paketi düzenle':FormVM.ADLAR.paketTasarla,(m,close)=>{
      const name=UI.input({value:p.name||'',placeholder:'örn. 5 Seanslık Destek Paketi'});
      const sessions=UI.input({value:p.sessions||5,type:'number',min:2,max:50,inputmode:'numeric'});
      const price=UI.input({value:p.price||'',type:'number',inputmode:'numeric',placeholder:'toplam fiyat'});
      const note=UI.input({value:p.note||'',placeholder:'isteğe bağlı açıklama'});
      const hint=h('div.alert.info',{style:'margin-bottom:13px'});
      const hIco=h('div.ico');hIco.appendChild(icon('gift'));hint.appendChild(hIco);
      const hBody=h('div');const hb=h('b');const hs=h('small');hBody.appendChild(hb);hBody.appendChild(hs);hint.appendChild(hBody);
      const refresh=()=>{
        const o=FormVM.paketOnizleme(sessions.value,price.value);
        hb.textContent=o.baslik;hs.textContent=o.alt;
      };
      sessions.addEventListener('input',refresh);price.addEventListener('input',refresh);
      m.appendChild(UI.field('Paket adı',name));
      const fr=h('div.frow');fr.appendChild(UI.field('Seans sayısı',sessions));fr.appendChild(UI.field('Toplam fiyat (₺)',price));
      m.appendChild(fr);
      m.appendChild(hint);refresh();
      m.appendChild(UI.field('Açıklama',note));
      const acts=h('div.actions');
      if(existing){
        const del=h('button.btn.danger.icon',{'aria-label':'Sil',onclick:()=>UI.confirm('Bu paket tanımı silinsin mi? (Satılmış paketler etkilenmez)',()=>{const r=Islem.paketSil(existing.id);close();UI.render();UI.toast(r.mesaj,'ok')})});
        del.appendChild(icon('trash'));acts.appendChild(del);
      }
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{
        const r=Islem.paketKaydet({name:name.value,sessions:sessions.value,price:price.value,note:note.value},existing&&existing.id);

        close();UI.toast(r.mesaj,'ok');UI.render();
      }},'Kaydet'));
      m.appendChild(acts);
    });

  /* ---------- paket satışı ---------- */
  sellPackage(clientId,packageId){
    UI.modal(FormVM.ADLAR.paketSat,(m,close)=>{
      const tpls=Store.col('packages');
      const client=UI.clientSelect(clientId||'');
      const tpl=UI.select([['','— Paket seçin —'],...tpls.map(p=>[p.id,p.name+' · '+p.sessions+' seans · '+money(p.price)])],packageId||'');

      tpl.addEventListener('change',fillFrom);
      if(packageId)fillFrom();
      m.appendChild(UI.field('Danışan',client));
      if(tpls.length)m.appendChild(UI.field('Hazır paket',tpl,'seçince seans ve fiyat otomatik dolar; elle de değiştirebilirsiniz'));
      else m.appendChild(h('p',{style:'font-size:12px;color:var(--muted);margin:-4px 0 12px'},'İpucu: Finans → Paketler bölümünde hazır paketler tasarlayabilirsiniz.'));
      const fr=h('div.frow');fr.appendChild(UI.field('Seans sayısı',sessions));fr.appendChild(UI.field('Fiyat (₺)',price));
      m.appendChild(fr);
      const fr2=h('div.frow');fr2.appendChild(UI.field('Satış tarihi',date));m.appendChild(fr2);
      m.appendChild(UI.field('Ödeme yöntemi',method,'ödeme, tahsilat/gelir olarak otomatik işlenir'));
      const acts=h('div.actions');
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{
        const r=Islem.paketSat({clientId:client.value,packageId:tpl.value,sessions:sessions.value,price:price.value,
          date:date.value,method:method.dataset.value});

        close();UI.toast(r.mesaj,'ok');UI.render();

  /* bekleme listesi */
  waitlist(existing){

      const name=UI.input({value:w.name||'',placeholder:'Ad Soyad'});
      const phone=UI.input({value:w.phone||'',placeholder:'05xx…',type:'tel'});
      const note=UI.input({value:w.note||'',placeholder:'tercih ettiği gün/saat vb.'});
      m.appendChild(UI.field('Ad',name));
      m.appendChild(UI.field('Telefon',phone));
      m.appendChild(UI.field('Not',note));
      const acts=h('div.actions');
      if(existing){
        const del=h('button.btn.danger.icon',{'aria-label':'Sil',onclick:()=>UI.confirm((existing.name||'Bu kişi')+' bekleme listesinden çıkarılsın mı?',()=>{const r=Islem.beklemeSil(existing.id);close();UI.render();UI.toast(r.mesaj,'ok')})});
        del.appendChild(icon('trash'));acts.appendChild(del);
      }
      acts.appendChild(h('button.btn.ghost',{onclick:close},'Vazgeç'));
      acts.appendChild(h('button.btn',{onclick:()=>{
        const r=Islem.beklemeKaydet({name:name.value,phone:phone.value,note:note.value},existing&&existing.id);
        if(!r.ok)return UI.formHatasi(m,r,{name});
        close();UI.render();
      }},'Kaydet'));
      m.appendChild(acts);
    });
  }
};

/* Ana ekran — hesap yok: DashVM.durum() çıktısı DOM'a dökülür, olaylar bağlanır */
UI.register('dash',main=>{
  const v=DashVM.durum();

  const top=h('div.topbar');
  const tt=h('div');
  const h1=h('h1');h1.textContent=v.baslik;
  const sub=h('div.sub');sub.textContent=v.altBaslik;
  tt.appendChild(h1);tt.appendChild(sub);

  const qa=h('button.btn',{onclick:()=>UI.quickAdd(),style:'display:none'});
  qa.appendChild(icon('plus'));qa.appendChild(document.createTextNode(FormVM.ADLAR.hizliIslem));
  if(window.innerWidth>900)qa.style.display='';
  top.appendChild(qa);
  main.appendChild(top);

  /* --- stat satırı --- */
  const SERI_RENK={seans:'#7b6bc9',gelir:'#2aa27a'};
  const stats=h('div.grid.cols-4.mb');
  v.kartlar.forEach(k=>{
    const c=h('div.card.stat');
    const l=h('div.lbl');l.textContent=k.ad;c.appendChild(l);

    if(k.deltaTaban){const tb=h('div.delta-taban');tb.textContent=k.deltaTaban;c.appendChild(tb)}
    if(k.seri){const sp=h('div.spark');sp.appendChild(sparkline(k.seri,SERI_RENK[k.kod]||'var(--s1)'));c.appendChild(sp)}
    stats.appendChild(c);
  });
  main.appendChild(stats);

  const grid=h('div.grid',{style:'grid-template-columns:1.4fr 1fr'});
  if(window.innerWidth<=900)grid.style.gridTemplateColumns='1fr';

  /* --- sol: bugün & yarın --- */
  const left=h('div',{style:'display:flex;flex-direction:column;gap:14px;min-width:0'});
  const dayCard=g=>{
    const card=h('div.card');
    const head=h('h3');head.appendChild(document.createTextNode(g.baslik));
    const hint=h('span.hint');hint.textContent=g.ipucu;head.appendChild(hint);
    card.appendChild(head);
    if(g.bos){
      const e=h('div.empty');e.appendChild(icon('cal'));e.appendChild(h('div',{},'Randevu yok'));
      e.appendChild(h('button.btn.soft.sm.mt',{onclick:()=>Forms.appointment(null,{date:g.tarih})},'+ '+FormVM.ADLAR.randevuEkle)); /* K3.9 */
      card.appendChild(e);
      return card;

      const row=UI.tiklanir(h('div.appt.'+r.durum,{style:'margin-bottom:7px'}),()=>Forms.apptActions(r.randevu));
      const tm=h('div',{style:'font-weight:700;font-size:13px;min-width:44px'});tm.textContent=r.saat;
      const bd=h('div',{style:'min-width:0;flex:1'});
      const bb=h('b');bb.textContent=r.ad;bd.appendChild(bb);
      const ss=h('small');ss.textContent=r.altMetin;bd.appendChild(ss);
      row.appendChild(tm);row.appendChild(bd);
      const st=h('span.st.chip.'+r.durumSinif);
      st.textContent=r.durumEtiket;
      row.appendChild(st);

        const wa=h('a.btn.soft.sm',{href:r.waHref,target:'_blank',
          onclick:e=>e.stopPropagation(),style:'margin-left:6px;flex-shrink:0','aria-label':'WhatsApp – '+r.ad});
        wa.appendChild(icon('wa'));
        row.appendChild(wa);
      }
      card.appendChild(row);
    });
    return card;
  };
  left.appendChild(dayCard(v.bugun));
  left.appendChild(dayCard(v.yarin));

  /* günü kapat */
  const gk=h('div.card');
  const gkh=h('h3');gkh.appendChild(icon('moon'));gkh.appendChild(document.createTextNode('Günün özeti'));gk.appendChild(gkh);
  const gkGrid=h('div.grid.cols-3');
  const mini=(lbl,val)=>{const d=h('div',{style:'text-align:center;padding:8px;border-radius:12px;background:var(--card-2)'});
    const vv=h('div',{style:'font-size:19px;font-weight:700'});vv.textContent=val;
    const l=h('div',{style:'font-size:11.5px;color:var(--muted);font-weight:600'});l.textContent=lbl;
    d.appendChild(vv);d.appendChild(l);return d};
  gkGrid.appendChild(mini('Yapılan seans',v.ozet.seans));
  gkGrid.appendChild(mini('Tahsilat',v.ozet.tahsilat));
  gkGrid.appendChild(mini('Gider',v.ozet.gider));
  gk.appendChild(gkGrid);
  left.appendChild(gk);
  grid.appendChild(left);

  /* --- sağ: uyarılar + borçlular --- */
  const right=h('div',{style:'display:flex;flex-direction:column;gap:14px;min-width:0'});
  const ac=h('div.card');
  const ah=h('h3');ah.appendChild(icon('bell'));ah.appendChild(document.createTextNode('Dikkat gerekenler'));
  const ahint=h('span.hint');ahint.textContent=v.uyarilar.ipucu;ah.appendChild(ahint);
  ac.appendChild(ah);
  const hatB=h('button.btn.ghost.sm',{onclick:()=>UI.go('hatir'),style:'margin:-4px 0 10px'});
  hatB.appendChild(icon('bell'));hatB.appendChild(document.createTextNode('Uzun süredir gelmeyenler →'));ac.appendChild(hatB);
  if(!v.uyarilar.sayi){
    const e=h('div.empty');e.appendChild(icon('heart'));e.appendChild(h('div',{},'Şu an dikkat gerektiren bir şey yok'));ac.appendChild(e);
  }
  v.uyarilar.liste.forEach(al=>{
    const row=h('div.alert.'+al.sev,{style:'margin-bottom:8px'});
    const ico=h('div.ico');ico.appendChild(icon(al.ikon));
    row.appendChild(ico);
    const bd=h('div',{style:'min-width:0;flex:1'});
    const bb=h('b');bb.textContent=al.baslik;bd.appendChild(bb);
    const ss=h('small');ss.textContent=al.altMetin;bd.appendChild(ss);
    row.appendChild(bd);
    const ey=al.eylem;
    if(ey){
      const act=h('div.act');
      if(ey.tur==='wa-uzak'||ey.tur==='wa-dogum'){
        const wa=h('a.btn.soft.sm',{href:ey.href,target:'_blank','aria-label':'WhatsApp – '+al.baslik});
        wa.appendChild(icon('wa'));act.appendChild(wa);
      }else if(ey.tur==='ac'){
        act.appendChild(h('button.btn.soft.sm',{onclick:()=>UI.go('clients',ey.danisanId)},ey.etiket));
      }else if(ey.tur==='ayarlar'){
        act.appendChild(h('button.btn.soft.sm',{onclick:()=>UI.go('set',ey.bolum)},ey.etiket));
      }else if(ey.tur==='randevu'){
        act.appendChild(h('button.btn.soft.sm',{onclick:()=>Forms.apptActions(ey.randevu)},ey.etiket));
      }else if(ey.tur==='takvim'){
        act.appendChild(h('button.btn.soft.sm',{onclick:()=>{TakvimVM.gunSec(ey.tarih);UI.go('cal')}},ey.etiket));
      }else if(ey.tur==='ode'){
        act.appendChild(h('button.btn.soft.sm',{onclick:()=>{
          const r=Islem.tekrarlayanOde(ey.recId,todayStr());
          UI.toast(r.ok?r.mesaj:r.hata,r.ok?'ok':'err');UI.render();
        }},ey.etiket));
      }
      row.appendChild(act);
    }
    ac.appendChild(row);
  });
  right.appendChild(ac);

  /* açık bakiyeler */
  const dcard=h('div.card');
  const dh=h('h3');dh.appendChild(icon('money'));dh.appendChild(document.createTextNode('Açık bakiyeler'));dcard.appendChild(dh);
  if(v.acikBakiyeler.bos){
    const e=h('div.empty');e.appendChild(icon('check'));e.appendChild(h('div',{},'Tüm hesaplar kapalı 🎉'));dcard.appendChild(e);
  }
  v.acikBakiyeler.liste.forEach(r=>{
    const row=UI.tiklanir(h('div.row.click'),()=>UI.go('clients',r.danisanId));
    const av=h('div.av');av.style.background=r.renk;av.textContent=r.bas;
    const bd=h('div.body');const bb=h('b');bb.textContent=r.ad;bd.appendChild(bb);
    const ss=h('small');ss.textContent=r.altMetin;bd.appendChild(ss);
    const end=h('div.end');const eb=h('b.neg');eb.textContent=r.tutar;end.appendChild(eb);
    if(r.asim){const cp=h('span.chip.crit',{style:'margin-top:3px'});cp.textContent='uyarı sınırı üstü';end.appendChild(cp)} /* K3a/Q8: borç uyarısı buraya taşındı */
    row.appendChild(av);row.appendChild(bd);row.appendChild(end);
    dcard.appendChild(row);
  });
  right.appendChild(dcard);
  grid.appendChild(right);
  main.appendChild(grid);
});

/* Randevular — gün / hafta / ay. Hesap yok: TakvimVM.durum() DOM'a dökülür; gezinti durumu TakvimVM'de. */
TakvimVM.mod=window.innerWidth<=900?'day':'week'; /* başlangıç modu DOM bilgisi ister → VM'e view söyler */
UI.register('cal',main=>{
  const v=TakvimVM.durum();
  const top=h('div.topbar');
  const h1=h('h1');h1.textContent='Randevular';top.appendChild(h1);
  top.appendChild(h('div.grow'));
  const add=h('button.btn',{onclick:()=>Forms.appointment(null,{date:TakvimVM.capa})});
  add.appendChild(icon('plus'));add.appendChild(document.createTextNode(FormVM.ADLAR.randevuEkle));
  top.appendChild(add);
  main.appendChild(top);

  const head=h('div.cal-head');
  const birim={day:'gün',week:'hafta',month:'ay'}[v.mod]||'dönem';
  const prevB=h('button.btn.ghost.icon',{onclick:()=>{TakvimVM.kaydir(-1);UI.render()},'aria-label':'Önceki '+birim});prevB.appendChild(icon('left'));
  const nextB=h('button.btn.ghost.icon',{onclick:()=>{TakvimVM.kaydir(1);UI.render()},'aria-label':'Sonraki '+birim});nextB.appendChild(icon('right'));
  const todayB=h('button.btn.ghost.sm',{onclick:()=>{TakvimVM.bugune();UI.render()}},'Bugün');
  const title=h('h2');title.textContent=v.baslik;
  const seg=UI.seg([['day','Gün'],['week','Hafta'],['month','Ay']],v.mod,m=>{TakvimVM.modSec(m);UI.render()});
  head.appendChild(prevB);head.appendChild(nextB);head.appendChild(todayB);head.appendChild(title);
  head.appendChild(h('div.grow'));head.appendChild(seg);
  main.appendChild(head);

  if(v.mod==='day'){
    const card=h('div.card.day-list');
    const g=v.gun;
    if(g.bos){
      const e=h('div.empty');e.appendChild(icon('cal'));e.appendChild(h('div',{},g.bosMetni));
      const ab=h('button.btn.soft.sm.mt',{onclick:()=>Forms.appointment(null,{date:TakvimVM.capa})},'+ '+FormVM.ADLAR.randevuEkle);
      e.appendChild(h('div.mt'));e.appendChild(ab);card.appendChild(e);
    }
    g.kayitlar.forEach(r=>{
      const blk=h('div.hourblock');
      const hr=h('div.hr');hr.textContent=r.saat;blk.appendChild(hr);
      const ap=UI.tiklanir(h('div.appt.'+r.durum),()=>Forms.apptActions(r.randevu));
      const bd=h('div',{style:'min-width:0;flex:1'});
      const bb=h('b');bb.textContent=r.ad;bd.appendChild(bb);
      const ss=h('small');ss.textContent=r.altMetin;bd.appendChild(ss);
      ap.appendChild(bd);
      const st=h('span.st.chip.'+r.durumSinif);
      st.textContent=r.durumEtiket;
      ap.appendChild(st);
      blk.appendChild(ap);card.appendChild(blk);
    });
    main.appendChild(card);
  }

  else if(v.mod==='week'){
    const hf=v.hafta;
    const grid=h('div.week-grid');
    hf.gunler.forEach(g=>{
      const col=h('div.week-col'+(g.bugunMu?'.today':''));
      const wd=h('div.wd');wd.textContent=g.kisaAd;
      const wds=h('small');wds.textContent=g.tarihMetni;wd.appendChild(wds);
      col.appendChild(wd);
      g.olaylar.forEach(o=>{
        const ev=UI.tiklanir(h('div.evt.appt.'+o.durum,{style:'border-left-width:3px'}),()=>Forms.apptActions(o.randevu));

        const dh=h('div',{style:'font-weight:700;font-size:13px;margin:10px 0 5px;color:var(--ink-2)'});

        ev.textContent=o.metin;

      });
      if(hc.dahaMetni){const mo=h('div.more');mo.textContent=hc.dahaMetni;cell.appendChild(mo)}
      if(hc.toplamMetni){const tp=h('div.toplam');tp.textContent=hc.toplamMetni;cell.appendChild(tp)} /* K3.8: yalnız dar ekranda görünür (CSS) */
      if(hc.noktalar.length){
        const pips=h('div.pips');
        hc.noktalar.forEach(s=>{const p=h('i.pip');p.style.background=stColor[s]||'var(--s1)';pips.appendChild(p)});

    const lej=h('div.legend.cal-lejant');

    main.appendChild(lej); /* K3.8: durum lejantı */
  }
});

/* Danışanlar — liste + detay (hesaplar DanisanVM'de; burada yalnız çizim ve olay bağlama) */
UI.register('clients',(main,param)=>{
  if(param)return clientDetail(main,param);
  const top=h('div.topbar');
  const h1=h('h1');h1.textContent='Danışanlar';top.appendChild(h1);
  top.appendChild(h('div.grow'));
  const hat=h('button.btn.ghost.hat-dugme',{onclick:()=>UI.go('hatir'),'aria-label':'Hatırlatmalar'});hat.appendChild(icon('bell'));hat.appendChild(h('span',{},'Hatırlatmalar'));
  top.appendChild(hat);
  const add=h('button.btn',{onclick:()=>Forms.client()});
  add.appendChild(icon('plus'));add.appendChild(document.createTextNode(FormVM.ADLAR.danisanEkle));
  top.appendChild(add);
  main.appendChild(top);

  const ilk=DanisanVM.liste();
  const bar=h('div.flex.mb',{style:'flex-wrap:wrap'});

  const inp=h('input',{placeholder:'İsim veya telefon ara…',value:ilk.arama});

  sb.appendChild(inp);bar.appendChild(sb);
  bar.appendChild(UI.seg(ilk.filtreSecenekleri,ilk.filtre,v=>{DanisanVM.filtreSec(v);renderList()}));
  main.appendChild(bar);

  const listCard=h('div.card');main.appendChild(listCard);
  function renderList(){
    listCard.innerHTML='';
    const l=DanisanVM.liste();
    const hint=h('div.small.muted.mb');hint.textContent=l.sayac;listCard.appendChild(hint);
    if(l.bos){
      const e=h('div.empty');e.appendChild(icon('users'));e.appendChild(h('div',{},l.bosDurum.metin));
      if(l.bosDurum.eylem){const eb=h('button.btn.soft.sm.mt',{onclick:()=>Forms.client()},'+ '+l.bosDurum.eylem);e.appendChild(eb)}

      const bd=h('div.body');

      const ss=h('small');ss.textContent=c.ozet;
      bd.appendChild(ss);
      const end=h('div.end');
      if(c.sag&&c.sag.tur==='bakiye'){const eb=h('b.neg');eb.textContent=c.sag.metin;end.appendChild(eb);
        const es=h('small');es.textContent=c.sag.etiket;end.appendChild(es)}
      else if(c.sag){const ok=h('span.chip.good');ok.textContent=c.sag.metin;end.appendChild(ok)}
      row.appendChild(av);row.appendChild(bd);row.appendChild(end);
      listCard.appendChild(row);
    });

  wl.forEach(w=>{

    const av=h('div.av');av.style.background='var(--line-2)';av.style.color='var(--ink-2)';av.textContent=w.bas;
    const bd=h('div.body');const bb=h('b');bb.textContent=w.ad;bd.appendChild(bb);
    const ss=h('small');ss.textContent=w.ozet;bd.appendChild(ss);
    row.appendChild(av);row.appendChild(bd);

function clientDetail(main,id){

  if(!t){UI.go('clients');return}
  const c=t.kayit;

  const top=h('div.topbar');
  const back=h('button.btn.ghost.icon',{onclick:()=>UI.go('clients'),'aria-label':'Danışan listesine dön'});back.appendChild(icon('left'));
  top.appendChild(back);
  const av=h('div.av',{style:'width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px'});
  av.style.background=t.renk;av.textContent=t.bas;
  top.appendChild(av);
  const tt=h('div');
  const h1=h('h1',{style:'font-size:19px'});h1.textContent=t.ad;tt.appendChild(h1);
  const chips=h('div',{style:'display:flex;gap:5px;margin-top:3px;flex-wrap:wrap'});

  main.appendChild(top);

  /* iletişim + hızlı aksiyonlar */
  const acts=h('div.flex.mb',{style:'flex-wrap:wrap;gap:8px'});
  if(t.telefon){
    const call=h('a.btn.ghost.sm',{href:'tel:'+t.telefon});call.appendChild(icon('phone'));call.appendChild(document.createTextNode(t.telefon));
    acts.appendChild(call);

    const call2=h('a.btn.ghost.sm',{href:'tel:'+t.telefon2});call2.appendChild(icon('phone'));call2.appendChild(document.createTextNode(t.telefon2));
    acts.appendChild(call2);

    wa2.appendChild(icon('wa'));wa2.appendChild(document.createTextNode('WhatsApp'));
    acts.appendChild(wa2);
  }
  const nr=h('button.btn.sm',{onclick:()=>Forms.appointment(null,{clientId:id,fee:c.fee})});
  nr.appendChild(icon('plus'));nr.appendChild(document.createTextNode(FormVM.ADLAR.randevuEkle));acts.appendChild(nr);
  const pay=h('button.btn.sm',{onclick:()=>Forms.payment(id,t.odemeOnerisi)});
  pay.appendChild(icon('money'));pay.appendChild(document.createTextNode(FormVM.ADLAR.tahsilat));acts.appendChild(pay);
  const adj=h('button.btn.ghost.sm',{onclick:()=>Forms.adjustment(id)},'± '+FormVM.ADLAR.duzeltme);acts.appendChild(adj);
  const pk=h('button.btn.ghost.sm',{onclick:()=>Forms.sellPackage(id)});
  pk.appendChild(icon('gift'));pk.appendChild(document.createTextNode(FormVM.ADLAR.paketSat));acts.appendChild(pk);
  main.appendChild(acts);

  /* aktif paket durumu */
  const ap=t.aktifPaket;
  if(ap){
    const pcard=h('div.alert.'+ap.sinif,{style:'margin-bottom:14px'});
    const pico=h('div.ico');pico.appendChild(icon('gift'));pcard.appendChild(pico);
    const pbd=h('div',{style:'flex:1;min-width:0'});
    const pb2=h('b');pb2.textContent=ap.baslik;pbd.appendChild(pb2);
    const ps=h('small');ps.textContent=ap.alt;pbd.appendChild(ps);
    const track=h('div.progress-line',{style:'margin-top:6px;max-width:240px'});
    track.appendChild(h('i',{style:'width:'+ap.yuzde}));
    pbd.appendChild(track);
    pcard.appendChild(pbd);
    if(ap.yenile){
      const rn=h('button.btn.soft.sm.act',{onclick:()=>Forms.sellPackage(id,ap.paketId)},'Yenile');
      pcard.appendChild(rn);
    }
    main.appendChild(pcard);
  }

  /* istatistik şeridi */
  const stats=h('div.grid.cols-4.mb');
  const sc2=(lbl,val,cls)=>{const d=h('div.card.stat');
    const l=h('div.lbl');l.textContent=lbl;d.appendChild(l);
    const v=h('div.val'+(cls?'.'+cls:''));v.textContent=val;d.appendChild(v);return d};
  t.istatistik.forEach(x=>stats.appendChild(sc2(x.etiket,x.deger,x.sinif)));
  main.appendChild(stats);

  const grid=h('div.grid.cols-2');

    const row=h('div.row');
    const bd=h('div.body');const bb=h('b',{style:'font-weight:550;font-size:13px'});bb.textContent=en.etiket;bd.appendChild(bb);
    const ss=h('small');ss.textContent=en.tarih;bd.appendChild(ss);
    const end=h('div.end');const eb=h('b.money.'+en.sinif);
    eb.textContent=en.tutar;end.appendChild(eb);
    row.appendChild(bd);row.appendChild(end);acc.appendChild(row);
  });
  grid.appendChild(acc);

  /* seans geçmişi + gelecek */
  const hist=h('div.card');
  const hh=h('h3');hh.appendChild(icon('cal'));hh.appendChild(document.createTextNode('Seanslar'));hist.appendChild(hh);
  if(t.seanslar.bos){const e=h('div.empty');e.textContent='Henüz randevu yok';hist.appendChild(e)}
  t.seanslar.satirlar.forEach(a=>{
    const row=UI.tiklanir(h('div.row.click'),()=>Forms.apptActions(a.kayit));
    const bd=h('div.body');
    const bb=h('b',{style:'font-weight:550;font-size:13px'});bb.textContent=a.baslik;bd.appendChild(bb);
    if(a.not){const ss=h('small');ss.textContent=a.not;bd.appendChild(ss)}
    const stc=h('span.chip.'+a.cipSinif);
    stc.textContent=a.durum;
    row.appendChild(bd);row.appendChild(stc);
    hist.appendChild(row);
  });
  grid.appendChild(hist);
  main.appendChild(grid);

  if(t.not){
    const nc=h('div.card.mt');
    const nh=h('h3');nh.appendChild(icon('lock'));nh.appendChild(document.createTextNode('Not'));nc.appendChild(nh);
    const p=h('p',{style:'font-size:13.5px;color:var(--ink-2);white-space:pre-wrap'});p.textContent=t.not;nc.appendChild(p);
    main.appendChild(nc);
  }

  const danger=h('div.mt',{style:'text-align:right'});
  const del=h('button.btn.danger.sm',{onclick:()=>UI.confirm(t.silOnayi,()=>{const r=Islem.danisanSil(id);UI.go('clients');UI.toast(r.mesaj,'ok')})},'Danışanı sil');
  danger.appendChild(del);main.appendChild(danger);
}

/* Finans — iş geliri, ofis giderleri, kişisel (hesaplar FinansVM'de; burada yalnız çizim ve olay bağlama) */
function openMuhasebe(mk){
  const sheet=$('#printsheet');sheet.innerHTML='';
  const m=FinansVM.muhasebe(mk);

  const bar=h('div.no-print',{style:'display:flex;gap:10px;justify-content:flex-end;margin-bottom:18px'});
  bar.appendChild(h('button.btn.ghost',{onclick:()=>{sheet.classList.remove('open')}},'Kapat'));
  bar.appendChild(h('button.btn',{onclick:()=>window.print()},'Yazdır / PDF kaydet'));
  sheet.appendChild(bar);

  const head=h('div',{style:'border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:18px'});
  const t1=h('div',{style:'font-size:21px;font-weight:700'});t1.textContent=m.klinik;
  const t2=h('div',{style:'font-size:15px;margin-top:2px'});t2.textContent=m.baslik;
  head.appendChild(t1);head.appendChild(t2);sheet.appendChild(head);

  const tbl=(title,rows,total)=>{
    const w=h('div',{style:'margin-bottom:20px'});
    const tt=h('div',{style:'font-weight:700;font-size:14px;margin-bottom:6px'});tt.textContent=title;w.appendChild(tt);
    const t=h('table',{style:'width:100%;border-collapse:collapse;font-size:13px'});
    rows.forEach(([a,b])=>{
      const tr=h('tr');
      const td1=h('td',{style:'padding:5px 8px;border-bottom:1px solid #ddd'});td1.textContent=a;
      const td2=h('td',{style:'padding:5px 8px;border-bottom:1px solid #ddd;text-align:right;font-variant-numeric:tabular-nums'});td2.textContent=b;
      tr.appendChild(td1);tr.appendChild(td2);t.appendChild(tr);
    });
    const tr=h('tr');
    const td1=h('td',{style:'padding:6px 8px;font-weight:700'});td1.textContent='Toplam';
    const td2=h('td',{style:'padding:6px 8px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums'});td2.textContent=total;
    tr.appendChild(td1);tr.appendChild(td2);t.appendChild(tr);
    w.appendChild(t);return w;
  };
  sheet.appendChild(tbl(m.gelirler.baslik,m.gelirler.satirlar,m.gelirler.toplam));
  sheet.appendChild(tbl(m.giderler.baslik,m.giderler.satirlar,m.giderler.toplam));

  const net=h('div',{style:'border-top:2px solid #222;padding-top:10px;display:flex;justify-content:space-between;font-size:16px;font-weight:700'});
  const nl=h('span',{},'NET SONUÇ');
  const nv=h('span',{style:'font-variant-numeric:tabular-nums'});nv.textContent=m.net;
  net.appendChild(nl);net.appendChild(nv);sheet.appendChild(net);

  const meta=h('div',{style:'margin-top:18px;font-size:11.5px;color:#555;line-height:1.6'});
  meta.textContent=m.not;
  sheet.appendChild(meta);
  sheet.classList.add('open');
}
/* E4: «Para nereye gitti?» — «Her 100 ₺» listesi/paneli. Masaüstünde koyu panel (ilk 3 kategori görünür), telefonda açılır liste.
   Grup satırı düğme: dokununca TÜM kategoriler açılır (aria-expanded). Hesap FinansVM.akis'te. */
function akisYuz(a){
  const p=h('div.akis-yuz');
  const et=h('div.akis-yuz-et');et.textContent=a.panel.baslik;p.appendChild(et);
  const dn=h('div.akis-yuz-donem');dn.textContent=a.panel.ust;p.appendChild(dn);
  const yz=h('div.akis-yuz-100');yz.textContent='100 ₺';p.appendChild(yz);
  a.panel.satirlar.forEach(s=>{
    const g=h('div.akis-grup'+(s.not?'.not':''),{style:'--grup:'+s.renk});
    const acilir=s.kategoriler.length>0;
    const listeId='akis-kat-'+s.kod;
    const satir=acilir?h('button.akis-satir',{type:'button','aria-expanded':'false','aria-controls':listeId}):h('div.akis-satir');
    const ad=h('span.akis-sa-ad');ad.appendChild(document.createTextNode(s.ad));
    if(acilir)ad.appendChild(h('i.akis-ok',{'aria-hidden':'true'}));
    const oran=h('span.akis-sa-oran');
    const b=h('b');b.textContent=s.yuz+' ₺';const sm=h('small');sm.textContent=s.tutarMetni;
    oran.appendChild(b);oran.appendChild(sm);
    const cubuk=h('span.akis-cubuk',{'aria-hidden':'true'});cubuk.appendChild(h('i',{style:'width:'+Math.min(100,s.yuz)+'%'}));
    satir.appendChild(ad);satir.appendChild(oran);satir.appendChild(cubuk);
    g.appendChild(satir);
    if(acilir){
      const ul=h('ul.akis-kats',{id:listeId});
      s.kategoriler.forEach(k=>{
        const li=h('li.akis-kat');
        const kad=h('span');kad.textContent=k.ad;
        const de=h('span.akis-kat-de');
        const kb=h('b');kb.textContent=k.yuzMetni+' ₺';const ks=h('small');ks.textContent=k.tutarMetni;
        de.appendChild(kb);de.appendChild(ks);li.appendChild(kad);li.appendChild(de);ul.appendChild(li);
      });

/* ---- Cihaz ekleme daveti (D3b): düğme → Islem.davetUret → AyarVM.davetPenceresi (metin/kod/geçerlilik) → pencere ---- */
async function davetAc(dg,ev){
  const b=ev.currentTarget,eski=b.textContent;
  b.disabled=true;b.textContent=dg.bekleme;
  try{
    const r=await Islem.davetUret(dg.kim,{adres:location.origin+location.pathname});
    if(!r.ok)UI.toast(r.hata,'err');
    else{
      let qr=null;try{qr=Kurulum.qrUret(r.url)}catch(e){/* çok uzun veri → yalnız bağlantı kopyalanır */}
      davetPenceresi(AyarVM.davetPenceresi(dg.kim,r,{yerel:Kurulum.yerelAdresMi(location.protocol,location.hostname)}),qr);
    }
  }catch(e){UI.toast(String(e.message||e),'err')}
  b.disabled=false;b.textContent=eski;
}
/* p: AyarVM.davetPenceresi çıktısı · qr: Kurulum.qrUret çıktısı | null. QR'a YALNIZ bağlantı girer; kod ayrı kanalda (ekranda) gösterilir. */
function davetPenceresi(p,qr){
  return UI.modal(p.baslik,(m,close)=>{
    if(p.yerelUyari)m.appendChild(h('p.small.neg',{style:'margin-bottom:10px'},p.yerelUyari));
    if(qr)m.appendChild(h('div.davet-qr',{html:qr.svg}));
    else m.appendChild(h('p.small.neg',{style:'margin-bottom:10px'},p.qrYok));
    const adim=h('ol.davet-adimlar');
    p.adimlar.forEach(t=>adim.appendChild(h('li',{},t)));
    m.appendChild(adim);
    m.appendChild(h('div.davet-kod-etiket',{},p.kodEtiket));
    const kutu=h('div.davet-kod',{'aria-label':p.kodEtiket+': '+p.kod});
    p.gruplar.forEach(g=>kutu.appendChild(h('span.davet-kod-grup',{},g)));
    m.appendChild(kutu);
    m.appendChild(h('p.small.davet-gecerlilik',{},p.gecerlilik));
    m.appendChild(h('p.small.davet-kod-notu',{},p.kodNotu));
    const metinKutusu=h('textarea',{readonly:true,rows:4,style:'display:none;width:100%;font-size:11px;margin-bottom:10px'});
    metinKutusu.value=p.url;
    m.appendChild(metinKutusu);
    m.appendChild(h('button.btn.soft',{type:'button',onclick:async()=>{
      try{await navigator.clipboard.writeText(p.url);UI.toast(p.kopyalandi,'ok')}
      catch(e){metinKutusu.style.display='block';metinKutusu.select();UI.toast(p.kopyalanamadi)}
    }},p.kopyala));
    const acts=h('div.actions');acts.appendChild(h('button.btn.ghost',{onclick:close},p.kapat));m.appendChild(acts);
  });
}

  const ci=h('div.inner');
  /* hangi kutu görünür + başlangıç değeri: AyarVM. Kaydet YALNIZ görünen kutuların anahtarını gönderir (Ketty'de kişisel kutu yok → personalCategories'e dokunulmaz) */
  const kutular=AyarVM.kategoriAlanlari().map(a=>{

  if(gf2.tokenMetni){

  const acts=h('div.flex');
  acts.appendChild(h('button.btn',{onclick:async ev=>{
    const b=ev.currentTarget;b.disabled=true;b.textContent='Deneniyor…';
    const c={owner:owner.value.trim(),repo:repo.value.trim(),token:token.value.trim(),branch:'main',path:'data.json.enc'};
    const tb=Sync.tokenBitisAyikla(tokenBitis.value);if(tb)c.tokenBitis=tb; /* boşsa alan hiç yazılmaz */
    try{

  if(gf2.bagli)acts.appendChild(h('button.btn.soft',{onclick:()=>{

    UI.taslakDusur();UI.toast('Token bitiş tarihi kaydedildi','ok');UI.render();
  }},'Tarihi kaydet'));
  if(gf2.bagli)acts.appendChild(h('button.btn.ghost',{onclick:()=>{

  gii.appendChild(acts);
  /* cihaz ekleme (yalnız Sena'da görünür; karar AyarVM.cihazEkle) */
  const cihaz=AyarVM.cihazEkle();
  if(cihaz){
    const blok=h('div.ayar-blok');
    blok.appendChild(h('h3.ayar-blok-baslik',{},cihaz.baslik));
    blok.appendChild(h('p.small.ayar-blok-aciklama',{},cihaz.aciklama));
    const crow=h('div.flex',{style:'flex-wrap:wrap;gap:8px'});
    cihaz.dugmeler.forEach(dg=>crow.appendChild(h('button.btn.soft',{type:'button',disabled:!dg.aktif,onclick:ev=>davetAc(dg,ev)},dg.etiket)));
    blok.appendChild(crow);
    if(cihaz.neden)blok.appendChild(h('p.small.ayar-blok-neden',{},cihaz.neden));

  const bi=h('div.inner');
  const dl=(name,content,mime)=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type:mime}));
    a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  };
  const yd=AyarVM.yedekDurumu();
  const ydp=h('p.small'+(yd.hatirlat?'.neg':''),{style:'margin-bottom:10px'});
  ydp.textContent=yd.metin;bi.appendChild(ydp);
  const brow=h('div.flex',{style:'flex-wrap:wrap;gap:8px'});
  const indir=r=>dl(r.dosyaAdi,r.icerik,r.mime);
  brow.appendChild(h('button.btn.soft',{onclick:()=>{indir(AyarVM.jsonYedek());Islem.yedekAlindi()}},'JSON yedeği indir'));
  brow.appendChild(h('button.btn.soft',{onclick:()=>indir(AyarVM.finansCsv())},'Finans CSV (Excel)'));
  brow.appendChild(h('button.btn.soft',{onclick:()=>indir(AyarVM.danisanCsv())},'Danışan CSV (Excel)'));
  bi.appendChild(brow);
  /* E3: yedekten geri yükle — dosya seç → Islem.yedekDogrula → onay → Islem.yedekYukle */
  const dosyaSec=h('input',{type:'file',accept:'.json,application/json',style:'display:none',tabindex:'-1','aria-hidden':'true',
    onchange:async()=>{
      const f=dosyaSec.files&&dosyaSec.files[0];
      if(!f)return;
      let metin='';
      try{metin=await f.text()}catch(e){dosyaSec.value='';return UI.toast('Dosya okunamadı','err')}
      dosyaSec.value=''; /* aynı dosya yeniden seçilebilsin */
      const r=Islem.yedekDogrula(metin);
      if(!r.ok)return UI.toast(r.hata,'err');
      UI.onay('Yedekten geri yükle',AyarVM.yedekOnayMetni(r.ozet),'Evet, değiştir',async()=>{
        const y=await Islem.yedekGeriYukle(r.veri);
        if(!y.ok)return UI.toast(y.hata,'err');
        UI.toast(y.mesaj,'ok');UI.render();
      });
    }});
  bi.appendChild(dosyaSec);
  const geriRow=h('div.flex',{style:'flex-wrap:wrap;gap:8px;margin-top:8px'});
  geriRow.appendChild(h('button.btn.ghost',{onclick:()=>dosyaSec.click()},'Yedekten geri yükle'));
  bi.appendChild(geriRow);
  bk.appendChild(bi);main.appendChild(bk);

  /* --- örnek veri --- */
  const demo=bolumIzle('demo',h('details.acc',{open:AyarVM.bolumAcik('demo')}));
  const dsum=h('summary');dsum.appendChild(icon('heart'));dsum.appendChild(document.createTextNode('Deneme verisi'));demo.appendChild(dsum);
  const di=h('div.inner');
  di.appendChild(h('p',{style:'font-size:12.5px;color:var(--ink-2);margin-bottom:10px'},
    'Paneli boş sayfayla değil dolu haliyle görmek için 12 aylık örnek bir pratik yükleyebilirsiniz: 22 danışan, randevu geçmişi, borç–tahsilat akışı, seans paketleri, ofis ve kişisel giderler, bekleme listesi. Gerçek kullanıma geçerken tek tıkla silinir.'));
  const drow=h('div.flex');
  drow.appendChild(h('button.btn.soft',{onclick:()=>{const r=OrnekVeri.yukle();UI.toast(r.mesaj,'ok');UI.go('dash')}},'Örnek veri yükle'));
  drow.appendChild(h('button.btn.ghost',{onclick:()=>UI.confirm('Örnek olarak eklenen tüm kayıtlar silinsin mi?',()=>{const r=OrnekVeri.temizle();UI.toast(r.mesaj,'ok');UI.go('dash')})},'Örnekleri sil'));
  di.appendChild(drow);
  demo.appendChild(di);main.appendChild(demo);

  /* --- güvenlik --- */
  const sec=bolumIzle('guvenlik',h('details.acc',{open:AyarVM.bolumAcik('guvenlik')}));
  const ssum=h('summary');ssum.appendChild(icon('lock'));ssum.appendChild(document.createTextNode('Güvenlik'));sec.appendChild(ssum);
  const si=h('div.inner');
  const pb=AyarVM.parolaBolumu();
  si.appendChild(h('h3.ayar-blok-baslik',{},pb.baslik));
  si.appendChild(h('p',{style:'font-size:12.5px;color:var(--ink-2);margin-bottom:10px'},pb.aciklama));
  const np=UI.taslakBagla(UI.input({type:'password',placeholder:pb.yer,autocomplete:'new-password'}));
  si.appendChild(UI.field(pb.alan,np));
  si.appendChild(h('button.btn',{onclick:async()=>{
    const r=await Islem.parolaDegistir(np.value);
    if(!r.ok)return UI.toast(r.hata,'err');
    np.value='';UI.taslakBitti(np);UI.toast(r.mesaj,'ok');
  }},pb.dugme));
  /* yeni kurtarma kodu (yalnız Sena; karar AyarVM.yeniKurtarma) */
  const kt=AyarVM.yeniKurtarma();
  if(kt){
    const blok=h('div.ayar-blok');
    blok.appendChild(h('p.small.ayar-blok-aciklama',{},kt.aciklama));
    blok.appendChild(h('button.btn.soft',{type:'button',onclick:ev=>{
      const b=ev.currentTarget;
      UI.onay(kt.onay.baslik,kt.onay.mesaj,kt.onay.evet,async()=>{
        b.disabled=true;
        try{
          const r=await Islem.yeniKurtarmaKodu();
          if(!r.ok)UI.toast(r.hata,'err');
          /* D3a'nın kurtarma kodu kartı aynen; «Yazdım» → panoya (Ayarlar) dönüş. kurtarmaKoduGosterildi ÇAĞRILMAZ (yalnız ilk kurulumun işi). */
          else App.kurtarmaKarti(r.kod,()=>App.panoyaDon());
        }catch(e){UI.toast(String(e.message||e),'err')}
        b.disabled=false;
      });
    }},kt.etiket));
    si.appendChild(blok);
  }
  si.appendChild(h('div.mt'));
  si.appendChild(h('button.btn.ghost',{onclick:()=>{App.switchUser()}},'Kullanıcı değiştir / kilitle'));
  sec.appendChild(si);main.appendChild(sec);

  main.appendChild(ver);

/* ==== app.js ==== */
/* Uygulama başlatma + giriş kapısı */
const App={

  async boot(){
    UI.kur(); /* Esc / Tab döngüsü / geri tuşu dinleyicileri + bildirim bölgesi (K2) */
    Sync.init();
    Store.onChange(()=>{ if($('#app').classList.contains('ready')) UI.veriDegisti() });
    this.davet=this.davetAl(); /* davet bağlantısı (D3a) ya da null: kayıtlı kullanıcı olsa bile ÖNCE davet sorulur (bu cihazda bitmiş davet hariç) */
    /* panel bir sekmede AÇIKKEN davet bağlantısı aynı sekmede açılırsa sayfa yeniden yüklenmez (yalnız #parça değişir) — masa 10-14 */
    window.addEventListener('hashchange',()=>{
      const d=this.davetAl();
      if(d&&d!==this.davet){this.davet=d;this.gateDavet()}
    });
    if(this.davet)return this.gateDavet();
    return this.acilis();
  },
  /* normal açılış: kayıtlı parola varsa sessizce aç, yoksa kilit ekranı */
  async acilis(){
    const savedPass=localStorage.getItem(LS.pass);
    const savedUser=localStorage.getItem(LS.user);
    if(savedPass&&savedUser){
      const ok=await this.unlock(savedUser,savedPass,true);
      if(ok)return;
    }
    this.gate();
  },

  gate(prefUser){
    const gate=$('#gate');gate.innerHTML='';gate.style.display='flex';
    $('#app').classList.remove('ready');
    const card=h('div.gate-card');
    card.appendChild(h('div.logo',{},'S'));
    const t=h('h1');t.textContent='Sena Panel';card.appendChild(t);
    const sub=h('div.sub');sub.textContent='Danışan, randevu ve finans yönetimi';card.appendChild(sub);

    const err=h('div.gate-err',{role:'alert'});card.appendChild(err);
    const showErr=m=>{err.textContent=m;err.style.display='block'};

    /* kim? */
    let who=prefUser||localStorage.getItem(LS.user)||'Sena';
    const whoWrap=h('div.who');
    const names=['Sena','Ketty'];
    if(!names.includes(who))names.push(who);
    const unuttumAlani=h('div.gate-unuttum'); /* «Parolamı unuttum» bağlantısı ya da Ketty notu: karar KilitVM'de, kullanıcı değişince yeniden çizilir */
    let unuttumCiz=()=>{};
    const mkWho=name=>{
      const b=h('button',{type:'button',class:who===name?'on':'','aria-pressed':who===name?'true':'false'});
      const av=h('div.av');av.style.background=avColor(name);av.textContent=initials(name);
      b.appendChild(av);b.appendChild(document.createTextNode(name));
      b.addEventListener('click',()=>{who=name;$$('button',whoWrap).forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false')});b.classList.add('on');b.setAttribute('aria-pressed','true');unuttumCiz()});
      return b;
    };
    names.forEach(n=>whoWrap.appendChild(mkWho(n)));
    card.appendChild(whoWrap);

    const hasCache=!!localStorage.getItem(LS.cache);
    const yeniParola=!hasCache;
    /* kartın metinleri ve kullanıcıya bağlı kararlar (parola etiketi/ipucu · elle bağlantı bölümü · unuttum/Ketty notu): KilitVM */
    const kartDurum=()=>KilitVM.durum({mod:'normal',kullanici:who,veriVar:hasCache||!!Sync.cfg,onbellek:hasCache});
    const pd=kartDurum().parola;
    const pass=UI.input({type:'password',placeholder:pd.yer,
      autocomplete:yeniParola?'new-password':'current-password'});
    card.appendChild(UI.field(pd.etiket,pass,pd.ipucu));
    /* Q11 — YALNIZ yeni veri başlatılırken: parola tekrarı + göster/gizle + unutma uyarısı. Kayıtlı veriyi açarken,
       GitHub'daki mevcut veriye bağlanırken (Sync.cfg / aşağıdaki elle bilgi) GÖRÜNMEZ/uygulanmaz. */
    const yeniVeri=yeniParola&&!Sync.cfg;
    let pass2=null;
    if(yeniVeri){
      pass2=UI.input({type:'password',placeholder:'Parolayı tekrar yazın',autocomplete:'new-password'});
      card.appendChild(UI.field('Parolayı tekrar yazın',pass2));
      const goster=h('button.btn.ghost.sm.gate-goster',{type:'button','aria-pressed':'false',style:'margin:0 0 12px'},'Parolayı göster');
      goster.addEventListener('click',()=>{
        const aciyor=goster.getAttribute('aria-pressed')!=='true';
        goster.setAttribute('aria-pressed',aciyor?'true':'false');
        goster.textContent=aciyor?'Parolayı gizle':'Parolayı göster';
        pass.type=pass2.type=aciyor?'text':'password';
      });
      card.appendChild(goster);
      card.appendChild(h('div.gate-note',{style:'margin:0 0 12px;color:var(--ink-2);font-weight:600'},
        KilitVM.M.normal.yeniVeriNotu)); /* masa 10-14: eski «unutursanız açılamaz» notu kurtarma kodu varken yanıltıcıydı */
    }

    /* elle bağlantı (davet yerine): bölümün görünmesi ve metni KilitVM'den (Sena'ya özel); kullanıcı değişince kartCiz günceller */
    const adv=h('details.gate-elle',{style:'margin:4px 0 12px'});
    const advSum=h('summary',{style:'font-size:12.5px;color:var(--brand);font-weight:600;cursor:pointer'});
    const advNot=h('div.gate-note',{style:'margin:0 0 10px;text-align:left'});
    adv.appendChild(advSum);adv.appendChild(advNot);
    let elleAcik=false;
    const owner=UI.input({placeholder:'GitHub kullanıcı adı'});
    const repo=UI.input({placeholder:'Veri repo adı (örn. sena-veri)'});
    const token=UI.input({placeholder:'Erişim anahtarı (github_pat_…)',type:'password'});
    [['GitHub kullanıcı',owner],['Repo',repo],['Anahtar',token]].forEach(([l,i2])=>adv.appendChild(UI.field(l,i2)));
    card.appendChild(adv);

    const goEtiket=hasCache?'Kilidi aç':'Başla';
    const go=h('button.btn',{style:'width:100%;padding:12px'},goEtiket);
    go.addEventListener('click',async()=>{
      const p=pass.value;
      /* ≥8 + tekrar kuralı yalnız YENİ veri başlatılırken; elle GitHub bilgisi girildiyse mevcut veriye bağlanılıyordur */
      const githubDolu=elleAcik&&!!(owner.value.trim()&&repo.value.trim()&&token.value.trim());
      const kural=Islem.parolaKontrol(p,pass2?pass2.value:undefined,yeniVeri&&!githubDolu);
      if(!kural.ok)return showErr(kural.hata);
      go.disabled=true;go.textContent='Açılıyor…';
      /* isteğe bağlı GitHub bilgisi girildiyse kaydet */
      if(githubDolu){
        const c={owner:owner.value.trim(),repo:repo.value.trim(),token:token.value.trim(),branch:'main',path:'data.json.enc'};
        try{await Sync.baglan(c)}
        catch(e){showErr(String(e.message||e));go.disabled=false;go.textContent=goEtiket;return}
      }
      const ok=await this.unlock(who,p,false);
      if(!ok){go.disabled=false;go.textContent=goEtiket}
    });
    card.appendChild(go);
    unuttumCiz=()=>{
      const d=kartDurum();
      elleAcik=!!d.elleBaglanti;adv.style.display=elleAcik?'':'none';
      if(d.elleBaglanti){advSum.textContent=d.elleBaglanti.etiket;advNot.textContent=d.elleBaglanti.not}
      unuttumAlani.innerHTML='';
      if(d.baglanti){
        const b=h('button.btn.ghost.sm.gate-unuttum-btn',{type:'button'},d.baglanti.etiket);
        b.addEventListener('click',()=>this.gateUnuttum(who));
        unuttumAlani.appendChild(b);
      }
      if(d.not)unuttumAlani.appendChild(h('div.gate-note.gate-ketty-not',{},d.not));
    };
    unuttumCiz();
    card.appendChild(unuttumAlani);
    pass.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
    if(pass2)pass2.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});

    const note=h('div.gate-note');
    note.textContent='Veriler cihazdan çıkmadan şifrelenir; parola hiçbir sunucuya gönderilmez. 🔒';
    card.appendChild(note);
    gate.appendChild(card);
    setTimeout(()=>pass.focus(),150);
  },

  /* kilit açma: karar mantığı Store.kilitAc'te (önbellek · uzaktan çekme · ilk kurulum · v1 dönüşümü); burada yalnız hata gösterimi + ekran geçişi */
  async unlock(user,pass,silent){
    const r=await Store.kilitAc(user,pass);
    if(!r.ok){
      if(silent)this.gate(user);
      else{const err=$('.gate-err');if(err){err.textContent=r.hata;err.style.display='block'}}
      return false;
    }
    /* cihaza yazma (kullanıcı · parola · önbellek) kurtarma kodu kartı KAPANINCAYA kadar ertelenir: kart açıkken sekme kapanırsa
       kod görülmemiş sayılır, yeniden açılışta yeni kurulum yeni kodu GÖSTERİR (kayıtlı kasa kodsuz kalmaz) */
    await this.girisBitir(async()=>{
      localStorage.setItem(LS.user,user);
      localStorage.setItem(LS.pass,pass);
      await Store.saveLocal();
    });
    return true;
  },

  /* giriş başarılı (kilit açıldı ya da davet/kurtarma komutu bitti): bekleyen kurtarma kodu varsa ÖNCE kart, sonra pano.
     yaz: cihaza yazma adımı (kart kapandıktan sonra); bildirim: pano açılınca kısa toast (komutların kendi mesajı) */
  async girisBitir(yaz,bildirim){
    const kod=Store.bekleyenKurtarmaKodu;
    if(kod){
      await new Promise(devam=>this.kurtarmaKarti(kod,devam));
      Islem.kurtarmaKoduGosterildi();
    }
    if(yaz)await yaz();
    this.panoAc();
    if(bildirim)UI.toast(bildirim,'ok');
  },
  panoAc(){
    $('#gate').style.display='none';
    $('#app').classList.add('ready');
    UI.shell();UI.render();
    if(Sync.cfg)Sync.pull();
  },
  /* kurtarma kodu kartı Ayarlar'dan açıldıysa («Yeni kurtarma kodu üret») «Yazdım» sonrası: kartı kapat, açık ekrana dön (kabuk yeniden kurulmaz) */
  panoyaDon(){
    $('#gate').style.display='none';
    $('#app').classList.add('ready');
    UI.render();
  },

  /* ---- kilit ekranı: yeni modlar (D3a). Mod/alan/metin kararı KilitVM'de; burada yalnız çizim + olayı Islem'e iletme ---- */
  kilitCerceve(baslik,alt){
    const gate=$('#gate');gate.innerHTML='';gate.style.display='flex';
    $('#app').classList.remove('ready');
    const card=h('div.gate-card');
    card.appendChild(h('div.logo',{},'S'));
    const t=h('h1');t.textContent=baslik;card.appendChild(t);
    if(alt){const sub=h('div.sub');sub.textContent=alt;card.appendChild(sub)}
    const err=h('div.gate-err',{role:'alert'});card.appendChild(err);
    gate.appendChild(card);
    return {card,err,baslik:t};
  },
  /* VM'in düz durumunu form olarak çizer. gonder(değerler) → Islem sonucu {ok,hata,alan?}; ok ise ekranı kendisi değiştirir.
     Hata VM.hata() ile alanın altına ya da kart satırına düşer. */
  formEkrani(d,gonder,ikincil){
    const {card,err}=this.kilitCerceve(d.baslik,d.alt);
    const girdi={},alanErr={};
    const hataTemizle=()=>{
      err.style.display='none';err.textContent='';
      Object.keys(alanErr).forEach(ad=>{alanErr[ad].style.display='none';alanErr[ad].textContent='';girdi[ad].removeAttribute('aria-invalid')});
    };
    d.alanlar.forEach(a=>{
      const at={type:a.tur,autocomplete:a.autocomplete};
      if(a.yer)at.placeholder=a.yer;
      if(a.sinif)at.class=a.sinif;
      if(a.autocapitalize)at.autocapitalize=a.autocapitalize;
      if(a.spellcheck)at.spellcheck=a.spellcheck;
      const inp=UI.input(at);girdi[a.ad]=inp;
      const f=UI.field(a.etiket,inp,a.ipucu);
      const e=h('div.gate-alan-err',{role:'alert',id:'gate-hata-'+a.ad});e.style.display='none';
      f.appendChild(e);alanErr[a.ad]=e;
      card.appendChild(f);
    });
    if(d.goster){
      const goster=h('button.btn.ghost.sm.gate-goster',{type:'button','aria-pressed':'false',style:'margin:0 0 12px'},'Parolayı göster');
      goster.addEventListener('click',()=>{
        const aciyor=goster.getAttribute('aria-pressed')!=='true';
        goster.setAttribute('aria-pressed',aciyor?'true':'false');
        goster.textContent=aciyor?'Parolayı gizle':'Parolayı göster';
        d.alanlar.forEach(a=>{if(a.tur==='password')girdi[a.ad].type=aciyor?'text':'password'});
      });
      card.appendChild(goster);
    }
    if(d.not)card.appendChild(h('div.gate-note',{style:'margin:0 0 12px;color:var(--ink-2);font-weight:600'},d.not));
    let dugme=null;
    const yolla=async()=>{
      hataTemizle();
      dugme.disabled=true;dugme.textContent=d.birincil.bekleme;
      const deger={};d.alanlar.forEach(a=>{deger[a.ad]=girdi[a.ad].value});
      let r;
      try{r=await gonder(deger)}catch(e){r={ok:false,hata:String(e&&e.message||e)}}
      if(r&&r.ok)return;
      const k=KilitVM.hata(d,r);
      if(k.alan){
        const e=alanErr[k.alan];e.textContent=k.metin;e.style.display='block';
        girdi[k.alan].setAttribute('aria-invalid','true');girdi[k.alan].setAttribute('aria-describedby',e.id);
        girdi[k.alan].focus();
      }else{err.textContent=k.metin;err.style.display='block'}
      dugme.disabled=false;dugme.textContent=d.birincil.etiket;
    };
    if(d.birincil){
      dugme=h('button.btn.gate-ana',{type:'button',style:'width:100%;padding:12px'},d.birincil.etiket);
      dugme.addEventListener('click',yolla);
      card.appendChild(dugme);
      const son=d.alanlar[d.alanlar.length-1];
      if(son)girdi[son.ad].addEventListener('keydown',e=>{if(e.key==='Enter')dugme.click()});
    }
    if(d.ikincil){
      const b=h('button.btn.ghost.gate-ikincil',{type:'button',style:'width:100%;margin-top:8px'},d.ikincil.etiket);
      b.addEventListener('click',ikincil);
      card.appendChild(b);
    }
    const ilk=d.odak&&girdi[d.odak];
    if(ilk)setTimeout(()=>ilk.focus(),50);
    return {card,err,girdi,alanErr,dugme};
  },

  /* «Parolamı unuttum» (yalnız Sena) */
  gateUnuttum(kullanici){
    const d=KilitVM.durum({mod:'unuttum',kullanici});
    this.formEkrani(d,async v=>{
      const r=await Islem.kurtarmaIleSifirla(v.kod,v.parola,v.tekrar);
      if(!r.ok)return r;
      await this.girisBitir(null,r.mesaj);
      return {ok:true};
    },()=>this.gate(kullanici));
  },

  /* kurtarma kodu kartı: tek sefer; «Yazdım, devam» → devam() */
  kurtarmaKarti(kod,devam){
    const k=KilitVM.kurtarmaKarti(kod);
    const {card}=this.kilitCerceve(k.baslik,'');
    const kutu=h('div.gate-kod-kutu',{'aria-label':k.baslik+': '+k.kod});
    k.gruplar.forEach(g=>kutu.appendChild(h('span.gate-kod-grup',{},g)));
    card.appendChild(kutu);
    card.appendChild(h('p.gate-kod-aciklama',{},k.aciklama));
    const kopya=h('button.btn.ghost.gate-kopyala',{type:'button',style:'width:100%;margin-bottom:8px'},k.kopyala);
    kopya.addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(k.kod);kopya.textContent=k.kopyalandi}
      catch(e){ /* pano izni yok: metin zaten seçilebilir (user-select:all) */ }
    });
    card.appendChild(kopya);
    const tamam=h('button.btn.gate-ana',{type:'button',style:'width:100%;padding:12px'},k.dugme);
    tamam.addEventListener('click',()=>{tamam.disabled=true;devam()});
    card.appendChild(tamam);
    setTimeout(()=>tamam.focus(),50);
  },

  /* ---- davet kabulü (#davet=) ---- */
  davet:null, /* şifreli '#davet=' parçası; kabul / vazgeç ile null */
  /* adresteki davet; bu cihazda bitmişse adres temizlenir ve null (iPhone ana ekran simgesi — masa 10-22) */
  davetAl(){
    const d=Kurulum.davetParcasi(location.hash);
    if(d&&Kurulum.davetBittiMi(d)){history.replaceState(null,'',location.pathname+location.search);return null}
    return d;
  },
  davetTemizle(){
    history.replaceState(null,'',location.pathname+location.search);
    this.davet=null;
  },
  davetVazgec(){
    if(localStorage.getItem(LS.cache))Kurulum.davetBittiIsaretle(this.davet); /* kurulu cihazda geçilen davet bir daha sorulmaz; boş cihazda sorulur */
    this.davetTemizle();
    return this.acilis();
  },
  gateDavet(){
    const d=KilitVM.durum({mod:'davet-kod'});
    this.formEkrani(d,async v=>{
      const r=await Islem.davetOnizle(this.davet,v.kod);
      if(!r.ok)return r;
      this.davetParola(v.kod,r.kullanici);
      return {ok:true};
    },()=>this.davetVazgec());
  },
  davetParola(kod,kullanici){
    const d=KilitVM.durum({mod:'davet-parola',kullanici});
    this.formEkrani(d,async v=>{
      const r=await Islem.davetKabul(this.davet,kod,{parola:v.parola,tekrar:v.tekrar});
      if(!r.ok)return r;
      Kurulum.davetBittiIsaretle(this.davet);
      this.davetTemizle();
      await this.girisBitir(null,r.mesaj);
      return {ok:true};
    },()=>this.davetVazgec());
  },

  switchUser(){
    this.gate();
  }
};

/* E3: kayıtlı görünüm, betik yüklenirken hemen uygulanır (kilit ekranı dahil; DOMContentLoaded'ı BEKLEMEZ → ilk çizimde yanıp sönme olmaz) */
Tema.uygula(Tema.oku());
document.addEventListener('DOMContentLoaded',()=>App.boot());
/* Android: yayındaki adreste (https) boş yardımcıyı kaydet → ana ekrana UYGULAMA olarak eklenir (yayin/sw.js; dosyadan/yerelden açılınca kaydedilmez) */
if(location.protocol==='https:'&&typeof navigator!=='undefined'&&navigator.serviceWorker)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body></html>
