    if(!this.cfg||!Store.pass)return false;
    try{
      this.setState('busy');
      const hdr={};if(this.etag&&Store.data)hdr['If-None-Match']=this.etag; // veri yüklüyse koşullu iste
      const res=await this.api(this.filePath()+'?ref='+(this.cfg.branch||'main'),{cache:'no-store',headers:hdr});
      this.basliktanBitis(res);
      if(res.status===304){this.lastSyncAt=Date.now();this.setState('ok');return false} // değişmedi: indirme/çözme yok
      if(res.status===404){this.setState('ok');return false} // henüz dosya yok
      if(!res.ok)throw await this.httpHatasi(res);
      const etag=res.headers.get('ETag');
      const js=await res.json();
      const newSha=js.sha;
      if(newSha===this.sha&&Store.data){this.saveEtag(etag);this.lastSyncAt=Date.now();this.setState('ok');return false} // veri yokken kısa yol yok (sha aynı diye boş kalmasın)
      const text=await this._icerikMetni(js,this.cfg); // 1 MB üstü: Contents API içeriği vermez → blob uç noktası (içeride)
      let uz; // uzak zarf açılımı {surum, veri, kasa|null, kurtarmaKodu}
      try{uz=await Store.uzakAc(text)}
      catch(e){
        const m=String(e&&e.message||'');
        this.setState('err',m===Store.PAROLA_HATASI?'parola uyuşmuyor':m||'parola uyuşmuyor');
        return false;
      }
      const before=Store.data;
      Store.data=Store.merge(uz.veri);
      Store.kasaUzlastir(uz,text); // anahtarlar birleşir / farklı K_ortak'ta uzak kasa esas / Ketty'de ozelGecis tazelenir
      if(uz.surum===1)Store.kirliIsaretle(); // uzak hâlâ v1: bu cihaz v2 olarak yeniden göndersin (çekme sonrası schedule)
      if(before){const tx=this.changeText(this.changeSummary(before,Store.data),Store.user);if(tx)UI.toast(tx)} // ilk yüklemede bildirim yok
      this.sha=newSha;localStorage.setItem(LS.sha,newSha);
      this.saveEtag(etag); // yalnız çözme+birleştirme başarılıysa
      await Store.saveLocal();
      Store.emit();
      this.lastSyncAt=Date.now();
      this.setState('ok');
      return true;
    }catch(e){console.warn('pull',e);this.setState(navigator.onLine?'err':'off',String(e.message||''));return false}
  },

  /* Contents API yanıtı → zarf metni (1 MB üstü: içerik gelmez → blob uç noktası). _pull ve uzakMetin ortak kullanır. */
  async _icerikMetni(js,cfg){
    let b64=js.content;
    if(js.encoding==='none'||(!b64&&js.size>0)){
      const rb=await this.api('/repos/'+cfg.owner+'/'+cfg.repo+'/git/blobs/'+js.sha,{cache:'no-store'},cfg);
      if(!rb.ok)throw await this.httpHatasi(rb);
      b64=(await rb.json()).content;
    }
    return this.b64Metin(b64);
  },
  /* D2b: uzak zarfın HAM metni — sha/ETag/durum/önbelleğe DOKUNMAZ (davet kabulü ve kurtarma, çözmeden önce uzağa bakar).
     cfg verilmezse this.cfg. → {metin, sha} | null (dosya henüz yok, 404). Hata: Error (token · HTTP n · ağ). */
  async uzakMetin(cfg){
    cfg=cfg||this.cfg;
    if(!cfg)throw new Error('GitHub bağlı değil');
    const res=await this.api(this.filePath(cfg)+'?ref='+(cfg.branch||'main'),{cache:'no-store'},cfg);
    if(res.status===404)return null;
    if(!res.ok)throw await this.httpHatasi(res);
    const js=await res.json();
    return {metin:await this._icerikMetni(js,cfg),sha:js.sha};
  },
  /* bilinen uzak sürümü yaz (uzakMetin'den okunan ve yerel veriye BİRLEŞMİŞ olan sha): sonraki PUT bu sha'yla gider, 422/çekme turu gerekmez */
  shaYaz(sha){this.sha=sha||null;if(sha)localStorage.setItem(LS.sha,sha);else localStorage.removeItem(LS.sha)},

  push(){return this.run(()=>this._push())}, // kuyruktan geçer
  async _push(){
    if(!this.cfg||!Store.pass||!Store.data)return;
    try{
      for(let deneme=1;deneme<=3;deneme++){ // çakışmada en fazla 3 deneme (PUT)
        this.setState('busy');
        const rev=Store.rev; // şifrelenen sürüm: sonradan düzenleme gelirse dirty silinmez
        const env=await Store.zarfla();
        const bytes=new TextEncoder().encode(env);
        let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
        const body={message:(deneme>1?'birleştirme · ':'güncelleme · ')+(Store.user||'panel')+' · '+new Date().toLocaleString('tr-TR'),
          content:btoa(bin),branch:this.cfg.branch||'main'};
        if(this.sha)body.sha=this.sha;
        const res=await this.api(this.filePath(),{method:'PUT',body:JSON.stringify(body)});
        this.basliktanBitis(res);
        if(res.status===409||res.status===422){
          if(deneme===3){this.setState('err','çakışma, tekrar denenecek');return} // dirty true KALIR; sonraki kontrolde yeniden gönderilir
          // çakışma: uzaktakini çek, birleştir, yeniden şifrele + yeniden PUT
          this.resetRemote();
          await this._pull(); // kuyruğun İÇİNDEYİZ: iç çekme doğrudan (kendini beklemesin)
          if(this.state==='err')return; // çekilemedi (ağ/parola): hatayı rozette bırak
          continue;
        }
        if(!res.ok)throw await this.httpHatasi(res);
        const js=await res.json();this.sha=js.content.sha;
        localStorage.setItem(LS.sha,this.sha);
        if(Store.rev===rev){Store.dirty=false;try{localStorage.removeItem(LS.dirty)}catch(e){}} // araya düzenleme girdiyse dirty kalır, schedule() yeniden gönderir
        this.lastSyncAt=Date.now();
        this.setState('ok');
        return;
      }
    }catch(e){console.warn('push',e);this.setState(navigator.onLine?'err':'off',String(e.message||''))}
  },

  /* rozete dokununca: bekleyen yerel değişiklik varsa önce gönder, sonra çek */
  async now(){
    if(!this.cfg||!Store.pass||this.nowBusy)return false;
    this.nowBusy=true;
    try{
      if(Store.dirty){clearTimeout(this.timer);await this.push();if(Store.dirty)return false} // gönderilemediyse hata rozette kalsın
      if(this.pullP)await this.pullP;
      await this.pull();
      if(this.state!=='ok')return false;
      UI.toast('Eşitlendi ✓','ok');return true;
    }finally{this.nowBusy=false}
  },

  async testConfig(cfg){
    const res=await fetch('https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo,{
      headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}});
    if(res.status===401)throw new Error(this.TOKEN_MESAJI);
    if(!res.ok)throw new Error(res.status===404?'Repo bulunamadı (adı ve token yetkisini kontrol edin)':'Bağlantı hatası: HTTP '+res.status);
    return true;
  },

  /* GitHub'a bağlan (V-S4 ayarlar · V-A2 kilit ekranı): testConfig → LS.cfg yaz → uzak izi sıfırla → init.
     testConfig hata atarsa AYNI hata yükselir ve LS.cfg'ye hiçbir şey YAZILMAZ. c: {owner,repo,token,branch,path} */
  async baglan(c){
    await this.testConfig(c);
    localStorage.setItem(LS.cfg,JSON.stringify(c));
    this.resetRemote();
    this.init();
  },
  /* Ayarlar > "Bağlan ve eşitle" (V-S4): baglan + ilk eşitleme — uzakta veri yoksa (pull false) yereldeki veri yüklenir. */
  async baglanVeEsitle(c){
    await this.baglan(c);
    const pulled=await this.pull();
    if(!pulled)await this.push();
  },
  /* Bağlantıyı kes (V-S5): LS.cfg silinir, uzak iz sıfırlanır, Sync.cfg=null; veriler cihazda kalır. */
  baglantiKes(){
    localStorage.removeItem(LS.cfg);
    this.resetRemote();
    this.cfg=null;
    this.init();
  }
};

/* ==== kurulum.js ==== */
/* Yeni cihaz kurulumu — davet bağlantısı + QR: GitHub bağlantı bilgisi DAVET KODUYLA şifrelenir (Kasa.davetPaketle), adresin '#davet=' parçasına konur.
   Parça (#) sunucuya gitmez. Panel QR'ı yalnız ÜRETİR; telefon kamerası okur. Model `location`/DOM'a dokunmaz: adres dışarıdan gelir.
   (Eski QR bağlantı biçimi D3b'de kaldırıldı: panel teslim edilmeden önce hiçbir yerde üretilmemişti.) */
const Kurulum={
  ALANLAR:['owner','repo','token','branch','path'],

  /* ---- Davet (D2b): '#davet=<şifreli>' — Kasa.davetPaketle çıktısı (davet koduyla şifreli) ---- */
  DAVET_ONEK:'#davet=',
  /* şifreli davet → '<adres>#davet=<şifreli>' (adres dışarıdan; varsa kendi #parçası atılır) */
  davetBaglantisi(sifreli,adres){
    if(!sifreli)throw new Error('Davet metni boş');
    return String(adres||'').split('#')[0]+this.DAVET_ONEK+encodeURIComponent(sifreli);
  },
  /* location.hash → şifreli davet metni; '#davet=' yoksa / boşsa / çözülemezse null (saf) */
  davetParcasi(hash){
    const h=String(hash==null?'':hash);
    if(!h.startsWith(this.DAVET_ONEK))return null;
    const ham=h.slice(this.DAVET_ONEK.length);
    if(!ham)return null;
    try{return decodeURIComponent(ham)}catch(e){return null}
  },

  /* Biten davet (masa 10-22): iPhone ana ekran simgesi açılış adresini '#davet=…' ile saklar → her açılışta davet sorulmasın.
     Kabul edilen davet (ve kurulu cihazda geçilen davet) bu cihazda «bitti» sayılır; yeni bir davet yine sorulur. */
  /* davet parçası → kısa özet (FNV-1a 32 bit, onaltılık; saf) */
  davetOzeti(parca){
    let h=0x811c9dc5;
    for(const c of String(parca)){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}
    return h.toString(16);
  },
  davetBittiMi(parca){
    try{return (localStorage.getItem(LS.davetBitti)||'').split(',').includes(this.davetOzeti(parca))}catch(e){return false}
  },
  davetBittiIsaretle(parca){
    try{
      const l=(localStorage.getItem(LS.davetBitti)||'').split(',').filter(Boolean),o=this.davetOzeti(parca);
      if(!l.includes(o))l.push(o);
      localStorage.setItem(LS.davetBitti,l.slice(-20).join(','));
    }catch(e){}
  },

  /* file:// ya da localhost'ta üretilen adres başka cihazda açılmaz (saf) */
  yerelAdresMi(protocol,hostname){
    return protocol==='file:'||hostname==='localhost'||hostname==='127.0.0.1'||hostname==='[::1]'||hostname==='';
  },

  /* URL → {svg, modul, surum}. Hata düzeltme 'M', sürüm otomatik. Veri sığmazsa qrcode hata fırlatır. */
  qrUret(url){
    const q=qrcode(0,'M');
    q.addData(url);q.make();
    const modul=q.getModuleCount();
    return {svg:q.createSvgTag({cellSize:4,margin:16,scalable:true}),modul,surum:(modul-17)/4};
  }
};
/* ==== islemler.js ==== */
/* İş kuralları katmanı — formların doğrulama, alan dönüştürme ve "hangi kayıt nasıl yazılır" kuralları.
   DOM'a, UI.*'ya, close()'a DOKUNMAZ; yalnız Store'a yazar.
   Girdi: düz nesne, alanların HAM değerleri (input'tan gelen string'ler; Number('')||0 gibi dönüştürmeler burada).
   Dönüş: başarıda {ok:true, mesaj, kayit, ...} · hatada {ok:false, hata, alan?}.
   `mesaj` = view'ın göstereceği başarı toast metni (silmeler dahil — K3.6); yalnız bekleme listesi KAYDINDA `mesaj` YOKTUR.
   `alan` (K3.5) = hatalı girdinin g'deki adı ('name' · 'clientId' · 'amount' · 'sessions' · 'price' · 'yeniAd');
   view `UI.formHatasi` ile o alana odaklar. Onay (UI.confirm), toast tipi, kapatma, render view'ın işidir. */
const Islem={

  /* ---------- danışan (V-F1) ---------- */
  /* Hatırlatmalar > «Ulaşıldı» (Gökhan 10-22): kim, hangi gün ulaştı — iki kişi aynı danışana yazmasın; eşitlenir */
  ulasildiIsaretle(id,bugun){
    if(!Store.find('clients',id))return {ok:false,hata:'Danışan bulunamadı'};
    Store.update('clients',id,{ulasildi:{tarih:bugun||todayStr(),kim:Store.user}});
    return {ok:true,mesaj:'Ulaşıldı olarak işaretlendi'};
  },
  /* g: {name,phone,phone2,fee,birthDate,source,status,notes} (phone2: isteğe bağlı ikinci numara — Sena 10-22) · mevcutId: düzenlenen danışanın id'si (yoksa yeni) */
  danisanKaydet(g,mevcutId){
    if(!(g.name||'').trim())return {ok:false,hata:'Ad soyad gerekli',alan:'name'};
    const rec={name:g.name.trim(),phone:(g.phone||'').trim(),phone2:(g.phone2||'').trim(),fee:Number(g.fee)||0,
      birthDate:g.birthDate,source:g.source,status:g.status,notes:g.notes};
    const kayit=mevcutId?Store.update('clients',mevcutId,rec):Store.add('clients',rec);
    return {ok:true,mesaj:mevcutId?'Danışan güncellendi':'Danışan eklendi',kayit};
  },

  /* ---------- randevu (V-F2, V-F3, V-F4, V-F5) ---------- */
  /* g: {clientId,date,time,fee,note,status, tekrar,tekrarSayisi, yeniDanisan, ucretsiz}
     ucretsiz: true → ücret 0 + kayıtta ucretsiz:true (bilerek ücretsiz; paketten düşmez — Sena 10-27)
     yeniDanisan: null | {name,phone} ("Listede yok mu?" kutusu açıkken) · tekrar/tekrarSayisi yalnız yeni randevuda okunur */
  randevuKaydet(g,mevcutId){
    const S=Store.data.settings;
    const hata=Islem.randevuDogrula(g);if(hata)return hata;
    let yeniDanisan=null,savedRec=null;const kayitlar=[];
    const yaz=()=>{
      let cid=g.clientId;
      if(g.yeniDanisan){
        yeniDanisan=Store.add('clients',{name:g.yeniDanisan.name.trim(),phone:(g.yeniDanisan.phone||'').trim(),
          fee:g.fee!==''?Number(g.fee):S.defaultFee,status:'aktif',birthDate:'',source:'',notes:''});
        cid=yeniDanisan.id;
      }
      const c=Store.find('clients',cid);
      const f=g.ucretsiz?0:g.fee!==''?Number(g.fee):(c.fee||S.defaultFee);
      const base={clientId:cid,date:g.date,time:g.time,fee:f,ucretsiz:!!g.ucretsiz,note:g.note,status:g.status};
      if(g.ucretsiz)base.packageSaleId=null; /* önceden paketten düşmüşse paketi geri ver */
      if(mevcutId){Store.update('appointments',mevcutId,base);savedRec=Store.find('appointments',mevcutId);kayitlar.push(savedRec)}
      else{
        const every=Number(g.tekrar);
        if(every>0){
          const rid=uid();const cnt=Math.min(52,Math.max(2,Number(g.tekrarSayisi)||8));
          for(let i=0;i<cnt;i++){
            const r2=Store.add('appointments',Object.assign({},base,{date:addDays(g.date,i*7*every),recurringId:rid,status:i===0?base.status:'planlandi'}));
            kayitlar.push(r2);if(i===0)savedRec=r2;
          }
        }else{savedRec=Store.add('appointments',base);kayitlar.push(savedRec)}
      }
      if(savedRec&&savedRec.status==='geldi')Store.applyPackage(savedRec);
    };
    Store.toplu(yaz); // tekrarlı randevu / yeni danışan + randevu: tek touch (emit/saveLocal/schedule bir kez)
    return {ok:true,mesaj:yeniDanisan?'Danışan eklendi, randevu kaydedildi ✓':'Randevu kaydedildi',kayit:savedRec,kayitlar,yeniDanisan};
  },

  /* girdi doğrulaması (kayıttan önce view da çağırır: çakışma sorusu hatalı formda sorulmasın). Hata: {ok:false,hata,alan} · geçerliyse null */
  randevuDogrula(g){
    if(g.yeniDanisan&&!(g.yeniDanisan.name||'').trim())return {ok:false,hata:'Yeni danışanın adını yazın',alan:'yeniAd'};
    if(!g.yeniDanisan&&!g.clientId)return {ok:false,hata:'Danışan seçin',alan:'clientId'};
    return null;
  },

  /* KUL2 çakışma (saf): aynı tarih + aynı başlangıç saatinde, durumu planlandı/geldi olan BAŞKA randevu (yoksa null).
     Seans süresi alanı yok → yalnız başlangıç saati; iptal/gelmedi/revize saati meşgul etmez. */
  cakisanRandevu(g,mevcutId){
    return Store.col('appointments').find(a=>a.id!==mevcutId&&a.date===g.date&&a.time===g.time&&(a.status==='planlandi'||a.status==='geldi'))||null;
  },

  /* KUL2: kaydedilecek randevu(lar)ın dolu saate denk gelenleri → [{tarih,kayit}] + toplam sayı.
     Kaydedilen kaydın kendisi iptal/gelmedi/revize ise saati tutmaz → çakışma yok. Tekrarlı yeni randevuda her tarih ayrı sınanır
     (tarih üretimi randevuKaydet ile aynı: addDays(tarih,i*7*tekrar), en az 2, en çok 52). */
  cakismalar(g,mevcutId){
    const durum=g.status||'planlandi';
    if(durum!=='planlandi'&&durum!=='geldi')return {toplam:1,liste:[]};
    const every=mevcutId?0:Number(g.tekrar);
    const toplam=every>0?Math.min(52,Math.max(2,Number(g.tekrarSayisi)||8)):1;
    const liste=[];
    for(let i=0;i<toplam;i++){
      const tarih=every>0?addDays(g.date,i*7*every):g.date;
      const k=Islem.cakisanRandevu({date:tarih,time:g.time},mevcutId);
      if(k)liste.push({tarih,kayit:k});
    }
    return {toplam,liste};
  },

  randevuSil(id){Store.remove('appointments',id);return {ok:true,mesaj:'Randevu silindi'}},

  /* durum değiştirme (V-F6): yazar; "geldi" ise aktif paketten düşer. Dönüş ek alanı: paket (düşülen satış | null) */
  randevuDurumu(id,durum){
    if(!Store.find('appointments',id))return {ok:false,hata:'Randevu bulunamadı'};
    Store.update('appointments',id,{status:durum});
    if(durum!=='geldi')return {ok:true,mesaj:'Durum güncellendi',paket:null,kayit:Store.find('appointments',id)};
    const sale=Store.applyPackage(Store.find('appointments',id));
    const kayit=Store.find('appointments',id);
    if(sale)return {ok:true,mesaj:'Seans paketten düşüldü — '+sale.name+': kalan '+Store.saleUsage(sale).remaining,paket:sale,kayit};
    if(kayit.ucretsiz)return {ok:true,mesaj:'Ücretsiz seans işlendi',paket:null,kayit};
    return {ok:true,mesaj:'Seans işlendi — '+money(kayit.fee)+' borca yazıldı',paket:null,kayit};
  },

  /* ertele/revize (V-F7): yeni randevu Randevu formundan kaydedildikten sonra ESKİ kaydı "revize" yapar */
  randevuErtele(eskiId){
    const kayit=Store.update('appointments',eskiId,{status:'revize'});
    return {ok:true,mesaj:'Eski randevu "Revize" olarak kayıtta tutuldu',kayit};
  },

  /* WhatsApp hatırlatma metni (saf). Q18: yer tutucuların HEPSİ, şablondaki HER geçişte doldurulur. Tek geçişli
     regex: değerin kendisi "{saat}" gibi bir şey içerse bile yeniden işlenmez. */
  waMetni(c,a){
    const s=Store.data.settings;
    const deger={ad:c.name.split(' ')[0],saat:a.time||'',tarih:fmtD(a.date),klinik:s.clinicName||''};
    return (s.waTemplate||'Merhaba {ad}, {tarih} saat {saat} randevunuzu hatırlatırız. {klinik}')
      .replace(/\{(ad|saat|tarih|klinik)\}/g,(_,k)=>deger[k]);
  },

  /* ---------- tahsilat (V-F8) · manuel düzeltme (V-F9) ---------- */
  /* g: {clientId,amount,date,method,note} */
  tahsilatKaydet(g){
    if(!g.clientId)return {ok:false,hata:'Danışan seçin',alan:'clientId'};
    const v=Number(g.amount);
    if(!v||v<=0)return {ok:false,hata:'Geçerli bir tutar girin',alan:'amount'};
    const kayit=Store.add('payments',{clientId:g.clientId,amount:v,date:g.date,method:g.method,note:g.note});
    return {ok:true,mesaj:money(v)+' tahsilat kaydedildi',kayit};
  },

  /* para iadesi (Sena 10-27): fazla ödenen tutar danışana geri verilince. g: {clientId,amount,date,method,note} — amount POZİTİF girilir,
     EKSİ ödeme olarak yazılır (iade:true) → bakiye ve o ayın tahsilat geliri birlikte düşer */
  iadeKaydet(g){
    if(!g.clientId)return {ok:false,hata:'Danışan seçin',alan:'clientId'};
    const v=Number(g.amount);
    if(!v||v<=0)return {ok:false,hata:'Geçerli bir tutar girin',alan:'amount'};
    const kayit=Store.add('payments',{clientId:g.clientId,amount:-v,iade:true,date:g.date,method:g.method,note:g.note});
    return {ok:true,mesaj:money(v)+' iade kaydedildi',kayit};
  },

  /* g: {clientId,amount,date,note} — amount İŞARETLİ: artı borç ekler, eksi borç siler (form işareti
     FormVM.duzeltmeTutari ile seçiciden üretir; geçersiz tutar oraya null gelir → hata) */
  duzeltmeKaydet(g){
    if(!g.clientId)return {ok:false,hata:'Danışan seçin',alan:'clientId'};
    if(!Number(g.amount))return {ok:false,hata:'Geçerli bir tutar girin',alan:'amount'};
    const kayit=Store.add('adjustments',{clientId:g.clientId,amount:Number(g.amount),date:g.date,note:g.note});
    return {ok:true,mesaj:'Kaydedildi',kayit};
  },

  /* ---------- gelir / gider / kişisel (V-F10, V-F11) ---------- */
  /* g: {type,category,amount,date,note} */
  islemKaydet(g,mevcutId){
    const v=Number(g.amount);
    if(!v||v<=0)return {ok:false,hata:'Geçerli bir tutar girin',alan:'amount'};
    const rec={type:g.type,category:g.category,amount:v,date:g.date,note:g.note};
    const kayit=mevcutId?Store.update('transactions',mevcutId,rec):Store.add('transactions',rec);
    return {ok:true,mesaj:'Kaydedildi',kayit};
  },
  islemSil(id){Store.remove('transactions',id);return {ok:true,mesaj:'Kayıt silindi'}},

  /* ---------- tekrarlayan ödeme (V-F13, V-F14) ---------- */
  /* g: {name,type,category,amount,dayOfMonth} — gün için 1–28 sınırı kodda YOK (yalnız input min/max) */
  tekrarlayanKaydet(g,mevcutId){
    if(!(g.name||'').trim())return {ok:false,hata:'Ad girin',alan:'name'};
    if(!Number(g.amount))return {ok:false,hata:'Tutar girin',alan:'amount'};
    const rec={name:g.name.trim(),type:g.type,category:g.category,amount:Number(g.amount),dayOfMonth:Number(g.dayOfMonth)||1,active:true};
    const kayit=mevcutId?Store.update('recurring',mevcutId,rec):Store.add('recurring',rec);
    return {ok:true,mesaj:'Kaydedildi',kayit};
  },
  tekrarlayanSil(id){Store.remove('recurring',id);return {ok:true,mesaj:'Tekrarlayan ödeme silindi'}},

  /* ---------- paket tanımı (V-F15, V-F16) ---------- */
  /* g: {name,sessions,price,note} */
  paketKaydet(g,mevcutId){
    if(!(g.name||'').trim())return {ok:false,hata:'Paket adı girin',alan:'name'};
    if(!(Number(g.sessions)>1))return {ok:false,hata:'Seans sayısı en az 2 olmalı',alan:'sessions'};
    if(!(Number(g.price)>0))return {ok:false,hata:'Fiyat girin',alan:'price'};
    const rec={name:g.name.trim(),sessions:Number(g.sessions),price:Number(g.price),note:g.note};
    const kayit=mevcutId?Store.update('packages',mevcutId,rec):Store.add('packages',rec);
    return {ok:true,mesaj:'Paket kaydedildi',kayit};
  },
  paketSil(id){Store.remove('packages',id);return {ok:true,mesaj:'Paket tanımı silindi'}}, // satılmış paketlere (packageSales) dokunmaz

  /* ---------- paket satışı (V-F17) ---------- */
  /* g: {clientId,packageId,sessions,price,date,method} — satış + aynı tutarda ödeme kaydı */
  paketSat(g){
    if(!g.clientId)return {ok:false,hata:'Danışan seçin',alan:'clientId'};
    if(!(Number(g.sessions)>1))return {ok:false,hata:'Seans sayısı en az 2 olmalı',alan:'sessions'};
    if(!(Number(g.price)>0))return {ok:false,hata:'Fiyat girin',alan:'price'};
    const t=Store.find('packages',g.packageId);
    let sale,odeme;
    Store.toplu(()=>{ // satış + ödeme tek touch
      sale=Store.add('packageSales',{clientId:g.clientId,packageId:g.packageId||null,
        name:t?t.name:Number(g.sessions)+' seanslık paket',
        sessions:Number(g.sessions),price:Number(g.price),date:g.date,method:g.method});
      odeme=Store.add('payments',{clientId:g.clientId,amount:Number(g.price),date:g.date,
        method:g.method,note:'Paket satışı: '+sale.name,packageSaleId:sale.id});
    });
    return {ok:true,mesaj:'Paket satıldı — '+money(sale.price)+' gelir olarak işlendi',kayit:sale,odeme};
  },

  /* ---------- bekleme listesi (V-F18, V-F19) — başarıda toast YOK ---------- */
  /* g: {name,phone,note} */
  beklemeKaydet(g,mevcutId){
    if(!(g.name||'').trim())return {ok:false,hata:'Ad gerekli',alan:'name'};
    const rec={name:g.name.trim(),phone:(g.phone||'').trim(),note:g.note};
    const kayit=mevcutId?Store.update('waitlist',mevcutId,rec):Store.add('waitlist',rec);
    return {ok:true,kayit};
  },
  beklemeSil(id){Store.remove('waitlist',id);return {ok:true,mesaj:'Bekleme kaydı silindi'}},

  /* ---------- ekranlardaki doğrudan yazmalar (C2b) ---------- */

  /* "Öde ✓" (V-D1 ana ekran uyarısı · V-N1 Finans > Tekrarlayanlar): kayıttaki SABİT tutarla bir gider/kişisel işlemi yazar.
     tarih: view'dan (todayStr()) gelir — model "bugün"ü bilmez. Tutar düzenlenemez. */
  tekrarlayanOde(recId,tarih){
    const r=Store.find('recurring',recId);
    if(!r)return {ok:false,hata:'Tekrarlayan ödeme bulunamadı'};
    const kayit=Store.add('transactions',{type:r.type,category:r.category,amount:r.amount,date:tarih,note:r.name,recurringId:r.id});
    return {ok:true,mesaj:r.name+' işlendi',kayit};
  },

  /* Danışanın BUGÜNDEN SONRAKİ (tarih > bugün; bugün DAHİL DEĞİL) 'planlandi' randevuları (Q15; salt okur).
     bugun: 'YYYY-MM-DD' (verilmezse todayStr()). Onay metnindeki sayı (DanisanVM.silOnayi) ve danisanSil AYNI listeyi kullanır. */
  ileriRandevular(id,bugun){
    const t=bugun||todayStr();
    return Store.col('appointments').filter(a=>a.clientId===id&&a.status==='planlandi'&&a.date>t);
  },
  /* Danışanı sil (V-C1) — danışan kaydı yumuşak silinir; Q15: bugünden sonraki planlanmış randevuları da silinir
     (boşa gelen hatırlatma/takvim doluluğu olmasın). Geçmiş randevu, ödeme, düzeltme ve paket kayıtlarına DOKUNULMAZ.
     Onay (UI.confirm) ve yönlendirme view'ın işi. */
  danisanSil(id,bugun){
    const ileri=Islem.ileriRandevular(id,bugun);
    Store.toplu(()=>{ileri.forEach(a=>Store.remove('appointments',a.id));Store.remove('clients',id)}); // tek touch
    return {ok:true,mesaj:'Danışan silindi'+(ileri.length?' · '+ileri.length+' ileri tarihli randevusu da silindi':'')};
  },

  /* Ayarlar > Genel > Kaydet (V-S1). g: {clinicName,assistantName,defaultFee,inactiveWeeks,debtWarn,waTemplate} HAM değerler.
     Ayar nesnesi İŞLEM ANINDA Store.data.settings'ten okunur (eşitleme Store.data'yı yeni nesneyle değiştirebilir;
     ekran kurulurken yakalanan nesne bayatlayabilir). */
  ayarlarKaydet(g){
    Object.assign(Store.data.settings,{clinicName:g.clinicName,assistantName:g.assistantName,defaultFee:Number(g.defaultFee)||0,
      inactiveWeeks:Number(g.inactiveWeeks)||3,debtWarn:Number(g.debtWarn)||3000,waTemplate:g.waTemplate});
    Store.touchSettings();
    return {ok:true,mesaj:'Kaydedildi'};
  },

  /* JSON yedeği indirilince (D2): settings.sonYedekAt = şimdi. Ayar damgalı yazılır → eşitlenir (kim alırsa alsın, kliniğin tek yedeği).
     Ayar nesnesi İŞLEM ANINDA Store.data.settings'ten okunur. */
  yedekAlindi(){
    Store.data.settings.sonYedekAt=nowIso();
    Store.touchSettings();
    return {ok:true};
  },

  /* Yedekten geri yükleme — 1/2: SAF doğrulama (E3). metin: seçilen dosyanın içeriği.
     Dönüş: {ok:false,hata} (JSON değil · yedek nesnesi değil · ayarlar yok · hiçbir koleksiyon yok · koleksiyon/kayıt bozuk)
     ya da {ok:true, ozet:{danisan,randevu,odeme,tarih}, veri}. `veri` = yalnız BİLİNEN alanlardan (schema · updatedAt ·
     settingsUpdatedAt · settings · COLS) kurulmuş temiz kopya; eksik koleksiyonlar [] olur, settings AYNEN alınır.
     Hiçbir alan kod olarak çalıştırılmaz (yalnız JSON.parse); bilinmeyen üst düzey anahtarlar atılır.
     ozet.* silinmemiş kayıt sayısı; tarih = kayıtların en yeni updatedAt günü ('YYYY-MM-DD') ya da null. */
  yedekDogrula(metin){
    let v;
    try{v=JSON.parse(metin)}catch(e){return {ok:false,hata:'Dosya geçerli bir yedek değil (JSON okunamadı)'}}
    const duzNesne=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
    if(!duzNesne(v))return {ok:false,hata:'Dosya bir Sena Panel yedeği değil'};
    if(!duzNesne(v.settings))return {ok:false,hata:'Yedekte ayarlar bölümü yok — Sena Panel yedeği değil'};
    if(!COLS.some(c=>Array.isArray(v[c])))return {ok:false,hata:'Yedekte hiçbir kayıt bölümü yok — Sena Panel yedeği değil'};
    const veri={schema:v.schema||1,updatedAt:v.updatedAt||'',settingsUpdatedAt:v.settingsUpdatedAt||'',settings:v.settings};
    let son='';
    for(const c of COLS){
      const liste=v[c]===undefined?[]:v[c];
      if(!Array.isArray(liste))return {ok:false,hata:'Yedekteki «'+c+'» bölümü bozuk'};
      for(const r of liste){
        if(!duzNesne(r)||typeof r.id!=='string'||!r.id)return {ok:false,hata:'Yedekteki «'+c+'» bölümünde bozuk kayıt var'};
        if(typeof r.updatedAt==='string'&&r.updatedAt>son)son=r.updatedAt;
      }
      veri[c]=liste;
    }
    const say=c=>veri[c].filter(r=>!r.deleted).length;
    return {ok:true,veri,ozet:{danisan:say('clients'),randevu:say('appointments'),odeme:say('payments'),tarih:son?son.slice(0,10):null}};
  },

  /* Yedekten geri yükleme — 2/2: mevcut TÜM veriyi yedekle DEĞİŞTİR (E3). veri: yedekDogrula(...).veri.
     Eşitleme kayıt bazında «updatedAt yenisi kazanır» birleştirdiği için düz bir Store.data ataması diğer cihaza GEÇMEZ
     (uzaktaki yeni kayıtlar geri gelir, eski yedek kayıtları kaybeder). Bu yüzden:
     · yedekteki her kayıt AYNI anda damgalanır (updatedAt=şimdi) → uzaktaki sürümlerden yeni sayılır;
     · yedekte OLMAYAN canlı kayıtlar yumuşak silinir (deleted + şimdi) → karşı cihazdan da kalkar;
     · ayarlar yedektekilerdir, settingsUpdatedAt=şimdi.
     Tek Store.touch (dirty + yerel kayıt + emit + eşitleme zamanlaması). Ekran/toast view'ın işi. */
  /* Görünümün çağırdığı yol (masa): GitHub bağlıysa ÖNCE uzaktaki güncel veri çekilir — bu cihazın henüz görmediği
     uzak kayıtlar da «yedekte yok → silindi» işaretini alsın, eşitlemede geri gelmesin. Çekilemezse veri DEĞİŞMEZ. */
  async yedekGeriYukle(veri){
    if(Sync.cfg){
      if(Sync.pullP)await Sync.pullP;
      await Sync.pull();
      if(Sync.state!=='ok')return {ok:false,hata:'Önce eşitleme gerekiyor — internet bağlantısını kontrol edip yeniden deneyin. Veriler değiştirilmedi.'};
    }
    return Islem.yedekYukle(veri);
  },
  yedekYukle(veri){
    if(!veri||typeof veri!=='object'||!veri.settings||typeof veri.settings!=='object'||!COLS.every(c=>Array.isArray(veri[c])))
      return {ok:false,hata:'Yedek verisi geçersiz'};
    /* D2b — Ketty: Sena'nın tam yedeği yüklense bile kişisel kayıt/kategori Ketty'nin BELLEĞİNE girmez (Kasa.bol → yalnız ortak bölme);
       Store.kasa.ozelGecis'e dokunulmaz → uzak ozel bayt-eş kalır. Sena: tam veri. */
    const ketty=Store.user!==Store.SAHIP||(!!Store.kasa&&!Store.kasa.K_ozel);
    if(ketty)veri=Kasa.bol(veri).ortak;
    const simdi=nowIso(),mevcut=Store.data||blankData();
    const yeni={schema:veri.schema,updatedAt:simdi,settings:veri.settings,settingsUpdatedAt:simdi};
    for(const c of COLS){
      const yedekIdler=new Set(veri[c].map(r=>r.id));
      yeni[c]=veri[c].map(r=>({...r,updatedAt:simdi}));
      for(const r of (mevcut[c]||[])){
        if(yedekIdler.has(r.id))continue;
        yeni[c].push(r.deleted?r:{...r,deleted:true,updatedAt:simdi,updatedBy:Store.user});
      }
    }
    Store.data=yeni;
    Store.touch();
    return {ok:true,mesaj:'Yedek yüklendi'};
  },

  /* Ayarlar > Kategoriler > Kaydet (V-S2). g: {incomeCategories:'a, b', expenseCategories:'…', personalCategories:'…'}
     virgülle böl · kırp · boşları at. Yalnız bu üç anahtar yazılır; g'de olmayan anahtara dokunulmaz. */
  kategorilerKaydet(g){
    const s=Store.data.settings;
    for(const k of ['incomeCategories','expenseCategories','personalCategories']){
      if(k in g)s[k]=String(g[k]).split(',').map(x=>x.trim()).filter(Boolean);
    }
    Store.touchSettings();
    return {ok:true,mesaj:'Kategoriler güncellendi'};
  },

  /* Veri parolası kuralı (K2/Q11). yeni=true → YENİ parola belirleniyor (kilit ekranı ilk kurulum, Ayarlar'da değiştirme):
     en az 8 karakter; tekrar verildiyse (undefined değilse) aynı olmalı. yeni=false → mevcut veriyi AÇARKEN: eski kural
     (en az 4) — daha önce kurulmuş kısa parolalar açılabilsin. Saf: {ok:true} | {ok:false,hata}. */
  parolaKontrol(p,tekrar,yeni){
    p=p||'';
    if(!yeni)return p.length<4?{ok:false,hata:'Parola en az 4 karakter olmalı'}:{ok:true};
    if(p.length<8)return {ok:false,hata:'Parola en az 8 karakter olmalı'};
    if(tekrar!==undefined&&tekrar!==p)return {ok:false,hata:'Parolalar eşleşmiyor — tekrar yazın'};
    return {ok:true};
  },

  /* Ayarlar > Güvenlik > Değiştir (V-S3) — veri parolası. Store.touch ÇAĞRILMAZ (updatedAt/rev değişmez);
     yerel önbellek yeni parolayla yeniden şifrelenir, ardından eşitleme itilir (beklenmez). */
  async parolaDegistir(yeni){
    const kural=Islem.parolaKontrol(yeni,undefined,true);
    if(!kural.ok)return {ok:false,hata:kural.hata};
    /* D2a (en az değişiklik): bu kullanıcının KENDİ sarmaları yeni parolayla yeniden sarılır — yoksa önbellek/uzak zarf yeni parolayla açılmaz.
       Başka kullanıcının sarmasına dokunulmaz. Ayrıntılar (kurtarma sarması, kasa yokken) D2b'de. */
    const k=Store.kasa;
    if(k){
      const t=nowIso(),u=Store.user;
      const ortak=Object.assign({},k.anahtarlar.ortak,{[u]:await Kasa.sar(k.K_ortak,yeni,t)});
      const ozel=Object.assign({},k.anahtarlar.ozel);
      if(k.K_ozel&&ozel[u])ozel[u]=await Kasa.sar(k.K_ozel,yeni,t);
      k.anahtarlar={ortak,ozel};
    }
    Store.pass=yeni;localStorage.setItem(LS.pass,yeni);
    await Store.saveLocal();Sync.push();
    return {ok:true,mesaj:'Parola değiştirildi'};
  },

  /* ================= KASA KOMUTLARI (D2b) — davet · kurtarma · yeni kurtarma kodu. Şema/akış: src/model/KASA.md =================
     Hepsi {ok:true,...} | {ok:false,hata,alan?} döner; DOM'a dokunmaz. Başarısız komut Store/LS'ye HİÇBİR ŞEY yazmaz
     (doğrulamalar yazmadan önce biter; yazma en sonda). alan: 'kod' | 'parola' | 'tekrar'. */
  DAVET_SAAT:24,
  ESITLEME_GEREK_MESAJI:"Sena'nın cihazında önce eşitleme yapılmalı",

  /* yeni parola kuralı + hatanın hangi alana ait olduğu ('parola' kısa · 'tekrar' uyuşmuyor); geçerliyse null */
  _yeniParola(parola,tekrar){
    const p=parola||'',k=Islem.parolaKontrol(p,tekrar,true);
    return k.ok?null:{ok:false,hata:k.hata,alan:p.length<8?'parola':'tekrar'};
  },

  /* Ayarlar > «Ketty'nin cihazını ekle» / «Kendi cihazımı ekle» (yalnız Sena'nın cihazı, GitHub bağlı, kasa açık).
     kullanici: 'Ketty' (yükte K_ortak VAR) | 'Sena' (kendi başka cihazı; K_ortak YOK). ctx: {adres (location.href), simdi (ms/Date/ISO; test)}.
     → {ok, kod (gruplu; ekranda göster), url (adres#davet=<şifreli>), son (ISO, +24 saat)} */
  async davetUret(kullanici,ctx){
    ctx=ctx||{};
    if(Store.user!==Store.SAHIP)return {ok:false,hata:"Davet yalnız Sena'nın cihazından üretilebilir"};
    if(!Sync.cfg)return {ok:false,hata:'Önce GitHub bağlantısı kurulmalı — davet bağlantı bilgisini taşır'};
    if(!Store.kasa)return {ok:false,hata:'Kasa açık değil — önce kilidi açın'};
    if(kullanici!=='Ketty'&&kullanici!==Store.SAHIP)return {ok:false,hata:'Davet yalnız Ketty ya da kendi cihazınız için üretilir'};
    const cfg={branch:'main',path:'data.json.enc'};
    for(const k of Kurulum.ALANLAR.concat(['tokenBitis']))if(Sync.cfg[k])cfg[k]=Sync.cfg[k];
    const simdi=ctx.simdi==null?Date.now():new Date(ctx.simdi).getTime();
    const son=new Date(simdi+Islem.DAVET_SAAT*3600*1000).toISOString();
    const kod=Kasa.davetKoduUret();
    const sifreli=await Kasa.davetPaketle({cfg,kullanici,K_ortak:kullanici==='Ketty'?Store.kasa.K_ortak:null,son},kod);
    return {ok:true,kod,url:Kurulum.davetBaglantisi(sifreli,ctx.adres),son};
  },

  /* Davet kabulü 1. adım (D3a): kod doğru mu, davet KİMİN için — hiçbir şey yazmadan (LS · Store · Sync'e DOKUNMAZ, ağa çıkmaz).
     Kilit ekranı bununla 2. adımın (Ketty: yeni parola · Sena: mevcut parola) hangisi olacağını öğrenir. simdi: süre denetimi (test).
     → {ok:true,kullanici,son} | {ok:false,hata,alan:'kod'} (hata metni Kasa.davetCoz'dan aynen) */
  async davetOnizle(sifreli,kod,simdi){
    try{
      if(!sifreli)throw new Error('Davet eksik ya da bozuk');
      const y=await Kasa.davetCoz(sifreli,kod,simdi);
      return {ok:true,kullanici:y.kullanici,son:y.son};
    }catch(e){return {ok:false,hata:String(e&&e.message||e),alan:'kod'}}
  },

  /* Yeni cihazda davet kabulü. sifreli: Kurulum.davetParcasi(location.hash) · kod: davet kodu (küçük harf/boşluklu yazım tolere) ·
     form: {parola, tekrar} · simdi: süre denetimi için (verilmezse şimdi).
     Ketty: kendi parolasını BELİRLER (≥8, tekrar uyuşmalı) → anahtarlar.ortak.Ketty (varsa ÜZERİNE yazar = «parolamı unuttum») → gönderir.
     Sena (kendi cihazı): yeni parola YOK, mevcut Sena parolası → Store.kilitAc. Başarıda LS.user/LS.pass yazılır; ekranı açmak D3'ün işi.
     → {ok:true, mesaj, kullanici, esitlendi} | {ok:false,hata,alan?} */
  async davetKabul(sifreli,kod,form,simdi){
    form=form||{};const parola=form.parola||'';
    let y;
    try{y=await Kasa.davetCoz(sifreli,kod,simdi)}
    catch(e){return {ok:false,hata:String(e&&e.message||e),alan:'kod'}}
    const sena=y.kullanici===Store.SAHIP;
    if(sena){
      const k=Islem.parolaKontrol(parola,undefined,false);
      if(!k.ok)return {ok:false,hata:k.hata,alan:'parola'};
    }else{
      const k=Islem._yeniParola(parola,form.tekrar);
      if(k)return k;
      if(!y.K_ortak)return {ok:false,hata:"Davet eksik ya da bozuk — Sena'dan yenisini isteyin",alan:'kod'};
    }
    let uz;
    try{await Sync.testConfig(y.cfg);uz=await Sync.uzakMetin(y.cfg)}
    catch(e){return {ok:false,hata:String(e&&e.message||e)}}
    if(!uz)return {ok:false,hata:Islem.ESITLEME_GEREK_MESAJI};
    if(Kasa.surum(uz.metin)!==2)return {ok:false,hata:sena?'Uzak veri eski biçimde — önce ilk cihazda paneli açıp eşitleyin':Store.KETTY_V1_MESAJI};

    if(!sena){
      let c;
      try{c=await Kasa.ortakAc(uz.metin,y.K_ortak)}
      catch(e){return {ok:false,hata:"Davet bu veriyle uyuşmuyor — Sena'dan yenisini isteyin",alan:'kod'}}
      const sarma=await Kasa.sar(y.K_ortak,parola,nowIso());
      const anahtarlar={ortak:Object.assign({},c.anahtarlar.ortak,{[y.kullanici]:sarma}),ozel:Object.assign({},c.anahtarlar.ozel)};
      try{await Sync.baglan(y.cfg)}catch(e){return {ok:false,hata:String(e&&e.message||e)}}
      /* ---- buradan sonrası YAZMA ---- */
      Sync.shaYaz(uz.sha); // ortak veri uzakla aynı → ilk PUT bu sha'yla gider (yeni sarma uzakta yokken çekme turuna girmesin)
      Store.user=y.kullanici;Store.pass=parola;
      Store.kasa={anahtarlar,K_ortak:y.K_ortak,K_ozel:null,ozelGecis:Kasa.zarfOzel(uz.metin)};
      Store.data=c.ortakVeri;
      localStorage.setItem(LS.user,y.kullanici);localStorage.setItem(LS.pass,parola);
      Store.kirliIsaretle();
      await Store.saveLocal();
      await Sync.push();
      return {ok:true,mesaj:'Cihaz eklendi',kullanici:y.kullanici,esitlendi:Sync.state==='ok'};
    }

    /* Sena'nın kendi cihazı: parola, uzak zarfın Sena sarmasını açıyor mu? (yazmadan önce) */
    try{await Kasa.coz(uz.metin,{kullanici:y.kullanici,parola})}
    catch(e){
      const m=String(e&&e.message||e);
      return {ok:false,hata:m===Store.PAROLA_HATASI?'Parola hatalı':/anahtar yok/.test(m)?Store.KASA_YOK_MESAJI:m,alan:'parola'};
    }
    const oncekiCfg=localStorage.getItem(LS.cfg),oncekiUser=Store.user;
    try{await Sync.baglan(y.cfg)}catch(e){return {ok:false,hata:String(e&&e.message||e)}}
    const r=await Store.kilitAc(y.kullanici,parola);
    if(!r.ok){ // beklenmedik (ağ koptu / yarış): bağlantıyı geri al
      if(oncekiCfg==null)Sync.baglantiKes();else{localStorage.setItem(LS.cfg,oncekiCfg);Sync.resetRemote();Sync.init()}
      Store.user=oncekiUser;
      return {ok:false,hata:r.hata};
    }
    localStorage.setItem(LS.user,y.kullanici);localStorage.setItem(LS.pass,parola);
    await Store.saveLocal();
    return {ok:true,mesaj:'Cihaz eklendi',kullanici:y.kullanici,esitlendi:Sync.state==='ok'};
  },

  /* Kilit ekranı «Parolamı unuttum» (yalnız Sena). Kaynak zarf: yerel önbellek; yoksa (GitHub bağlıysa) uzak metin.
     Yalnız Sena'nın ortak.Sena + ozel.Sena sarmaları yeni parolayla yeniden sarılır (t=şimdi); Ketty'nin ve kurtarma sarmalarına DOKUNULMAZ.
     → {ok:true,mesaj,esitlendi} | {ok:false,hata,alan?}  (yanlış/geçersiz kod → alan:'kod') */
  async kurtarmaIleSifirla(kod,yeniParola,tekrar){
    const kural=Islem._yeniParola(yeniParola,tekrar);
    if(kural)return kural;
    /* kaynak sırası: önce önbellek (gönderilmemiş yerel değişiklik kaybolmasın), kod onu açmazsa uzak (yeni kurtarma kodu başka
       cihazda üretilmiş olabilir — masa 10-14). Önbellekten açılınca uzaktaki farklar gönderimin 409 → çek turunda birleşir. */
    const yerel=localStorage.getItem(LS.cache);
    let metin=null,uzSha=null,c=null,ilkHata=null;
    if(yerel&&Kasa.surum(yerel)===2){
      try{c=await Kasa.kurtarmaIleCoz(yerel,kod);metin=yerel}catch(e){ilkHata=e}
    }
    if(!c&&Sync.cfg){
      let u;
      try{u=await Sync.uzakMetin()}catch(e){if(!ilkHata)return {ok:false,hata:String(e&&e.message||e)}}
      if(u&&Kasa.surum(u.metin)===2){
        try{c=await Kasa.kurtarmaIleCoz(u.metin,kod);metin=u.metin;uzSha=u.sha}catch(e){ilkHata=ilkHata||e}
      }
    }
    if(!c){
      if(ilkHata)return {ok:false,hata:String(ilkHata&&ilkHata.message||ilkHata),alan:'kod'};
      if(!yerel&&!Sync.cfg)return {ok:false,hata:'Kurtarma için veri bulunamadı — bu cihazda önbellek yok ve GitHub bağlı değil'};
      return {ok:false,hata:'Bu veride kurtarma kodu yok'};
    }
    const t=nowIso(),S=Store.SAHIP;
    const anahtarlar={
      ortak:Object.assign({},c.anahtarlar.ortak,{[S]:await Kasa.sar(c.K_ortak,yeniParola,t)}),
      ozel:Object.assign({},c.anahtarlar.ozel,{[S]:await Kasa.sar(c.K_ozel,yeniParola,t)})
    };
    /* ---- buradan sonrası YAZMA ---- */
    if(uzSha)Sync.shaYaz(uzSha);
    Store.user=S;Store.pass=yeniParola;
    Store.kasa={anahtarlar,K_ortak:c.K_ortak,K_ozel:c.K_ozel,ozelGecis:null};
    Store.data=Store._tamVeri(c);
    localStorage.setItem(LS.user,S);localStorage.setItem(LS.pass,yeniParola);
    Store.kirliIsaretle();
    await Store.saveLocal();
    await Sync.push();
    return {ok:true,mesaj:'Parola yenilendi',esitlendi:!Sync.cfg||Sync.state==='ok'};
  },

  /* Ayarlar > «Yeni kurtarma kodu üret» (yalnız Sena, kasa açık). ortak.kurtarma + ozel.kurtarma yeniden sarılır; ESKİ KOD ARTIK AÇMAZ.
     → {ok:true,kod} — kod tek sefer gösterilir (Store'da tutulmaz) | {ok:false,hata} */
  async yeniKurtarmaKodu(){
    const k=Store.kasa;
    if(Store.user!==Store.SAHIP||!k||!k.K_ozel)return {ok:false,hata:'Kurtarma kodunu yalnız Sena üretebilir'};
    const kod=Kasa.kurtarmaKoduUret(),n=Kasa.kodNormalize(kod),t=nowIso();
    const anahtarlar={
      ortak:Object.assign({},k.anahtarlar.ortak,{[Kasa.KURTARMA]:await Kasa.sar(k.K_ortak,n,t)}),
      ozel:Object.assign({},k.anahtarlar.ozel,{[Kasa.KURTARMA]:await Kasa.sar(k.K_ozel,n,t)})
    };
    k.anahtarlar=anahtarlar;
    Store.kirliIsaretle();
    await Store.saveLocal();
    await Sync.push();
    return {ok:true,kod};
  },

  /* D3 «Yazdım» düğmesi: ilk kurulumda bekleyen kurtarma kodu artık gösterilmesin */
  kurtarmaKoduGosterildi(){
    Store.bekleyenKurtarmaKodu=null;
    return {ok:true};
  }
};
/* ==== ornek_veri.js ==== */
/* Örnek (demo) veri — 12 aylık bir pratik üretir / temizler. DOM'a ve UI.*'ya dokunmaz; yalnız Store'a yazar.
   Üretim sabit tohumludur (rnd s=1907): aynı "bugün" → aynı kayıt sayıları, adlar, tutarlar (id/zaman damgaları hariç).
   Dönüş: {ok:true, mesaj} — toast/yönlendirme view'ın işidir. Kayıtlar Store.add yerine doğrudan itilir (kayıt başına
   şifreleme/eşitleme tetiklenmesin), en sonda TEK Store.touch(). */
const OrnekVeri={

  /* 12 aylık, ~17 danışanlık tutarlı bir demo pratiği kurar:
     düzenli/aralıklı danışanlar, no-show ve revizeler, paketler, borç–tahsilat
     akışı, ofis ve kişisel giderler, tekrarlayanlar ve bekleme listesi. */
  yukle(){
    const D=Store.data;const t=todayStr();
    const mon0=addDays(t,-((parseD(t).getDay()+6)%7));          // bu haftanın pazartesisi
    const rnd=(()=>{let s=1907;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}})();
    const asst=D.settings.assistantName||'Ketty';
    /* toplu ekleme — kayıt başına şifreleme/eşitleme tetiklenmesin */
    const push=(name,rec,when)=>{
      rec.id=uid();rec.createdAt=when||nowIso();rec.updatedAt=nowIso();
      rec.enteredBy=rec.enteredBy||(rnd()<0.7?asst:'Sena');
      rec.demo=true;
      (D[name]=D[name]||[]).push(rec);
      return rec;
    };
    const iso=d=>d+'T09:20:00.000Z';
    const bd=(offset,year)=>{const d=parseD(addDays(t,offset));
      return year+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
    const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time||'').localeCompare(b.time||'');

    /* ---- danışan kadrosu ----
       dow: 0=Pzt … 5=Cmt · ev: 1 haftalık, 2 iki haftada bir, 4 aylık, 0 randevusuz
       from/to: kaç hafta önce başladı / bitti (eksi = ileri haftalar) · pay: her|aylik|gec  */
    const CL=[
      {n:'Elif Yıldız',    p:'0532 111 22 33', fee:1500, src:'Tavsiye',    st:'aktif',      b:bd(3,1994),   dow:0, tm:'10:00', ev:1, from:52, to:-4, pay:'aylik', debt:0,
       note:'Yaygın kaygı. Haftalık düzenli. Nefes ve kademeli maruz bırakma çalışılıyor; ilerleme iyi.'},
      {n:'Murat Kaya',     p:'0533 222 33 44', fee:1500, src:'Instagram',  st:'aktif',      b:'1988-04-12', dow:1, tm:'14:00', ev:2, from:40, to:-3, pay:'gec',   debt:4,
       note:'İş stresi ve uyku sorunu. Ödemeleri toplu yapıyor, takip gerekiyor.'},
      {n:'Zeynep Demir',   p:'0534 333 44 55', fee:1800, src:'Google',     st:'aktif',      b:'1999-11-02', dow:2, tm:'16:00', ev:1, from:34, to:-2, pay:'aylik', debt:2,
       note:'Sınav kaygısı + aile ilişkileri. Seans notları ayrı dosyada.'},
      {n:'Ali Vural',      p:'0535 444 55 66', fee:1500, src:'Tavsiye',    st:'aktif',      b:'1979-06-30', dow:3, tm:'11:00', ev:2, from:48, to:-4, pay:'her',   debt:0},
      {n:'Selin Arslan',   p:'0536 555 66 77', fee:1200, src:'Instagram',  st:'aktif',      b:'2001-09-14', dow:4, tm:'17:00', ev:2, from:26, to:-1, pay:'her',   debt:0, pkg:'p5',
       note:'Öğrenci; paket kullanıyor. Seansları arada bir öteliyor.'},
      {n:'Hakan Çelik',    p:'0537 666 77 88', fee:1500, src:'Kurum',      st:'pasif',      b:'1985-02-21', dow:4, tm:'15:00', ev:1, from:44, to:6,  pay:'aylik', debt:0,
       note:'Kurum anlaşmasıyla geldi, iş değişikliği nedeniyle ara verdi.'},
      {n:'Derya Şahin',    p:'0538 777 88 99', fee:1500, src:'Tavsiye',    st:'tamamlandi', b:'1992-12-05', dow:1, tm:'13:00', ev:1, from:52, to:10, pay:'her',   debt:0,
       note:'Süreç hedeflerine ulaşarak tamamlandı. Gerekirse takip seansı planlanabilir.'},
      {n:'Burak Aydın',    p:'0539 100 20 30',fee:1500, src:'Web sitesi', st:'aktif',      b:'1996-08-19', dow:0, tm:'19:00', ev:1, from:3,  to:-4, pay:'her',   debt:1,
       note:'Yeni başladı. İlk 4 seans değerlendirme; akşam saatleri uygun.'},
      {n:'Ayşe Kılıç',     p:'0541 210 31 41',fee:1700, src:'Tavsiye',    st:'aktif',      b:'1975-03-08', dow:5, tm:'12:00', ev:4, from:50, to:-4, pay:'her',   debt:0,
       note:'Ayda bir destek seansı. Uzun süreli takip.'},
      {n:'Cem Yalçın',     p:'0542 320 41 52',fee:1500, src:'Google',     st:'aktif',      b:'1990-10-27', dow:2, tm:'18:00', ev:1, from:30, to:5,  pay:'aylik', debt:1,
       note:'Son haftalarda seansları aksadı, ileri randevusu yok — aranması iyi olur.'},
      {n:'Merve Tunç',     p:'0543 430 52 63',fee:1500, src:'Instagram',  st:'aktif',      b:'1998-05-16', dow:3, tm:'09:00', ev:1, from:20, to:-2, pay:'her',   debt:2, miss:0.22,
       note:'Sabah seanslarına sık gelemiyor; hatırlatma mesajı şart.'},
      {n:'Emre Doğan',     p:'0544 540 63 74',fee:1500, src:'Kurum',      st:'aktif',      b:'1983-01-23', dow:0, tm:'15:00', ev:1, from:14, to:-3, pay:'her',   debt:0, pkg:'p10',
       note:'Kurum yönlendirmesi. 10 seanslık paketle devam ediyor.'},
      {n:'Nazlı Ergün',    p:'0545 650 74 85',fee:1500, src:'Tavsiye',    st:'aktif',      b:'2000-07-11', dow:1, tm:'20:00', ev:1, from:18, to:-2, pay:'her',   debt:0, pkg:'p5b',
       note:'Akşam 20:00 sabit. Paketinde son seans kaldı.'},
      {n:'Onur Şen',       p:'0546 760 85 96',fee:1500, src:'Web sitesi', st:'aktif',      b:'1987-09-03', dow:4, tm:'13:00', ev:2, from:36, to:-4, pay:'aylik', debt:0},
      {n:'Pınar Aksoy',    p:'0547 870 96 07',fee:1500, src:'Instagram',  st:'aktif',      b:bd(1,1997),   dow:2, tm:'09:00', ev:1, from:7,  to:-4, pay:'her',   debt:1,
       note:'Yeni danışan, ilk ay. Sabah 09:00 tercih ediyor.'},
      {n:'Gülşen Aktaş',   p:'0548 980 07 18',fee:1600, src:'Diğer',      st:'aktif',      b:'1972-11-29', dow:5, tm:'10:00', ev:2, from:22, to:-4, pay:'her',   debt:0,
       note:'Kurum için rapor talebi oldu; rapor ücreti hesabına eklendi.'},
      {n:'Kerem Balcı',    p:'0549 190 18 29',fee:1500, src:'Google',     st:'aktif',      b:'1993-02-14', dow:3, tm:'17:00', ev:0, from:3,  to:3,  pay:'her',   debt:0,
       note:'Telefonla kaydoldu, ilk randevuya henüz gelmedi. Teyit için aranacak.'},
      {n:'Tuğçe Yaman',    p:'0550 240 11 22',fee:1500, src:'Tavsiye',    st:'aktif',      b:'1991-04-05', dow:4, tm:'10:00', ev:1, from:28, to:-3, pay:'aylik', debt:0,
       note:'Cuma sabahı sabit. İlişki danışmanlığı süreci.'},
      {n:'İpek Demirci',   p:'0551 350 22 33',fee:1600, src:'Google',     st:'aktif',      b:'1986-12-18', dow:2, tm:'11:00', ev:1, from:24, to:-2, pay:'her',   debt:0,
       note:'Yeni doğum sonrası destek. Haftalık.'},
      {n:'Kaan Uysal',     p:'0552 460 33 44',fee:1500, src:'Instagram',  st:'aktif',      b:'1994-06-08', dow:0, tm:'12:00', ev:2, from:30, to:-4, pay:'her',   debt:0},
      {n:'Mert Karaca',    p:'0553 570 44 55',fee:1500, src:'Web sitesi', st:'aktif',      b:'2002-03-26', dow:3, tm:'15:00', ev:1, from:12, to:-3, pay:'her',   debt:1,
       note:'Üniversite öğrencisi; motivasyon ve erteleme üzerine çalışılıyor.'},
      {n:'Yasemin Polat',  p:'0554 680 55 66',fee:1700, src:'Tavsiye',    st:'aktif',      b:'1981-08-30', dow:5, tm:'14:00', ev:2, from:20, to:-4, pay:'aylik', debt:0,
       note:'Cumartesi öğleden sonra. İki haftada bir görüşme.'}
    ];

    /* ---- danışanlar + randevu geçmişi ---- */
    CL.forEach(cfg=>{
      const firstDate=addDays(mon0,-cfg.from*7+cfg.dow);
      cfg._c=push('clients',{name:cfg.n,phone:cfg.p,fee:cfg.fee,source:cfg.src,status:cfg.st,
        birthDate:cfg.b,notes:cfg.note||''},iso(addDays(firstDate,-5)));
      if(!cfg.ev)return;
      let first=true;
      for(let w=cfg.from;w>=cfg.to;w--){
        if(cfg.ev>1&&((cfg.from-w)%cfg.ev))continue;
        const date=addDays(mon0,-w*7+cfg.dow);
        const fee=daysBetween(date,t)>200?Math.round(cfg.fee*0.8/50)*50:cfg.fee;
        let st;
        if(date>t)st='planlandi';
        else if(first)st='geldi';
        else{
          const r=rnd();const m=cfg.miss||0.06;
          st=r<m?'gelmedi':r<m+0.05?'revize':r<m+0.07?'iptal':'geldi';
        }
        if(date<=t)first=false;
        push('appointments',{clientId:cfg._c.id,date,time:cfg.tm,status:st,fee},iso(addDays(date,-7)));
      }
    });
    const C=n=>{const f=CL.find(x=>x.n===n);return f&&f._c};

    /* bugün ve yarın için ek seanslar — ana ekran dolu görünsün */
    const ek=(name,off,time)=>{const c=C(name);if(c)push('appointments',
      {clientId:c.id,date:addDays(t,off),time,status:'planlandi',fee:c.fee,note:'Ek seans'},iso(addDays(t,-3)))};
    ek('Ali Vural',0,'13:00');ek('Gülşen Aktaş',0,'16:00');
    ek('Zeynep Demir',1,'12:00');ek('Onur Şen',1,'18:00');
    ek('Ayşe Kılıç',2,'12:00');ek('Burak Aydın',3,'18:00');

    /* bugünün akışı: ilk iki seans tamamlandı, kalanlar planlı */
    D.appointments.filter(a=>a.date===t).sort(byDate)
      .forEach((a,i)=>{a.status=i<2?'geldi':'planlandi'});

    /* ---- seans paketleri ---- */
    const pkTpl={
      p5:push('packages',{name:'5 Seanslık Destek Paketi',sessions:5,price:6750,note:'%10 avantajlı'}),
      p10:push('packages',{name:'10 Seanslık Yol Arkadaşlığı',sessions:10,price:12750,note:'%15 avantajlı'})
    };
    push('packages',{name:'Çift Görüşmesi (3 seans)',sessions:3,price:5400,note:'60 dk yerine 80 dk'});
    const sell=(cfg,tpl,price,used)=>{
      const done=D.appointments.filter(a=>a.clientId===cfg._c.id&&a.status==='geldi'&&a.date<=t).sort(byDate);
      const take=done.slice(-used);
      const saleDate=take.length?addDays(take[0].date,-2):addDays(t,-30);
      const sale=push('packageSales',{clientId:cfg._c.id,packageId:tpl.id,name:tpl.name,
        sessions:tpl.sessions,price,date:saleDate,method:'havale'},iso(saleDate));
      push('payments',{clientId:cfg._c.id,amount:price,date:saleDate,method:'havale',
        note:'Paket satışı: '+tpl.name,packageSaleId:sale.id},iso(saleDate));
      const per=Math.round(price/tpl.sessions);
      take.forEach((a,i)=>{a.packageSaleId=sale.id;
        a.fee=(i===tpl.sessions-1)?(price-per*(tpl.sessions-1)):per});
      return sale;
    };
    sell(CL.find(x=>x.pkg==='p5'),pkTpl.p5,5400,5);      // Selin: paket bitti → yenileme fırsatı
    sell(CL.find(x=>x.pkg==='p10'),pkTpl.p10,12750,8);   // Emre: 8/10 kullanıldı
    sell(CL.find(x=>x.pkg==='p5b'),pkTpl.p5,6750,4);     // Nazlı: pakette son seans

    /* ---- tahsilatlar: paket dışı "geldi" seanslar üzerinden ---- */
    CL.forEach(cfg=>{
      if(!cfg._c)return;
      const done=D.appointments.filter(a=>a.clientId===cfg._c.id&&a.status==='geldi'
        &&!a.packageSaleId&&a.date<=t).sort(byDate);
      const leave=cfg.debt||0;
      const payable=leave?done.slice(0,Math.max(0,done.length-leave)):done;
      if(!payable.length)return;
      if(cfg.pay==='her'){
        payable.forEach((a,i)=>push('payments',{clientId:cfg._c.id,amount:Number(a.fee)||0,
          date:a.date,method:i%3===0?'kart':i%3===1?'nakit':'havale'},iso(a.date)));
      }else{
        const byM={};payable.forEach(a=>{(byM[monthKey(a.date)]=byM[monthKey(a.date)]||[]).push(a)});
        Object.keys(byM).sort().forEach((m,i)=>{
          const list=byM[m];const sum=list.reduce((s,a)=>s+(Number(a.fee)||0),0);
          let d=addDays(list[list.length-1].date,cfg.pay==='gec'?6:1);if(d>t)d=t;
          push('payments',{clientId:cfg._c.id,amount:sum,date:d,method:i%2?'havale':'nakit',
            note:'Toplu ödeme · '+monthLabel(m)},iso(d));
        });
      }
    });

    /* ---- manuel borç / indirim örnekleri ---- */
    const adj=(name,amount,off,note)=>{const c=C(name);if(c)push('adjustments',
      {clientId:c.id,amount,date:addDays(t,off),note},iso(addDays(t,off)))};
    adj('Gülşen Aktaş',750,-9,'Kurum için rapor ücreti');
    adj('Zeynep Demir',-500,-6,'Öğrenci indirimi');
    adj('Murat Kaya',300,-20,'Geç iptal ücreti');

    /* ---- tekrarlayanlar ---- */
    const rKira=push('recurring',{name:'Ofis kirası',type:'gider',category:'Kira',amount:16000,dayOfMonth:1,active:true});
    const rNet=push('recurring',{name:'İnternet',type:'gider',category:'İnternet',amount:480,dayOfMonth:15,active:true});
    const rMuh=push('recurring',{name:'Muhasebeci',type:'gider',category:'Muhasebe',amount:1500,dayOfMonth:10,active:true});
    const rSpor=push('recurring',{name:'Spor salonu üyeliği',type:'kisisel',category:'Abonelikler',amount:950,dayOfMonth:20,active:true});

    /* ---- ofis giderleri, kişisel harcamalar, ek gelirler (13 ay) ---- */
    const tr=(type,category,amount,date,note,recurringId)=>{
      if(date>t)return;
      push('transactions',{type,category,amount,date,note:note||'',recurringId},iso(date));
    };
    const mks=lastMonths(13);
    mks.forEach((mk,idx)=>{
      const age=mks.length-1-idx;                 // 0 = bu ay
      const day=dd=>mk+'-'+String(dd).padStart(2,'0');
      const mo=Number(mk.slice(5,7));
      const kira=age>=7?13500:16000;              // yıl içinde kira zammı
      const kis=Math.round(1+rnd()*0.35);
      tr('gider','Kira',kira,day(1),'Ofis kirası',rKira.id);
      tr('gider','Elektrik',(mo>=11||mo<=3)?1150+Math.round(rnd()*250):620+Math.round(rnd()*180),day(6));
      tr('gider','Su',240+Math.round(rnd()*90),day(8));
      if(age>0)tr('gider','Muhasebe',1500,day(10),'Muhasebeci',rMuh.id); // bu ay bilerek girilmedi → "gecikti" uyarısı
      tr('gider','İnternet',480,day(15),'',rNet.id);
      tr('gider','Aidat',900,day(3));
      if(mo>=11||mo<=3)tr('gider','Isınma',1900+Math.round(rnd()*400),day(12),'Doğalgaz');
      if(rnd()<0.7)tr('gider','Malzeme',280+Math.round(rnd()*420),day(18),rnd()<0.5?'Kırtasiye':'Kahve/su/temizlik');
      tr('gider','Temizlik',1200,day(24),'Haftalık temizlik');
      if(mo===2||mo===5||mo===8||mo===11)tr('gider','Vergi/SGK',4800,day(22),'Geçici vergi');
      /* kişisel */
      tr('kisisel','Market',3800+Math.round(rnd()*900),day(5));
      tr('kisisel','Market',3200+Math.round(rnd()*800),day(21));
      tr('kisisel','Ulaşım',1150+Math.round(rnd()*250),day(11));
      tr('kisisel','Abonelikler',950,day(20),'Spor salonu',rSpor.id);
      tr('kisisel','Abonelikler',330,day(14),'Dijital abonelikler');
      if(rnd()<0.45)tr('kisisel','Sağlık',900+Math.round(rnd()*1200),day(17));
      if(rnd()<0.4)tr('kisisel','Giyim',1400+Math.round(rnd()*1600),day(9));
      if(rnd()<0.5)tr('kisisel','Eğlence',600+Math.round(rnd()*900),day(23),'Sinema/yemek');
      if(rnd()<0.3)tr('kisisel','Ev',1800+Math.round(rnd()*2200),day(26));
      /* ek gelirler */
      tr('gelir','Süpervizyon',2500+(kis-1)*500,day(19),'Grup süpervizyonu');
      if(rnd()<0.35)tr('gelir','Eğitim/Atölye',3000+Math.round(rnd()*2000),day(13),'Farkındalık atölyesi');
      if(rnd()<0.3)tr('gelir','Rapor',1200,day(25),'Kurum raporu');
    });

    /* ---- bekleme listesi ---- */
    push('waitlist',{name:'Cem Öztürk',phone:'0539 888 99 00',note:'Çarşamba akşamları uygun'});
    push('waitlist',{name:'Aslı Güneş',phone:'0541 123 45 67',note:'Öğlen saatleri · tavsiye ile geldi'});
    push('waitlist',{name:'Tolga Erdem',phone:'0552 445 66 77',note:'Sadece cumartesi'});
    push('waitlist',{name:'Sibel Koç',phone:'0553 556 77 88',note:'Çift görüşmesi soruyor'});

    Store.touch();
    return {ok:true,mesaj:'Örnek veriler yüklendi'};
  },

  temizle(){
    for(const name of ['clients','appointments','payments','adjustments','transactions','recurring','waitlist','packages','packageSales']){
      (Store.data[name]||[]).forEach(r=>{if(r.demo){r.deleted=true;r.updatedAt=nowIso()}});
    }
    Store.touch();
    return {ok:true,mesaj:'Örnek veriler temizlendi'};
  }
};
/* ==== vm_dashboard.js ==== */
/* Ana ekran ViewModel'i — ekranın gösterdiği her şeyi DOM'suz hesaplar.
   durum({bugun,saat,simdi}) → düz veri (görünen metinler biçimlenmiş). Store'u okur, yazmaz.
   Not: Store.alerts / Store.clientStats gibi model yardımcıları kendi saatini (todayStr) kullanır;
   ctx.bugun bu dosyadaki süzgeç/başlık/özet hesaplarını yönlendirir (testler saati de sabitler). */
const DashVM={
  /* "Bugün/Yarın/Dün/<gün adı>/<tarih>" — util.relDay ile aynı kural, ama bugün ctx'ten gelir */
  _gunEtiketi(s,t){
    if(s===t)return'Bugün';if(s===addDays(t,1))return'Yarın';if(s===addDays(t,-1))return'Dün';
    const n=daysBetween(t,s);if(n>0&&n<7)return GUNLER[(parseD(s).getDay()+6)%7];return fmtD(s);
  },
  /* selamlamada kullanılan ad: giriş adı kısa olabilir (Ketty → Katayoun; Gökhan 10-14) */
  HITAP:{Ketty:'Katayoun'},
  _hitap(user){const ilk=String(user||'').split(' ')[0];return DashVM.HITAP[ilk]||ilk},
  _selam(saat){return saat<6?'İyi geceler':saat<12?'Günaydın':saat<18?'İyi günler':'İyi akşamlar'},
  /* K3a/K3.1: sınıf YÖNÜ değil ANLAMI taşır → 'iyi' | 'kotu' | 'flat'. iyiYon: 'artis' (seans, gelir) ya da 'azalis' (gider).
     Ok sembolü (▲/▼) yine YÖNÜ gösterir. Metin: sembol + tutar + 'fazla'/'az'; eşitse '— değişmedi'. Kıyas tabanı ayrı alandır (view alt satıra koyar). */
  _delta(now,before,bicim,iyiYon){
    const d=now-before;
    const iyi=d===0?null:(iyiYon==='azalis'?d<0:d>0);
    const sinif=iyi==null?'flat':iyi?'iyi':'kotu';
    if(d===0)return{sinif,metin:'— değişmedi'};
    return{sinif,metin:(d>0?'▲ ':'▼ ')+(bicim?bicim(Math.abs(d),true):num(Math.abs(d)))+(d>0?' fazla':' az')};
  },
  /* K3a/Q7: aynı-gün kıyası. Bu ayın 1..gün'ü ↔ geçen ayın 1..(aynı gün, geçen ay kısaysa ayın son günü).
     tam=true → karşılaştırılan geçen-ay aralığı geçen ayın TAMAMI (taban metni 'geçen aya göre'). */
  _kiyasAraligi(t){
    const mk=monthKey(t),onceki=addMonths(mk,-1);
    const gun=Number(t.slice(8,10));
    const oncekiUzunluk=daysBetween(onceki+'-01',mk+'-01');
    const oncekiSon=Math.min(gun,oncekiUzunluk);
    return{mk,onceki,gun,oncekiSon,tam:oncekiSon===oncekiUzunluk,
      taban:oncekiSon===oncekiUzunluk?'geçen aya göre':'geçen ayın aynı dönemine göre'};
  },
  _randevuSatiri(a,yarinMi){
    const c=Store.find('clients',a.clientId);
    const satir={
      saat:a.time||'—',ad:c?c.name:'?',
      altMetin:seansUcreti(a)+(a.note?' · '+a.note:''),
      durum:a.status,durumSinif:stChip(a.status),durumEtiket:stLabel(a.status),
      waGoster:false,waHref:null,
      randevu:a /* view tıklayınca Forms.apptActions(a)'ya verir */
    };
    if(yarinMi&&c&&c.phone&&a.status==='planlandi'){
      satir.waGoster=true;satir.waHref=waLink(c.phone,Islem.waMetni(c,a));
    }
    return satir;
  },
  _gunKarti(randevular,tarih,baslik,yarinMi){
    /* iptal ve revize bu kartlarda GİZLİ (takvimdekinden farklı) */
    const liste=randevular.filter(a=>a.date===tarih&&a.status!=='iptal'&&a.status!=='revize')
      .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    return{baslik,tarih,ipucu:liste.length?liste.length+' randevu':'',bos:!liste.length,
      randevular:liste.map(a=>DashVM._randevuSatiri(a,yarinMi))};
  },
  _uyariSatiri(al,bugun){
    const sev=al.sev==='crit'?'crit':al.sev==='serious'?'serious':al.sev==='good'?'good':al.sev==='info'?'info':'warn';
    const ikon=al.type==='borc'?'money':al.type==='odeme'?'wallet':al.type==='dogum'||al.type==='paket'?'gift':al.type==='token'?'lock':al.type==='yedek'?'download':'clock';
    let eylem=null;
    if(al.client){
      const klinik=Store.data.settings.clinicName;const ilkAd=al.client.name.split(' ')[0];
      if(al.type==='uzak'&&al.client.phone){
        eylem={tur:'wa-uzak',href:waLink(al.client.phone,HatirlatmaVM.waMetni(al.client))};
      }else if(al.type==='dogum'&&al.client.phone){
        eylem={tur:'wa-dogum',href:waLink(al.client.phone,'İyi ki doğdunuz '+ilkAd+'! Nice sağlıklı, huzurlu yaşlara 🎂 '+klinik)};
      }else{
        eylem={tur:'ac',danisanId:al.client.id,etiket:'Aç'};
      }
    }else if(al.rec){
      eylem={tur:'ode',recId:al.rec.id,tarih:bugun,etiket:'Öde ✓'};
    }else if(al.ayarlar){
      eylem={tur:'ayarlar',etiket:'Ayarlar',bolum:al.ayarlar}; /* view UI.go('set',bolum) yapar; Ayarlar o bölümü açık çizer */
    }else if(al.randevu){
      eylem={tur:'randevu',randevu:al.randevu,etiket:'İşaretle'}; /* view Forms.apptActions(randevu) açar */
    }else if(al.takvimGunu){
      eylem={tur:'takvim',tarih:al.takvimGunu,etiket:'Takvim'}; /* view TakvimVM.gunSec(tarih); UI.go('cal') */
    }
    return{baslik:al.title,altMetin:al.sub,sev,ikon,eylem};
  },
  /* K3a/Q14: durumu hâlâ 'planlandi' olan geçmiş seanslar — bugün saati geçmiş (saatsiz bugün SAYILMAZ: gün bitene kadar bekler)
     ya da son ISARETSIZ_GUN gün içinde. 1-3 adet: her biri ayrı satır; 4+: tek toplu satır (eylem: en eskinin gününü takvimde açar). */
  ISARETSIZ_GUN:7,
  ISARETSIZ_TOPLU_ESIK:3,
  _isaretsizSeanslar(t,simdi){
    const ilk=addDays(t,-DashVM.ISARETSIZ_GUN);
    const liste=Store.col('appointments').filter(a=>a.status==='planlandi'&&a.date>=ilk&&
      (a.date<t||(a.date===t&&!!a.time&&a.time<simdi)))
      .sort((a,b)=>a.date===b.date?(a.time||'').localeCompare(b.time||''):(a.date<b.date?-1:1));
    if(!liste.length)return[];
    if(liste.length>DashVM.ISARETSIZ_TOPLU_ESIK){
      return[{type:'isaretsiz',sev:'warn',toplu:liste.length,takvimGunu:liste[0].date,
        title:liste.length+' seansın durumu işaretlenmedi',
        sub:'En eskisi '+DashVM._gunEtiketi(liste[0].date,t)+" — takvimden 'Geldi / Gelmedi' işaretleyin"}];
    }
    return liste.map(a=>{
      const c=Store.find('clients',a.clientId);
      return{type:'isaretsiz',sev:'warn',randevu:a,
        title:(c?c.name:'?')+(a.time?' '+a.time:'')+' — Geldi mi?',
        sub:DashVM._gunEtiketi(a.date,t)+' · durum işaretlenmedi'};
    });
  },
  /* Store.alerts'in dışındaki uyarılar: erişim anahtarı bitişi (Sync) · aylık yedek hatırlatması (Store.yedekDurumu) · işaretlenmemiş seanslar */
  _ekUyarilar(t,simdi){
    const out=[];
    const td=Sync.tokenDurumu(t);
    if(td){
      out.push({type:'token',sev:td.seviye==='kritik'?'crit':'info',ayarlar:'github',
        title:td.kalanGun<0?'GitHub erişim anahtarının süresi doldu':'GitHub erişim anahtarı '+Sync.tokenKalanMetni(td.kalanGun),
        sub:'Bitiş: '+td.tarihMetni+" — Ayarlar > GitHub'dan yenileyin"});
    }
    const y=Store.yedekDurumu(t);
    if(y.hatirlat){
      out.push({type:'yedek',sev:'info',ayarlar:'yedek',title:'Aylık yedek zamanı',
        sub:(y.gunOnce==null?'Henüz yedek alınmadı':'Son yedek '+y.gunOnce+' gün önce')+' — Ayarlar > Yedekleme'});
    }
    return out.concat(DashVM._isaretsizSeanslar(t,simdi));
  },
  /* Store.alerts + ek uyarılar; ciddiyet sırası korunur, eşitlikte ek uyarılar önce gelir (kararlı sıralama).
     K3a/Q8: borç satırları (type 'borc') ana ekran listesinden SÜZÜLÜR — "Açık bakiyeler" kartı zaten gösterir
     (Store.alerts değişmez; raporlar etkilenmez). */
  _uyarilar(t,simdi,user){
    const sevOrder={crit:0,serious:1,warn:2,info:3,good:4};
    const kisiselVar=Gizlilik.kisiselGorur(user||Store.user); /* KUL2: kişisel tekrarlayan ödeme hatırlatması da Ketty'ye gitmez */
    return DashVM._ekUyarilar(t,simdi).concat(Store.alerts().filter(al=>al.type!=='borc'&&(kisiselVar||!(al.rec&&al.rec.type==='kisisel')))).sort((a,b)=>sevOrder[a.sev]-sevOrder[b.sev]);
  },

  durum(ctx={}){
    const t=ctx.bugun||todayStr();
    const saat=ctx.saat!=null?ctx.saat:new Date().getHours();
    /* ctx.simdi 'HH:MM'; yoksa ctx.saat varsa 'SS:00'; o da yoksa gerçek saat (işaretlenmemiş seans uyarısı için) */
    const p2=n=>String(n).padStart(2,'0');
    const simdi=ctx.simdi||(ctx.saat!=null?p2(ctx.saat)+':00':(()=>{const n=new Date();return p2(n.getHours())+':'+p2(n.getMinutes())})());
    const kiyas=DashVM._kiyasAraligi(t);
    const mk=kiyas.mk;
    const fin=Store.monthFin(mk);
    /* delta kıyası: bu ayın 1..bugün'ü ↔ geçen ayın 1..aynı gün'ü (kart DEĞERİ tüm ay kalır) */
    const finBu=Store.monthFin(mk,kiyas.gun),finOnceki=Store.monthFin(kiyas.onceki,kiyas.oncekiSon);
    const selam=DashVM._selam(saat);

    /* --- kartlar --- */
    const aylar=[];{let k=mk;for(let i=0;i<6;i++){aylar.unshift(k);k=addMonths(k,-1)}}
    const gelirSeri=aylar.map(m=>Store.monthFin(m).gelir);
    const seansSeri=aylar.map(m=>Store.monthFin(m).seansSayi);
    const bakiyeler=Store.col('clients').map(c=>({c,b:Store.balance(c.id)}));
    const acikBorc=bakiyeler.reduce((s,x)=>s+Math.max(0,x.b.kalan),0);
    const borclular=bakiyeler.filter(x=>x.b.kalan>0);
    const dSeans=DashVM._delta(finBu.seansSayi,finOnceki.seansSayi,n=>num(n)+' seans','artis');
    const dGelir=DashVM._delta(finBu.gelir,finOnceki.gelir,money,'artis');
    const dGider=DashVM._delta(finBu.gider,finOnceki.gider,money,'azalis'); /* gider AZALINCA iyi */
    const kartlar=[
      {kod:'seans',ad:'Bu ay seans',deger:num(fin.seansSayi),deltaMetni:dSeans.metin,deltaSinif:dSeans.sinif,deltaTaban:kiyas.taban,seri:seansSeri},
      {kod:'gelir',ad:'Bu ay gelir',deger:money(fin.gelir,true),deltaMetni:dGelir.metin,deltaSinif:dGelir.sinif,deltaTaban:kiyas.taban,seri:gelirSeri},
      {kod:'gider',ad:'Bu ay gider',deger:money(fin.gider,true),deltaMetni:dGider.metin,deltaSinif:dGider.sinif,deltaTaban:kiyas.taban,seri:null},
      {kod:'borc',ad:'Açık borç',deger:money(acikBorc,true),
        deltaMetni:borclular.length>0?borclular.length+' danışanda açık bakiye':null,
        deltaSinif:borclular.length>0?(acikBorc>0?'kotu':'flat'):null,deltaTaban:null,seri:null}
    ];

    /* --- bugün & yarın --- */
    const randevular=Store.col('appointments');
    const yarin=addDays(t,1);

    /* --- günün özeti (gider yalnız type 'gider': kişisel harcama hariç — ay kartıyla aynı; K3a/Q16) --- */
    const topla=l=>l.reduce((s,p)=>s+(Number(p.amount)||0),0);
    const yapilan=randevular.filter(a=>a.date===t&&a.status==='geldi');
    const tahsilat=Store.col('payments').filter(p=>p.date===t);
    const gider=Store.col('transactions').filter(x=>x.date===t&&x.type==='gider');

    /* --- uyarılar --- */
    const uyarilar=DashVM._uyarilar(t,simdi,ctx.user);

    /* --- açık bakiyeler --- */
    const acik=borclular.slice().sort((a,b)=>b.b.kalan-a.b.kalan);
    const esik=Store.data.settings.debtWarn||3000; /* Store.alerts ile aynı eşik; borç satırları artık «Dikkat gerekenler»de değil */

    return{
      selam,baslik:selam+', '+DashVM._hitap(Store.user)+' 🌿',altBaslik:fmtD(t,true),
      kartlar,
      bugun:DashVM._gunKarti(randevular,t,'Bugün',false),
      yarin:DashVM._gunKarti(randevular,yarin,'Yarın — hatırlatma gönderin',true),
      ozet:{seans:num(yapilan.length),tahsilat:money(topla(tahsilat),true),gider:money(topla(gider),true)},
      uyarilar:{sayi:uyarilar.length,ipucu:uyarilar.length?uyarilar.length+' uyarı':'',
        liste:uyarilar.slice(0,7).map(al=>DashVM._uyariSatiri(al,t))},
      acikBakiyeler:{bos:!acik.length,
        liste:acik.slice(0,6).map(({c,b})=>{
          const st=Store.clientStats(c.id);
          return{danisanId:c.id,ad:c.name,bas:initials(c.name),renk:avColor(c.name),
            altMetin:st.son?('son seans '+DashVM._gunEtiketi(st.son.date,t)):'',tutar:money(b.kalan),asim:b.kalan>=esik};
        })}
    };
  }
};
/* ==== vm_takvim.js ==== */
/* Takvim ViewModel'i — gezinti durumu (mod, çapa gün) + gün/hafta/ay görünümünün verisi, DOM'suz.
   Başlangıç modunu (dar ekranda 'day', geniş ekranda 'week') DOM bilgisi gerektirdiği için view yükleme anında ayarlar. */
const TakvimVM={
  mod:'week',
  capa:todayStr(),

  /* --- komutlar (yalnız gezinti durumunu değiştirir) --- */
  kaydir(yon){
    if(TakvimVM.mod==='day')TakvimVM.capa=addDays(TakvimVM.capa,yon);
    else if(TakvimVM.mod==='week')TakvimVM.capa=addDays(TakvimVM.capa,yon*7);
    else{TakvimVM.capa=addMonths(monthKey(TakvimVM.capa),yon)+'-01'}
  },
  bugune(bugun){TakvimVM.capa=bugun||todayStr()},
  gunSec(d){TakvimVM.capa=d;TakvimVM.mod='day'},
  modSec(m){TakvimVM.mod=m},

  /* "Bugün/Yarın/Dün/<gün adı>/<tarih>" — util.relDay ile aynı kural, bugün ctx'ten */
  _gunEtiketi(s,t){
    if(s===t)return'Bugün';if(s===addDays(t,1))return'Yarın';if(s===addDays(t,-1))return'Dün';
    const n=daysBetween(t,s);if(n>0&&n<7)return GUNLER[(parseD(s).getDay()+6)%7];return fmtD(s);
  },

  /* günün randevuları: durum süzgeci YOK (iptal/revize de görünür), saate göre sıralı */
  _gunun(randevular,d){
    return randevular.filter(a=>a.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  },
  _ilkAd(a){const c=Store.find('clients',a.clientId);return c?c.name.split(' ')[0]:'?'},
  _olay(a){return{metin:(a.time?a.time+' ':'')+TakvimVM._ilkAd(a),durum:a.status,randevu:a}},

  durum(ctx={}){
    const t=ctx.bugun||todayStr();
    const mod=TakvimVM.mod,capa=TakvimVM.capa;
    const randevular=Store.col('appointments');
    const byDate=d=>TakvimVM._gunun(randevular,d);
    const out={mod,capa,bugun:t,baslik:'',gun:null,hafta:null,ay:null};

    if(mod==='day'){
      out.baslik=TakvimVM._gunEtiketi(capa,t)+' · '+fmtD(capa);
      const kayitlar=byDate(capa).map(a=>{
        const c=Store.find('clients',a.clientId);
        return{saat:a.time||'—',ad:c?c.name:'?',
          altMetin:seansUcreti(a)+(a.recurringId?' · 🔁 düzenli':'')+(a.note?' · '+a.note:''),
          durum:a.status,durumSinif:stChip(a.status),durumEtiket:stLabel(a.status),randevu:a};
      });
      out.gun={bos:!kayitlar.length,bosMetni:'Bu gün için randevu yok',kayitlar};
    }
    else if(mod==='week'){
      const ws=weekStart(capa);
      out.baslik=fmtDShort(ws)+' – '+fmtDShort(addDays(ws,6));
      const gunler=[],liste=[];
      for(let i=0;i<7;i++){
        const d=addDays(ws,i);const l=byDate(d);
        gunler.push({tarih:d,kisaAd:GUNLER_K[i],tarihMetni:fmtDShort(d),bugunMu:d===t,olaylar:l.map(TakvimVM._olay)});
        /* dar ekran listesi: boş günler atlanır */
        if(l.length)liste.push({tarih:d,baslik:GUNLER[i]+' · '+fmtDShort(d),
          kayitlar:l.map(a=>{const c=Store.find('clients',a.clientId);
            return{saat:a.time||'—',ad:c?c.name:'?',durum:a.status,randevu:a}})});
      }
      out.hafta={gunler,liste,listeBos:!liste.length,listeBosMetni:'Bu hafta randevu yok'};
    }
    else{
      const mk=monthKey(capa);
      out.baslik=monthLabel(mk);
      const first=mk+'-01';
      const startOffset=(parseD(first).getDay()+6)%7;
      const gridStart=addDays(first,-startOffset);
      const hucreler=[];
      for(let i=0;i<42;i++){
        const d=addDays(gridStart,i);const l=byDate(d);
        hucreler.push({tarih:d,gunNo:String(Number(d.slice(8,10))),ayIci:monthKey(d)===mk,bugunMu:d===t,
          olaylar:l.slice(0,3).map(TakvimVM._olay),
          dahaMetni:l.length>3?'+'+(l.length-3)+' daha':null,
          toplamMetni:l.length?l.length+' randevu':null, /* K3.8: telefonda olay metni gizli → "+N daha" yerine toplam; hangisi görünür CSS'in işi */
          erisimAdi:fmtD(d)+(l.length?', '+l.length+' randevu':', randevu yok'),
          noktalar:l.slice(0,5).map(a=>a.status)});
      }
      out.ay={gunAdlari:GUNLER_K.slice(),hucreler,
        lejant:['planlandi','geldi','gelmedi','iptal','revize'].map(s=>({durum:s,ad:stLabel(s)}))}; /* K3.8 */
    }
    return out;
  }
};
/* ==== vm_danisanlar.js ==== */
/* Danışanlar (liste + detay) ViewModel'i — ekranın gösterdiği her şeyi DOM'suz hesaplar.
   Gezinti durumu (arama, filtre) burada durur; view yalnız çıktıyı çizer. Store'u okur, YAZMAZ.
   Not: Store.clientStats / relDay / fmtD saati kendileri okur (model katmanı) — `ctx.bugun` onlara geçmez. */
const DanisanVM={
  arama:'',
  filtre:'aktif',
  filtreSecenekleri:[['aktif','Aktif'],['borclu','Borçlu'],['hepsi','Hepsi'],['pasif','Ara verdi'],['tamamlandi','Tamamlandı']], /* Borçlu sık kullanılır: telefonda kaymadan görünsün */

  aramaYaz(q){DanisanVM.arama=String(q==null?'':q)},
  filtreSec(f){DanisanVM.filtre=f},

  /* Üstteki «Danışan ara» (Gökhan 10-22: her ekrandan ulaşılsın): ada (TR küçük harf) ya da iki telefondan birine göre,
     durumdan bağımsız; telefonda boşluk/tire yok sayılır (3+ rakam). En çok 8 sonuç, TR sıralı. */
  hizliAra(q){
    const s=String(q==null?'':q).trim().toLocaleLowerCase('tr');if(!s)return [];
    const r=s.replace(/\D/g,''),tel=p=>r.length>=3&&String(p||'').replace(/\D/g,'').includes(r);
    return Store.col('clients').filter(c=>c.name.toLocaleLowerCase('tr').includes(s)||tel(c.phone)||tel(c.phone2))
      .sort((a,b)=>a.name.localeCompare(b.name,'tr')).slice(0,8)
      .map(c=>({id:c.id,ad:c.name,bas:initials(c.name),renk:avColor(c.name),alt:c.phone||c.phone2||''}));
  },

  /* H-C1 + H-C2: süzülmüş danışan satırları + bekleme listesi */
  liste(ctx){
    const q=DanisanVM.arama.toLocaleLowerCase('tr');
    const f=DanisanVM.filtre;
    /* Q9: 'borclu' = kalan bakiyesi > 0 olanlar, durumdan BAĞIMSIZ (tamamlanmış danışanın açık borcu da görünür) */
    const uygun=c=>f==='hepsi'||(f==='borclu'?Store.balance(c.id).kalan>0:c.status===f);
    const list=Store.col('clients').filter(c=>uygun(c)&&
      (!q||c.name.toLocaleLowerCase('tr').includes(q)||(c.phone||'').includes(q)||(c.phone2||'').includes(q)));
    list.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
    const satirlar=list.map(c=>{
      const st=Store.clientStats(c.id);const b=Store.balance(c.id);
      let sag=null;
      if(b.kalan>0)sag={tur:'bakiye',metin:money(b.kalan),etiket:'açık bakiye'};
      else if(c.status==='aktif')sag={tur:'tamam',metin:'✓'};
      return {
        id:c.id,ad:c.name,bas:initials(c.name),renk:avColor(c.name),
        ozet:(st.toplam?st.toplam+' seans':'henüz seans yok')+
          (st.son?' · son: '+relDay(st.son.date):'')+
          (st.sonraki?' · sıradaki: '+relDay(st.sonraki.date):''),
        sag
      };
    });
    return {
      arama:DanisanVM.arama,filtre:f,filtreSecenekleri:DanisanVM.filtreSecenekleri,
      sayac:list.length+' danışan',bos:!list.length,satirlar,
      bosDurum:list.length?null:DanisanVM._bosDurum(f),
      bekleme:Store.col('waitlist').map(w=>({
        kayit:w,ad:w.name,bas:initials(w.name),
        ozet:(w.phone||'')+(w.note?' · '+w.note:''),telefon:w.phone||null
      }))
    };
  },

  /* K3.9: boş liste metni — hiç danışan yok (ekle düğmesi) · arama boş döndü · yalnız süzgeç boş döndü */
  _bosDurum(f){
    if(!Store.col('clients').length)return{tur:'hic',metin:'Henüz danışan yok',eylem:FormVM.ADLAR.danisanEkle};
    if(DanisanVM.arama.trim())return{tur:'arama',metin:"'"+DanisanVM.arama.trim()+"' ile eşleşen danışan yok",eylem:null};
    const ad=(DanisanVM.filtreSecenekleri.find(o=>o[0]===f)||[f,f])[1];
    return{tur:'suzgec',metin:f==='borclu'?'Borçlu danışan yok':'«'+ad+'» süzgecinde danışan yok',eylem:null};
  },

  /* Q15: silme onayı metni — ileri tarihli (bugünden sonra, planlandı) randevu varsa sayısı söylenir */
  silOnayi(id,bugun){
    const c=Store.find('clients',id);const n=Islem.ileriRandevular(id,bugun).length;
    return (c?c.name:'Danışan')+' silinsin mi? '+(n?'İleri tarihli '+n+' randevusu da silinir. ':'')+'Geçmişi de gizlenir.';
  },

  /* Detay: silinmiş/yok → null; yoksa ekranın çizdiği her şey */
  detay(id,ctx){
    const c=Store.find('clients',id);
    if(!c||c.deleted)return null;
    const st=Store.clientStats(id);const b=Store.balance(id);

    /* H-C3 */
    const durum={metin:c.status==='aktif'?'Aktif':c.status==='pasif'?'Ara verdi':'Tamamlandı',
      cip:c.status==='aktif'?'sage':c.status==='pasif'?'sand':'lav'};

    /* H-C4: EN YENİ satış (activeSale değil) */
    let aktifPaket=null;
    const mySales=Store.col('packageSales').filter(s=>s.clientId===id).sort((a,b)=>a.date<b.date?1:-1);
    if(mySales.length){
      const last=mySales[0];const u=Store.saleUsage(last);
      aktifPaket={
        sinif:u.remaining===0?'warn':'good',
        baslik:last.name+(u.remaining===0?' — tamamlandı':' — '+u.remaining+' seans kaldı'),
        alt:u.used+'/'+last.sessions+' kullanıldı · '+fmtD(last.date)+' tarihinde '+money(last.price)+' ile alındı',
        yuzde:Math.round(u.used/last.sessions*100)+'%',
        yenile:u.remaining===0,paketId:last.packageId
      };
    }

    /* H-C5 */
    const istatistik=[
      {etiket:'Toplam seans',deger:num(st.toplam),sinif:''},
      {etiket:'Gelmedi',deger:num(st.noshow),sinif:st.noshow>0?'neg':''},
      {etiket:'Revize / erteleme',deger:num(st.revize),sinif:''},
      {etiket:'Seans ücreti',deger:money(c.fee||Store.data.settings.defaultFee),sinif:''},
      {etiket:b.kalan>0?'Açık bakiye':'Bakiye',deger:b.kalan>0?money(b.kalan):'Kapalı ✓',sinif:b.kalan>0?'neg':'pos'}
    ];

    /* H-C6: hesap dökümü (en yeni önce, ilk 25) */
    const entries=[];
    Store.col('appointments').filter(a=>a.clientId===id&&a.status==='geldi').forEach(a=>entries.push({date:a.date,label:'Seans'+(a.time?' '+a.time:'')+(a.ucretsiz?' (ücretsiz)':''),amt:a.fee,dir:'borc'}));
    Store.col('adjustments').filter(j=>j.clientId===id).forEach(j=>entries.push({date:j.date,label:j.note||'Düzeltme',amt:j.amount,dir:'borc'}));
    /* para iadesi (eksi ödeme) borç yönünde yazılır: «+100 ₺ Para iadesi» — avans geri verildi */
    Store.col('payments').filter(p=>p.clientId===id).forEach(p=>{const yt='('+({nakit:'nakit',havale:'havale',kart:'kart'}[p.method]||p.method||'')+')';
      entries.push(p.amount<0?{date:p.date,label:'Para iadesi '+yt,amt:-p.amount,dir:'borc'}:{date:p.date,label:'Ödeme '+yt,amt:p.amount,dir:'odeme'})});
    entries.sort((a,b)=>a.date<b.date?1:-1);
    const dokum=entries.slice(0,25).map(en=>({
      etiket:en.label,tarih:fmtD(en.date),
      tutar:(en.dir==='odeme'||en.amt<0?'−':'+')+money(Math.abs(en.amt)),
      sinif:en.dir==='odeme'?'pos':'neg'
    }));

    /* H-C7: seanslar (en yeni önce, ilk 25) */
    const apps=Store.col('appointments').filter(a=>a.clientId===id).sort((a,b)=>a.date<b.date?1:-1);
    const seanslar=apps.slice(0,25).map(a=>({
      kayit:a,baslik:fmtD(a.date,true)+(a.time?' · '+a.time:''),
      not:a.note||null,durum:stLabel(a.status),cipSinif:stChip(a.status)
    }));

    return {
      id,kayit:c,ad:c.name,bas:initials(c.name),renk:avColor(c.name),
      durum,kaynak:c.source||null,
      telefon:c.phone||null,
      waLink:c.phone?waLink(c.phone,'Merhaba '+c.name.split(' ')[0]+', '):null,
      telefon2:c.phone2||null,
      waLink2:c.phone2?waLink(c.phone2,'Merhaba '+c.name.split(' ')[0]+', '):null,
      odemeOnerisi:b.kalan>0?b.kalan:'',
      silOnayi:DanisanVM.silOnayi(id),
      aktifPaket,istatistik,
      dokum:{bos:!entries.length,aciklama:'+ borç (seans, düzeltme) · − ödeme / indirim',satirlar:dokum},
      seanslar:{bos:!apps.length,satirlar:seanslar},
      not:c.notes||null
    };
  }
};
/* ==== vm_hatirlatma.js ==== */
/* Hatırlatmalar (Gökhan 10-22): en az 1 aydır (seçilebilir 1/2/3 ay) seansa gelmeyen, ileri randevusu olmayan danışanlar —
   aktif ve «ara verdi» olanlar (tamamlananlar değil). Yeni kopan önce (geri kazanması kolay). DOM'suz; Store'u YAZMAZ.
   «Ulaşıldı» işaretli olan ULASILDI_GUN gün boyunca alttaki «Ulaşılanlar» bölümüne iner (kim, hangi gün). */
const HatirlatmaVM={
  esik:30,
  ULASILDI_GUN:14,
  esikSecenekleri:[['30','1 ay'],['60','2 ay'],['90','3 ay']],
